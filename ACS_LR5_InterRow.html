<header class="top"><h1>Симулятор камерного підрулювання культиватора<small>Міжрядний обробіток просапних культур. Лабораторна робота №5, завдання 3</small></h1>

const AGG=[
{t:'МТЗ-82.1 (Беларус)',im:'Hatzenbichler, 6-рядний',n:6,a:70,lock:250},
{t:'John Deere 6120M',im:'Einböck, 8-рядний',n:8,a:75,lock:250},
{t:'New Holland T6.160',im:'New Holland SRC SmartSteer, 12-рядний',n:12,a:45,lock:250},
{t:'Fendt 312 Vario',im:'Steketee, 8-рядний',n:8,a:50,lock:250},
{t:'МТЗ-1221.3 (Беларус)',im:'Einböck (компактна рама), 12-рядний',n:12,a:50,lock:190},
{t:'Case IH Puma 150',im:'Hatzenbichler, 8-рядний',n:8,a:70,lock:250},
{t:'Claas Arion 550',im:'Einböck (компактна рама), 8-рядний',n:8,a:60,lock:190},
{t:'Deutz-Fahr 6165',im:'New Holland SRC SmartSteer, 12-рядний',n:12,a:50,lock:250}];
const CROPS=[{c:'цукрові буряки',st:'2–4 листки',ph:8},{c:'соняшник',st:'4–6 листків',ph:25},{c:'кукурудза',st:'V4–V6',ph:35},{c:'соя',st:'2–3 трійчасті листки',ph:12}];

function mkV(r_){const R=rng(hash([r_.group,r_.name,r_.num].join('|').toLowerCase().replace(/\s+/g,' '))),pk=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>Math.round(a+R()*(b-a)),rf=(a,b)=>a+R()*(b-a);
const a=pk(AGG),crop=pk(CROPS),L=ri(40,120)*10,slope=ri(0,120)/10,rw=f1(rf(1,4));
const rw_=[],trk=[],bump=[];let o=0,bp=0,nb=ri(60,160);const f1_=rf(18,40),f2_=rf(45,90),f3_=rf(5,9),a3=rf(.5,1.5),p1=rf(0,6.28),p2=rf(0,6.28),p3=rf(0,6.28);

fl:{press:R()<.25?f1(rf(14.2,16)):0,flow:R()<.25?ri(22,28):0,lens:R()<.25?1:0,mast:R()<.2?ri(8,16):0},

const hh=Math.max(120,70+crop.ph+20);V.ideal={h:hh,th:Math.round(Math.atan(105/hh)*57.3),mode:'RGB+3D',thr:0,led:1,aEnt:a.a,v:9,Gs:5,Ki:3,Dd:4,Qf:45,fl:{press:0,flow:0,lens:0,mast:0},lockEff:a.lock,zN:0,Z:5,seed:1};

rmax=.35*Q.Qf*(fl.press?.6:1)*(fl.flow?.55:1),G=.5*Q.Gs,Td=.05*Q.Dd,Ki=.25*Q.Ki,Tres=Math.max(.15-g.d/100/v,0)+.05,cb=.5*Math.abs(Q.aEnt-a.a),lim=Q.lockEff/10,lockT=a.lock/10;

const jit=fl.mast?(rg()-.5)*fl.mast*.25:0,P=V.trk[i]+D(x)+c+jit,xd=Math.max(0,x-v*Tres);

let err=rr(xd)-P+nz+cb,cmd;if(drop>0){cmd=-(c-Q.zN/10)*.5;drop-=v*dt;nd+=v*dt;I*=.99;ep=err}else{I=cl(I+err*dt,-30,30);const de=(err-ep)/dt;ep=err;dep+=(de-dep)*dt/.2;cmd=G*(err+Td*dep)+Ki*I}

function topSVG(xc){const o=PV.o,Z=PV.Z,a=V.a.a,W=PV.W||720,H=300,k=(W-30)/((W<500?1.7:2.3)*a),ky=24,y0=74,cx=W/2,rows=[-a/2,a/2],xa=xc+y0/ky,xb=Math.max(0,xc-(H-y0)/ky),Y=x=>y0+(xc-x)*ky,e0=pvE(xc,1),lost=o[cl(Math.round(xc),0,o.length-1)][3],q=PV.cfg.q||Qs({}),g=geo(V,q);
let s=`<rect width="${W}" height="${H}" fill="${PV.night?'#3a3528':SOIL}" opacity="${PV.night?1:.55}"/>`;
/* оброблені смуги позаду лап */
const edges=[];for(let x=xb;x<=xc+.001;x+=.5)edges.push([x,pvE(x,1)]);edges.push([xc,e0]);
const band=(l0,l1)=>{const A=edges.map(p=>r1(cx+(l0+p[1])*k)+','+r1(Y(p[0]))),B=edges.slice().reverse().map(p=>r1(cx+(l1+p[1])*k)+','+r1(Y(p[0])));return`<polygon points="${A.join(' ')} ${B.join(' ')}" fill="var(--plowed)" opacity=".62"/>`};
if(xc>xb){s+=band(-1.5*a,rows[0]-Z)+band(rows[0]+Z,rows[1]-Z)+band(rows[1]+Z,1.5*a)}
/* бур'яни */
const w=PV.w;let i0=0,hi=w.length;while(i0<hi){const m=(i0+hi)>>1;if(w[m][0]<xb)i0=m+1;else hi=m}
for(let i=i0;i<w.length&&w[i][0]<=xa;i++){const x=w[i][0],u=w[i][1];if(Math.abs(u)>1.14*a)continue;let alive=x>xc;if(!alive){const e=pvE(x,1);alive=rows.some(r=>u>r-Z+e&&u<r+Z+e)}if(Math.min(Math.abs(u-rows[0]),Math.abs(u-rows[1]))<1.2)continue;if(alive)s+=`<circle cx="${r1(cx+u*k)}" cy="${r1(Y(x))}" r="2.6" fill="${WEED}" stroke="#7c8329" stroke-width=".6"/>`}
/* рослини */
for(let x=Math.ceil(xb*2)/2;x<=xa;x+=.5)for(const r of rows){const cut=x<=xc&&Math.abs(pvE(x,1))>Z-1,px=cx+r*k,py=Y(x);s+=cut?`<path d="M${r1(px-5)},${r1(py-5)} l10,10 M${r1(px+5)},${r1(py-5)} l-10,10" stroke="var(--wn)" stroke-width="2.6" stroke-linecap="round"/>`:rosette(px,py,4.6)}
/* кадр камери попереду */
const fw=Math.min(g.W*k,W-8),fh=cl(g.W*.5/100*ky,18,30),fy0=Y(xc+g.d/100),off=fy0-fh/2<22,fy=off?22+fh/2:Math.min(fy0,y0-9-fh/2);s+=`<rect x="${r1(cx-fw/2)}" y="${r1(fy-fh/2)}" width="${r1(fw)}" height="${r1(fh)}" fill="var(--am)" opacity="${lost?.1:.2}" stroke="var(--am)" stroke-width="1.6" ${lost?'stroke-dasharray="6 4"':''}/>`+lab(cx,fy+4,lost?'камера: рядок втрачено':'кадр камери: '+F(f1(g.d/100))+' м попереду лап'+(off?' (за межами рисунка)':''),{a:'middle',c:lost?'var(--wn)':'var(--soilink)',halo:'#F2E6C8',s:11,w:lost?700:400});
/* брус і лапи */
const bl=(l0,l1)=>`<rect x="${r1(cx+(l0+e0)*k)}" y="${y0-7}" width="${r1(Math.max(0,(l1-l0)*k))}" height="14" rx="3" fill="${STEEL}"/>`;
s+=`<rect x="${r1(cx+(-1.5*a+e0)*k)}" y="${y0-3}" width="${r1(3*a*k)}" height="6" fill="var(--trk2)"/>`+bl(-1.5*a,rows[0]-Z)+bl(rows[0]+Z,rows[1]-Z)+bl(rows[1]+Z,1.5*a);
s+=`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>`+lab(8,H-10,'оброблено ↓',{c:'var(--soilink)',halo:'#F2E6C8',s:10.5})+lab(W-8,16,'напрям руху ↑',{a:'end',c:'var(--soilink)',halo:'#F2E6C8',s:10.5})+lab(8,16,'x = '+Math.round(xc)+' м із '+PV.V.L+' м',{c:'var(--soilink)',halo:'#F2E6C8',w:700});
return s}

PV.W=cl(Math.round(tv.clientWidth||720),300,720);tv.setAttribute('viewBox','0 0 '+PV.W+' 300');tv.innerHTML=topSVG(x);$('lp').innerHTML=zoneSVG(Z,e,'row');

if(l.dmg>1)a.push(`Пошкоджено ${F(l.dmg,1)} % рослин: збільште Z або зменште відхилення (див. криву «Z — пошкодження» у протоколі).`);

if(s.drop>6)a.push(`Камера не бачить рядка на ${F(s.drop,1)} % шляху: каретка тим часом повертається в нейтраль. Причини шукайте в режимі, порозі, чистоті об’єктива та геометрії камери.`);
if(x.sat>3)a.push(`Каретка стоїть на упорі ${x.sat} % шляху: знаряддя зносить на схилі далі, ніж дозволяє хід ±${F(x.lim)} см.`);
if(Math.abs(x.mean)>.8)a.push(`Знаряддя постійно зміщене на ${F(x.mean,1)} см в один бік: так проявляються малий Ki на схилі, зміщена нейтраль або каретка на упорі.`);
{const g=geo(V,x.q),tl=g.d/100/(L.v/3.6);if(tl<.15)a.push(`Виніс d = ${Math.round(g.d)} см за ${F(L.v)} км/год дає лише ${F(tl,2)} с запасу (d / v). Системі потрібно близько 0,15 с, щоб обробити кадр і зрушити каретку, тож запізнення компенсується не повністю: каретка реагує із запізненням.`);if(g.nv<V.nNeed)a.push(`У кадрі лише ${MR(g.nv)} (потрібно щонайменше ${V.nNeed}): положення рядка визначається менш надійно.`)}
if(s.rms>2&&L.Gs>=7)a.push('Велика чутливість: каретка «перелітає» рядок і коливається.');else if(s.rms>2&&L.Gs<=2.5)a.push('Мала чутливість: каретка не встигає за рядком.');
if(a.length==1&&s.dmg<=1)a.push('Рядок утримується впевнено: пошкодження в нормі, каретка працює в межах ходу.');
if(L.pin){const p=L.pin;a.push(`Порівняно із закріпленим станом: пошкодження ${F(p.dmg,1)} → ${F(s.dmg,1)} %, СКВ ${F(p.rms,1)} → ${F(s.rms,1)} см, втрата рядка ${F(p.drop,1)} → ${F(s.drop,1)} % шляху.`)}
return`<div class="concl"><b>Висновок.</b><ul>${a.map(q=>`<li>${q}</li>`).join('')}</ul></div>`}
function labTiles(x){const s=x.r,p=S.lab.pin,t=(nm,v,u,pv,good,dc)=>{let d='';if(pv!=null&&Math.abs(v-pv)>1e-9){const up=v>pv;d=`<em class="${good==null?'':up==good?'dn':'up'}">${up?'▲':'▼'} було ${F(pv,dc)}</em>`}return`<div><span>${nm}</span><b>${F(v,dc)}${u}</b>${d}</div>`};
return`<div class="kv">${t('пошкоджено рослин',s.dmg,' %',p&&p.dmg,false,1)}${t('знищено бур’янів',s.Wk,' %',p&&p.Wk,true,0)}${t('СКВ відхилення',s.rms,' см',p&&p.rms,false,1)}${t('найбільше |e|',s.mx,' см',p&&p.mx,false,1)}${t('камера без рядка',s.drop,' % шляху',p&&p.drop,false,1)}${t('каретка на упорі',x.sat,' % шляху',p&&p.sat,false,0)}${t('постійне зміщення',Math.round(x.mean*10)/10,' см',p&&p.mean,null,1)}${t('безпечна Z',x.zn??20,' см',p&&p.zn,false,1)}</div>`}
function labUpd(full){const L=S.lab;LR=labRun();const cfg={Z:L.Z,V:LR.Vx,lim:LR.lim,q:LR.q,ghost:L.pin?L.pin.o:null,ghostName:'закріплений стан',start:PV.o&&!full?PV.p:null};
if(full||!$('tv')||!PV.o)pvBind(LR.r.o,cfg);else{const p=PV.p;pvBind(LR.r.o,cfg);pvSeek(p)}
tradeChart($('lb_tr'),LR.r.o,L.Z,L.pin?L.pin.tr:null);$('lb_t').innerHTML=labTiles(LR);$('lb_c').innerHTML=labConcl(LR);$('lb_p').textContent=labPar();save()}
function labSet(k,v){S.lab[k]=v;const e=$('lv_'+k);if(e)e.textContent=F(v);labUpd()}
function labPin(){const L=S.lab,s=LR.r,e=s.o.map(p=>Math.abs(p[1])),tr=[];for(let z=2;z<=15;z+=.25)tr.push([z,100*e.filter(x=>x>z-1).length/e.length]);L.pin={o:s.o.map(p=>[p[0],p[1]]),tr,dmg:s.dmg,Wk:s.Wk,rms:s.rms,mx:s.mx,drop:s.drop,sat:LR.sat,mean:Math.round(LR.mean*10)/10,zn:LR.zn,par:labPar()};labUpd();$('lb_pn').textContent='Закріплено: '+L.pin.par}
function labLog(){const L=S.lab,s=LR.r;L.log.push({par:labPar(),dmg:s.dmg,Wk:s.Wk,rms:s.rms,mx:s.mx,drop:s.drop,sat:LR.sat});if(L.log.length>24)L.log.shift();save();$('lb_l').innerHTML=labLogHTML()}
function labLogHTML(){const g=S.lab.log;return g.length?`<div class="tw"><table class="t2 c"><tr><th>№</th><th style="text-align:left">Що задано</th><th>пошкоджено, %</th><th>бур’янів знищено, %</th><th>СКВ, см</th><th>макс. |e|, см</th><th>без рядка, %</th><th>на упорі, %</th></tr>${g.map((q,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${q.par}</td><td>${F(q.dmg,1)}</td><td>${F(q.Wk,0)}</td><td>${F(q.rms,1)}</td><td>${F(q.mx,1)}</td><td>${F(q.drop,1)}</td><td>${q.sat}</td></tr>`).join('')}</table></div><button class="g sm np" onclick="S.lab.log=[];save();$('lb_l').innerHTML=labLogHTML()">Очистити журнал</button>`:'<p class="note">Журнал порожній. Кнопка «Записати в журнал» додає сюди рядок із поточними числами — перенесіть таблицю в зошит.</p>'}
function labReset(){const e=S.lab.exp,I=V.ideal,bd=bestDet(V,{...I});S.lab={id:V.id,Z:V.Zopt,v:9,Gs:5,Ki:3,Dd:4,Qf:45,h:I.h,th:I.th,mode:bd.mode,thr:bd.thr,sl:V.slope,rw:1,f:{},exp:e,pin:null,log:S.lab.log,ver:2};R()}
function s9(){labInit();const L=S.lab,sl=(k,nm,mn,mx,st,u)=>`<div><label>${nm}: <b id="lv_${k}">${F(L[k])}</b>${u||''}</label><input type="range" min="${mn}" max="${mx}" step="${st}" value="${L[k]}" oninput="labSet('${k}',+this.value)"></div>`,
ck=(k,nm)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:5px 0"><input type="checkbox" ${L.f[k]?'checked':''} onchange="S.lab.f.${k}=this.checked;labUpd()">${nm}</label>`;
return`<h2>Досліди «що буде, якщо…»</h2><p class="hint">Агрегат і поле — вашого варіанта ${V.id}; нерівності рядків ті самі, що в останньому пробному проході. Досліди не змінюють протокол і бали.</p>${info(LAB)}
<div class="pc np">${EXP.map((e,i)=>`<button class="g sm ${L.exp==i?'on':''}" onclick="S.lab.exp=${i};save();R()">${e[0].split('.')[0]}</button>`).join('')}</div>
<div class="concl"><b>${EXP[L.exp][0]}.</b> ${EXP[L.exp][1]}</div>
<div class="lab-g">${sl('Z','Захисна зона Z',2,15,.5,' см')}${sl('v','Швидкість',6,14,.5,' км/год')}${sl('Gs','Чутливість (Gain)',0,10,.5)}${sl('Ki','Ki',0,10,.5)}${sl('Dd','Демпфування',0,10,.5)}${sl('Qf','Потік масла',15,70,5,' л/хв')}${sl('h','Висота камери h',60,250,5,' см')}${sl('th','Кут камери θ',0,70,1,'°')}${sl('thr','Поріг розпізнавання',0,100,1)}
<div><label>Режим розпізнавання</label><div class="pc" style="margin:2px 0">${['RGB','3D','RGB+3D'].map(m=>`<button class="g sm ${L.mode==m?'on':''}" onclick="S.lab.mode='${m}';save();R()">${m}</button>`).join('')}</div></div>${sl('sl','Схил поля',0,15,.1,' % (за паспортом '+F(V.slope)+' %)')}${sl('rw','Кривизна рядків ×',0,2,.5)}</div>
<div class="lab-g" style="margin-top:6px"><div>${ck('lens','забруднений об’єктив')}${ck('mst','люфт щогли камери 14 мм')}${ck('prs','низький тиск (15 МПа)')}${ck('flw','малий потік на виносі (25 л/хв)')}</div><div>${ck('neu','нейтраль каретки зміщено на 3 см')}${ck('stop','упори знято не до кінця (хід 60 %)')}${V.night?ck('dark','нічний обробіток без LED'):''}</div></div>
<div class="pc np"><button class="p sm" onclick="labPin()">Закріпити для порівняння</button><button class="g sm" onclick="labLog()">Записати в журнал</button><button class="g sm" onclick="labReset()">Скинути до рекомендованих</button><span class="note" id="lb_pn">${L.pin?'Закріплено: '+L.pin.par:''}</span></div>
<p class="note">Зараз задано: <span id="lb_p"></span></p><div id="lb_t"></div><div id="lb_c"></div><div class="ch" id="lb_tr"></div>${pvHTML()}
<h3>Журнал дослідів</h3><div id="lb_l">${labLogHTML()}</div><div class="nb np"><button class="g" onclick="go(7)">До кроку 7</button><button class="g" onclick="go(8)">До протоколу</button></div>`}

/* ===== Каркас: меню, термінал, тема, перемальовування ===== */
function u(k,v){S[k]=v;save();ds();navR()}
function go(i){S.step=i;save();R();scrollTo(0,0)}
function ds(){if(!V){$('ds').innerHTML='<div class="t">ТЕРМІНАЛ САК МК</div><div class="d"><span>Очікування</span><span>—</span></div>';return}
const l=S.tr.last,c=S.cal,r=[['Варіант',V.id],['Камера h/θ',S.h&&S.th?S.h+' см / '+S.th+'°':'—'],['Режим',S.mode],['Поріг',S.thr],['LED',S.led?'увімк.':'вимк.'],['Міжряддя',S.aE?vs(S.aE)+' см':'—'],['Z',S.Z?vs(S.Z)+' см':'—'],['Каретка Л/П',c.L&&c.R?F(c.L.raw)+' / '+F(c.R.raw):'—'],['Gain/Ki/Dd',F(S.Gs)+' / '+F(S.Ki)+' / '+F(S.Dd)],['Потік',S.Qf?vs(S.Qf)+' л/хв':'—'],['Швидкість',S.tr.v?vs(S.tr.v)+' км/год':'—'],['Спроб',S.tr.n],...(l?[['Пошкоджено',F(l.dmg,1)+' %'],['СКВ e',F(l.rms,1)+' см']]:[])];
$('ds').innerHTML='<div class="t">ТЕРМІНАЛ САК МК — ЖИВІ ПОКАЗАННЯ</div>'+r.map(x=>`<div class="d"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}
function theme(set){let t=null;try{t=localStorage.getItem(TKEY)}catch(e){}if(set!==0){t=t=='light'?'dark':t=='dark'?null:'light';try{t?localStorage.setItem(TKEY,t):localStorage.removeItem(TKEY)}catch(e){}}
if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');$('thb').textContent='Тема: '+(t=='light'?'світла':t=='dark'?'темна':'авто')}
function navR(){$('nv').innerHTML=TT.map((t,i)=>{const d=i>=1&&i<=7?done(i):0;return`<button class="${i==S.step?'on':''}${i==LAB?' lab':''}" ${!V&&i?'disabled':''} onclick="go(${i})" ${i==S.step?'aria-current="step"':''}>${i>=1&&i<=7?`<i class="${d==1?'ok':d?'pt':''}" title="${d==1?'заповнено':d?'заповнено частково':'не заповнено'}"></i>`:''}${t}</button>`}).join('')}
function R(){cancelAnimationFrame(PV.raf);PV.play=false;if(!V)S.step=0;navR();
$('bn').innerHTML=S.demo&&V?`<div class="bn np"><span><b>Відкрито приклад із методички</b> (варіант ${V.id}). Усі кроки вже заповнено — розгляньте їх, а для звіту отримайте власний варіант.</span><button class="p sm" onclick="newReg()">Отримати свій варіант</button></div>`:'';
$('chip').textContent=V?(S.demo?'приклад · ':'')+'варіант '+V.id:'варіант не видано';
$('mn').innerHTML=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9][S.step]();
const st=S.step;if(st==2)chk2();if(st==5)cv(S.pos);if(st==6)upd6();if(st==7)post7();if(st==8)post8();if(st==LAB)labUpd(1);ds()}

/* ===== Запуск ===== */
theme(0);
if(!S){demoState();save()}            /* перше відкриття: приклад із методички */
let RW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-RW)>8){RW=innerWidth;clearTimeout(R.t);R.t=setTimeout(R,180)}});
R();
</script></body></html>
