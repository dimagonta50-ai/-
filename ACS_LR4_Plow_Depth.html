<p class="hint">${S.demo?'Усі сім кроків уже заповнено так, як у прикладі з методички. Пройдіть їх по черзі, запустіть анімацію проходу, спробуйте досліди, а потім отримайте власний варіант.':`${esc(S.reg.name)}, група ${esc(S.reg.group)}, № ${S.reg.num}. Варіант однозначно визначається цими даними.`}</p>${info(0)}
<div class="fig"><div id="sc"></div><div class="cap">Агрегат варіанта в масштабі: ${a.t} і ${a.pl} (${a.n} корпусів по ${a.bw} см, ${a.mt}). Плуг піднято над полем.</div></div>

<button class="p" onclick="go(1)">${S.demo?'Переглянути приклад крок за кроком':'Почати налаштування'}</button> <button class="g" onclick="go(LAB)">Досліди «що буде, якщо…»</button> <button class="g" onclick="${S.demo?'newReg()':'rs()'}">${S.demo?'Отримати свій варіант':'Інший студент / скинути'}</button>`}
return`<h2>Реєстрація студента</h2><p class="hint">Введіть дані — симулятор видасть унікальний варіант: трактор, плуг і поле. Ті самі дані завжди дають той самий варіант.</p>

<p><button class="p" onclick="reg()">Отримати варіант</button> <button class="g" onclick="demo()">Відкрити приклад із методички</button></p>`}

const dyn1=()=>{const fx=Object.keys(FIX1).filter(k=>S.ck[k]=='Несправність');return(fx.length?`<p class="note">Позначено як несправність, виконано ремонт: ${fx.map(k=>FIX1[k]).join('; ')}.</p>`:'')+rb(1)};

function s1(){const r=rdg(),fl=V.fl,pv=fl.press||V.rd.p,tv=fl.temp||V.rd.t,cv=fl.cable?(fl.cable=='обрив'?null:0):V.rd.r,sv=fl.pos?0:V.rd.v,
sel=k=>`<select onchange="set1('${k}',this.value)" aria-label="Ваш висновок">${['—','Норма','Несправність'].map(o=>`<option ${S.ck[k]==o?'selected':''}>${o}</option>`).join('')}</select>`,

return`<h2>Крок 1. Перевірка комплектності та гідросистеми</h2><p class="hint">Зніміть показання чотирьох приладів і для кожного вузла вкажіть висновок. Зелена дуга на шкалі — норма. Якщо позначите «Несправність», вузол ремонтують. Нерозпізнана несправність залишиться в роботі й проявиться на пробному проході.</p>${info(1)}
<div class="gg">${card('p','Тиск у гідросистемі',gauge(pv,10,26,18,21,r.p+' МПа'),'норма 18–21 МПа')}${card('t','Температура масла',gauge(tv,20,110,20,80,r.t+' °C'),'норма до 80 °C')}${card('c','Тензопальці: опір моста',gauge(cv,0,700,330,370,r.c),'норма ≈ 350 Ом')}${card('s','Датчик положення: сигнал',gauge(sv,0,5,.5,4.5,r.s),'норма 0,5–4,5 В')}</div>
<div id="dyn1">${dyn1()}</div>`+navb(0,2)}

function s2(){const tin=(k,ph)=>`<input type="text" inputmode="decimal" value="${vs(S[k])}" placeholder="${ph||''}" oninput="u('${k}',this.value);live2()">`;
return`<h2>Крок 2. Параметри агрегату</h2><p class="hint">Внесіть параметри плуга з паспорта. Зверніть увагу на одиниці: ширину захвату система приймає в сантиметрах, масу в кілограмах.</p>${info(2)}${pass()}
<div class="r2"><div><label>Тип навішування</label><select onchange="u('ty',this.value)">${['—','навісний','напівнавісний'].map(o=>`<option ${S.ty==o?'selected':''}>${o}</option>`).join('')}</select></div><div><label>Категорія навіски (ISO 730)</label><select onchange="u('cat',this.value)">${['—','1','2','3','4','4N'].map(o=>`<option ${S.cat==o?'selected':''}>${o}</option>`).join('')}</select></div></div>
<div class="r2"><div><label>Кількість корпусів</label>${tin('n')}</div><div><label>Ширина захвату плуга, см</label>${tin('w','корпусів × ширина корпуса')}</div></div>
<label>Маса плуга, кг</label>${tin('pm')}
<div class="concl" id="lv2"></div><p class="note">Ці дані задають модель тягового опору R = k · b · h і компенсацію ваги плуга в датчиках зусилля.</p>${rb(2)}`+navb(1,3)}
function live2(){const e=$('lv2');if(!e)return;const w=n(S.w),pm=n(S.pm);let t='';
if(w!=null&&w>0){const b=w/100,Rr=V.km*b*V.hag/100;t+=`Перевірка розмірності: b = ${F(w)} см = ${F(b,2)} м. Тоді очікуваний тяговий опір на глибині ${V.hag} см: R = k<sub>ср</sub> · b · h = ${F(V.km,1)} · ${F(b,2)} · ${F(V.hag/100,2)} = <b>${F(Rr,1)} кН</b>.${Rr<8||Rr>140?' <span class="no">Для орного агрегату це неправдоподібно — перевірте одиниці.</span>':''}`}
if(pm!=null&&pm>0)t+=` Вага плуга: G = m · g = ${F(pm)} · 9,81 = <b>${F(pm*9.81/1000,1)} кН</b>.${pm<150?' <span class="no">Занадто мало: масу слід ввести в кілограмах.</span>':''}`;
e.innerHTML=t||'Тут з’явиться перевірка розмірності, щойно ви введете ширину захвату й масу.'}

function s3(){const c=S.cal,bt=(k,t)=>`<button class="g" onclick="fx('${k}')">${t}${c[k]?' ✓ '+F(c[k].raw)+' %':''}</button>`;
return`<h2>Крок 3. Калібрування крайніх положень навіски</h2><p class="hint">Підніміть навіску до упору вгору й опустіть до упору вниз (показання перестане змінюватися) і зафіксуйте обидва значення. Датчик показує сигнал у відсотках, зміщений відносно фізичного положення.</p>${info(3)}
<div class="sb"><div class="fig"><div id="hw"></div><div class="cap">Триточкова навіска в масштабі: 1 — нижні тяги, 2 — верхня тяга, 3 — підйомний важіль (на його валу жовтий датчик положення), 4 — підйомна тяга, 5 — гідроциліндр. В упорі червоний трикутник стає яскравим, а показання датчика більше не змінюється.</div></div>
<div class="vb"><span>сигнал датчика</span><div class="col"><i id="vbi"></i></div><b class="big" id="raw">—</b></div></div>
<input type="range" id="sl" min="-10" max="110" step="0.5" value="${S.pos}" oninput="mv(this.value)" aria-label="Положення навіски: ліворуч — униз, праворуч — угору">
<div class="pc"><button class="g sm" onclick="mv(+S.pos-0.5)">−0,5</button><button class="g sm" onclick="mv(+S.pos+0.5)">+0,5</button><span class="note">Повзунок: ліворуч — навіска вниз, праворуч — угору.</span></div>
<div>${bt('U','Зафіксувати верх')}${bt('D','Зафіксувати низ')}</div><p class="note">${c.U&&c.D?'Робочий хід датчика: '+F(f1(c.U.raw-c.D.raw))+' %. На його основі контролер переводить сигнал у глибину.':'Зафіксуйте обидва крайні положення — з них визначається шкала положення.'}</p>${rb(3)}`+navb(2,4)}
function mv(v){S.pos=+(+v).toFixed(1);const p=cl(S.pos,0,100),raw=f1(V.pOff+V.pG*p);$('raw').textContent=F(raw)+' %';$('sl').value=S.pos;$('hw').innerHTML=hitchSVG(p,{stops:1,sens:1,lbl:1});$('vbi').style.height=cl(raw,0,100)+'%';save()}
function fx(k){const p=cl(S.pos,0,100),tg=k=='U'?100:0;if(Math.abs(p-tg)>1&&!confirm('Навіска ще не в упорі — показання продовжило б змінюватись. Доведіть до упору. Зафіксувати все одно?'))return;S.cal[k]={raw:f1(V.pOff+V.pG*p),p};save();R()}

function s4(){const t=S.tare,g=V.a.pm*g_,vu=2.5+.02*.55*g,vd=2.5+.02*.1*g,st=S.hsq||'up',shown=t&&t.st==st?2.5:st=='up'?vu:vd;

<div class="sb"><div class="fig">${hitchSVG(st=='up'?100:53.3,{pin:1,G:st=='up'})}<div class="cap">Тензопалець стоїть у шарнірі нижньої тяги (жовте кільце). ${st=='up'?'Плуг висить на навісці: вся його вага йде через тяги.':'Плуг стоїть на ґрунті: майже всю вагу тримає ґрунт.'}</div></div>
<div class="gc" style="flex:0 1 220px;align-self:flex-start">${gauge(shown,0,5,2.44,2.56,F(shown,2)+' В')}<b>Сигнал тензопальця</b><small>нуль датчика 2,50 В${t&&t.st==st?' · після тарування':''}</small></div></div>
<div><button class="${st=='up'?'p':'g'}" onclick="S.hsq='up';R()">Плуг піднятий (висить на навісці)</button><button class="${st=='down'?'p':'g'}" onclick="S.hsq='down';R()">Плуг опущений на ґрунт</button></div>
<button class="p" onclick="tareDo()">Тарувати нуль</button> ${t?`<span class="bd${t.st=='up'?'':' w'}">виконано при ${t.st=='up'?'піднятому':'опущеному'} плузі</span>`:''}${rb(4)}`+navb(3,5)}
function tareDo(){const g=V.a.pm*g_,st=S.hsq||'up';S.tare={st,vb:(st=='down'?2.5+.02*.1*g:2.5+.02*.55*g).toFixed(2),va:'2,50'};save();R()}

const TXA=['Майже позиційний режим: глибина добре тримається на нерівностях, але опір не обмежується; на твердих ділянках двигун може перевантажуватись.','Змішаний режим: компроміс між точністю глибини й захистом двигуна. Підбирайте частку за картою ґрунтів і мікрорельєфом.','Майже силовий режим: двигун захищено, але глибина «плаває» зі зміною твердості ґрунту (виглиблення на важких ділянках).'];
const tx=v=>'→ '+TXA[v<25?0:v>75?2:1];
function fieldMap(el){if(!el)return;const W=Math.max(280,el.clientWidth||600),H=124,ml=4,pw=W-8,X=x=>ml+x/V.L*pw;let s='';
for(const q of V.secs){const x=X(q.x0),w=X(q.x1)-x,cx=x+w/2;s+=`<rect x="${x.toFixed(1)}" y="6" width="${w.toFixed(1)}" height="64" fill="${kcol(q.k)}" stroke="var(--soilink)" stroke-width=".8"/><text x="${cx.toFixed(1)}" y="${w>92?26:42}" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--soilink)">${w>62?'k ≈ ':''}${q.k}${w>86?' кПа':''}</text>`+(w>112?`<text x="${cx.toFixed(1)}" y="43" font-size="10.5" text-anchor="middle" fill="var(--soilink)">${soil(q.k)}</text>`:'')+(w>92?`<text x="${cx.toFixed(1)}" y="60" font-size="10.5" text-anchor="middle" fill="var(--soilink)">вологість ×${F(q.w,2)}</text>`:'')}
const pts=[];for(let x=0;x<V.L;x+=2)pts.push(X(x).toFixed(1)+','+(90+V.z[x]/V.zr*9).toFixed(1));
s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="${ml}" y="${H-5}" font-size="10.5" fill="var(--sub)">0 м</text><text x="${W-4}" y="${H-5}" font-size="10.5" fill="var(--sub)" text-anchor="end">${V.L} м</text><text x="${W/2}" y="${H-5}" font-size="10.5" fill="var(--sub)" text-anchor="middle">${W>420?'профіль поверхні: ':''}мікрорельєф ±${F(V.zr)} см (висоту збільшено)</text>`;
el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Карта ґрунтів і профіль поверхні гону">${s}</svg>`}
function s5(){return`<h2>Крок 5. Режим регулювання та поріг буксування</h2><p class="hint">Оберіть частку силового сигналу (Mix) за картою ґрунтів і мікрорельєфом та поріг буксування, за якого плуг піднімається. Мета — стабільна глибина без перевантаження двигуна.</p>${info(5)}
<div class="fig"><div id="fm"></div><div class="cap">Карта гону (${V.L} м): що темніша ділянка, то твердіший ґрунт; середній k<sub>ср</sub> ≈ ${F(V.km,1)} кПа. Чим більший розкид k між ділянками, тим менше доцільна силова частка; чим сильніший мікрорельєф, тим більше вона потрібна.</div></div>
<label>Частка силового сигналу (Mix)</label><div class="mix" id="mxb"><i style="width:${S.al}%">${mixT(S.al,'силовий')}</i><i style="width:${100-S.al}%">${mixT(100-S.al,'позиційний')}</i></div>
<input type="range" min="0" max="100" step="5" value="${S.al}" oninput="setMix(+this.value)" aria-label="Частка силового сигналу, відсотків"><div class="note" id="hal">${tx(S.al)}</div>
<label>Поріг буксування (Slip), %</label><input type="number" min="5" max="40" value="${S.thr}" oninput="u('thr',this.value);S.v5=1" style="max-width:160px"><p class="note">Коли буксування за даними радара перевищує поріг, плуг трохи піднімається. Занадто низький поріг дає часті підйоми, занадто високий — втрати палива й ущільнення ґрунту.</p>${rb(5)}`+navb(4,6)}
const mixT=(v,t)=>v>=38?t+' '+v+' %':v>=10?v+' %':'';
function setMix(v){S.al=v;S.v5=1;const b=$('mxb').children;b[0].style.width=v+'%';b[0].textContent=mixT(v,'силовий');b[1].style.width=(100-v)+'%';b[1].textContent=mixT(100-v,'позиційний');$('hal').textContent=tx(v);save();ds()}

function chk42(){const c=calc42();if(!c)return;for(const r of C42[V.odd?'A':'B']){const e=$('q_'+r[0]);if(!e)continue;const x=n((S.c42||{})[r[0]]),ref=c[r[2]];e.innerHTML=x==null?'':ref==null?'':Math.abs(x-ref)<=Math.max(r[3],.02*Math.abs(ref))?'<span class="ok">✓</span>':'<span class="no">✗</span>'}}
function c42HTML(){const c=calc42(),l=S.tr.last;if(!c)return'<p class="note">Дані з’являться після пробного проходу.</p>';
const dA=`S = ${V.S} га; G₀ = ${V.G0} л/га; C = ${V.C} грн/л; h_зад = ${F(c.h)} см; Δh_без = ${F(c.d0,1)} см; Δh_з = ${F(c.d1,1)} см; C_EHR = ${V.CE.toLocaleString('uk-UA')} грн`,
dB=`B = ${F(c.B,2)} м; τ = ${F(V.tau)}; t = ${V.tz} год; S = ${V.S} га; h_зад = ${F(c.h)} см; Δh_без = ${F(c.d0,1)} см; Δh_з = ${F(c.d1,1)} см; v₂ = ${F(c.v2,1)} км/год`,
note=`<p class="note">Δh — середнє абсолютне відхилення глибини від агровимоги на всьому гоні: «без» — силовий режим 100 % з типовими настройками, «з» — ваш останній прохід. v₂ — фактична середня швидкість вашого проходу.</p>`;
if(S.demo)return`<p><b>Варіант А.</b> ${dA}.</p><p class="note">p₁ = ${F(c.d0,1)} / ${F(c.h)} · 100 = ${F(c.p1,3)} %; p₂ = ${F(c.d1,1)} / ${F(c.h)} · 100 = ${F(c.p2,3)} %; ΔG = ${V.G0} · (${F(c.p1,3)} − ${F(c.p2,3)}) / 100 = ${F(c.dG,3)} л/га; E = ${V.S} · ${F(c.dG,3)} · ${V.C} ≈ ${(Math.round(c.E/10)*10).toLocaleString('uk-UA')} грн/рік; T = ${V.CE.toLocaleString('uk-UA')} / ${(Math.round(c.E/10)*10).toLocaleString('uk-UA')} ≈ ${F(c.T,1)} року.</p>
<p><b>Варіант Б.</b> ${dB}.</p><p class="note">v₁ = ${F(c.v2,1)} · (${F(c.h)} + ${F(c.d1,1)}) / (${F(c.h)} + ${F(c.d0,1)}) = ${F(c.v1,3)} км/год; W₁ = 0,1 · ${F(c.B,1)} · ${F(c.v1,3)} · ${F(V.tau)} = ${F(c.W1,4)} га/год; W₂ = 0,1 · ${F(c.B,1)} · ${F(c.v2,1)} · ${F(V.tau)} = ${F(c.W2,4)} га/год; приріст ${F(c.dW,1)} %; D₁ = ${V.S} / (${F(c.W1,4)} · ${V.tz}) = ${F(c.D1,1)} дня; D₂ = ${V.S} / (${F(c.W2,4)} · ${V.tz}) = ${F(c.D2,1)} дня.</p>${note}`;
const bad=c.d1>=c.d0?`<p class="no">Δh_з ≥ Δh_без: ваше налаштування тримає глибину не краще за базове, ефекту немає. Поверніться до кроку 7 і підстройте систему.</p>`:'';
return`<p>${V.odd?'Варіант А: '+dA:'Варіант Б: '+dB}.</p>${note}${bad}<div class="np"><p class="note"><b>Самоперевірка.</b> Порахуйте за формулами методички й введіть свої результати: симулятор покаже ✓ або ✗ (допуск 2 %), але правильних чисел не підкаже.</p><div class="r3">${C42[V.odd?'A':'B'].map(r=>c42Row(...r)).join('')}</div></div>`}

function post8(){const l=S.tr.last;if(!l)return;const hs=V.hag,K=x=>V.k[cl(Math.floor(x),0,V.L-1)];PV.o=l.o;PV.V=V;

function labInit(){if(S.lab&&S.lab.id==V.id)return;S.lab={id:V.id,al:S.al,Gs:S.tr.Gs,Dd:S.tr.Dd,dv:cl(Math.round(((n(S.tr.v)||V.vc)-V.vc)*2)/2,-2,2),thr:+S.thr||15,vd:S.vd,kh:1,zh:1,f:{},exp:0,pin:null,log:[]}}
function labField(){const L=S.lab;if(L.kh==1&&L.zh==1)return V;return Object.assign({},V,{k:V.k.map(k=>V.km+(k-V.km)*L.kh),z:V.z.map(z=>z*L.zh),secs:V.secs.map(q=>Object.assign({},q,{k:Math.round(V.km+(q.k-V.km)*L.kh)}))})}
function labRun(){const L=S.lab,a=V.a,Vx=labField(),o=sim4(Vx,{v:V.vc+L.dv,Gs:L.Gs,Dd:L.Dd,al:L.al/100,thr:L.thr,hset:V.hag,vdn:L.vd,recUp:rawU(),recDown:rawD()+(L.f.cal?.1*V.pG*100:0),dF:L.f.tare?.55*a.pm*g_:0,fl:{press:0,temp:L.f.tmp?90:0,cable:L.f.cab?'обрив':0,pos:0},bEnt:bT(),seed:hash(V.id)+4242});
return{o:o.map(p=>[p[0],f1(p[1]),Math.round(p[2]),f1(p[3]),f1(p[4])]),st:stats(o,V.hag),Vx}}
let LR=null;

function labConcl(r){const s=r.st,L=S.lab,a=[],o=r.o,sec=r.Vx.secs.map(q=>{const w=o.filter(p=>p[0]>=Math.max(q.x0,40)&&p[0]<q.x1);return w.length?{k:q.k,d:w.reduce((x,p)=>x+p[1],0)/w.length}:null}).filter(Boolean);

if(sec.length>1){const hd=sec.reduce((x,y)=>y.k>x.k?y:x),sf=sec.reduce((x,y)=>y.k<x.k?y:x);if(hd.k-sf.k>=4&&sf.d-hd.d>1.2)a.push(`На твердій ділянці (k ≈ ${hd.k} кПа) середня глибина ${F(hd.d,1)} см, на м’якій (k ≈ ${sf.k} кПа) — ${F(sf.d,1)} см: `+(L.al>=40||s.inb<85?'глибина «плаває» разом із ґрунтом — ознака завеликої частки силового сигналу.':'глибина трохи слідує за ґрунтом. Це ціна захисту двигуна силовим сигналом; поки різниця в межах допуску, компроміс прийнятний.'))}
if(s.ch>1.8)a.push(`Клапан працює ривками (активність ${F(s.ch,1)}): автоколивання — чутливість завелика або демпфування замале.`);else if(s.ch<.12&&s.sd>1.5)a.push('Клапан майже не працює: система повільно відпрацьовує збурення.');
if(s.ov>5)a.push(`Двигун перевантажено на ${s.ov} % шляху: опір не обмежується — частка силового сигналу замала або швидкість зависока.`);

if(a.length==1&&s.inb>=90)a.push('Глибина стабільна, двигун не перевантажений, клапан працює спокійно.');

<div class="pc np">${EXP.map((e,i)=>`<button class="g sm ${L.exp==i?'on':''}" onclick="S.lab.exp=${i};save();R()">${e[0].split('.')[0]}</button>`).join('')}</div>
<div class="concl"><b>${EXP[L.exp][0]}.</b> ${EXP[L.exp][1]}</div>
<div class="lab-g">${sl('al','Mix, частка силового',0,100,5,L.al,' %')}${sl('thr','Поріг Slip',5,40,1,L.thr,' %')}${sl('Gs','Чутливість',0,10,.5,F(L.Gs))}${sl('Dd','Демпфування',0,10,.5,F(L.Dd))}${sl('dv','Швидкість',-2,2,.5,F(V.vc+L.dv),' км/год')}${sl('vd','Швидкість опускання',10,100,5,L.vd,' %')}${sl('kh','Неоднорідність ґрунту ×',0,2,.5,F(L.kh))}${sl('zh','Мікрорельєф ×',0,2,.5,F(L.zh))}</div>
<div class="lab-g" style="margin-top:6px"><div>${ck('tare','нуль тензопальців не таровано')}${ck('cal','низ навіски знято не до упору (на 10 % ходу вище)')}</div><div>${ck('cab','обрив кабелю тензопальця')}${ck('tmp','перегріта олива (90 °C)')}</div></div>
<div class="pc np"><button class="p sm" onclick="labPin()">Закріпити для порівняння</button><button class="g sm" onclick="labLog()">Записати в журнал</button><button class="g sm" onclick="labReset()">Скинути до рекомендованих</button><span class="note" id="lb_pn">${L.pin?'Закріплено: '+L.pin.par:''}</span></div>
<p class="note">Зараз задано: <span id="lb_p"></span></p><div id="lb_t"></div><div id="lb_c"></div>${pvHTML()}
<h3>Журнал дослідів</h3><div id="lb_l">${labLogHTML()}</div><div class="nb np"><button class="g" onclick="go(7)">До кроку 7</button><button class="g" onclick="go(8)">До протоколу</button></div>`}

/* ===== Каркас: меню, дисплей, тема, перемальовування ===== */
function u(k,v){S[k]=v;save();ds();navR()}
function go(i){S.step=i;if(i==5)S.v5=1;save();R();scrollTo(0,0)}
function ds(){if(!V){$('ds').innerHTML='<div class="t">ДИСПЛЕЙ EHR</div><div class="d"><span>Очікування</span><span>—</span></div>';return}
const l=S.tr.last,r=[['Варіант',V.id],['Mix сил./поз.',S.al+'/'+(100-S.al)+' %'],['Slip',S.thr+' %'],['h_зад',S.hz?vs(S.hz)+' см':'—'],['Опускання',S.vd+' %'],['Верх. ліміт',S.ul+' %'],['Навіска Вг/Ни',S.cal.U&&S.cal.D?F(S.cal.U.raw)+' / '+F(S.cal.D.raw):'—'],['Нуль F',S.tare?'тарований':'—'],['Швидкість',S.tr.v?vs(S.tr.v)+' км/год':'—'],['Чутл./демпф.',F(S.tr.Gs)+' / '+F(S.tr.Dd)],['Спроб',S.tr.n],...(l?[['У допуску',l.st.inb+' %'],['h_ср гону',F(l.st.m,1)+' см']]:[])];
$('ds').innerHTML='<div class="t">ДИСПЛЕЙ EHR — ЖИВІ ПОКАЗАННЯ</div>'+r.map(x=>`<div class="d"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}
function theme(set){let t=null;try{t=localStorage.getItem(TKEY)}catch(e){}if(set!==0){t=t=='light'?'dark':t=='dark'?null:'light';try{t?localStorage.setItem(TKEY,t):localStorage.removeItem(TKEY)}catch(e){}}
if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');$('thb').textContent='Тема: '+(t=='light'?'світла':t=='dark'?'темна':'авто')}
function navR(){$('nv').innerHTML=TT.map((t,i)=>{const d=i>=1&&i<=7?done(i):0;return`<button class="${i==S.step?'on':''}${i==LAB?' lab':''}" ${!V&&i?'disabled':''} onclick="go(${i})" ${i==S.step?'aria-current="step"':''}>${i>=1&&i<=7?`<i class="${d==1?'ok':d?'pt':''}" title="${d==1?'заповнено':d?'заповнено частково':'не заповнено'}"></i>`:''}${t}</button>`}).join('')}
function R(){cancelAnimationFrame(PV.raf);PV.play=false;if(!V)S.step=0;if(S.step==LAB&&!V)S.step=0;
navR();
$('bn').innerHTML=S.demo&&V?`<div class="bn np"><span><b>Відкрито приклад із методички</b> (варіант ${V.id}). Усі кроки вже заповнено — розгляньте їх, а для звіту отримайте власний варіант.</span><button class="p sm" onclick="newReg()">Отримати свій варіант</button></div>`:'';
$('chip').textContent=V?(S.demo?'приклад · ':'')+'варіант '+V.id:'варіант не видано';
$('mn').innerHTML=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9][S.step]();
const st=S.step;if(st==0&&V)sceneBuild($('sc'),{d:-32});if(st==2)live2();if(st==3)mv(S.pos);if(st==5)fieldMap($('fm'));if(st==6)post6();if(st==7)post7();if(st==8)post8();if(st==LAB)labUpd(1);ds()}

/* ===== Запуск ===== */
theme(0);
if(!S){demoState();save()}            /* перше відкриття: приклад із методички */
let RW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-RW)>8){RW=innerWidth;clearTimeout(R.t);R.t=setTimeout(R,180)}});
R();
</script></body></html>
