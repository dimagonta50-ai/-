<header class="top"><h1>Симулятор автоматичного відводу садової фрези<small>Обробіток пристовбурних смуг у садах і виноградниках. Лабораторна робота №6, завдання 2 і 3</small></h1>
<div class="tools"><span class="chip" id="chip"></span><button class="g sm" id="thb" onclick="theme()" title="Перемкнути тему">Тема: авто</button></div></header>
<div id="bn"></div>
<div class="lay"><nav id="nv" aria-label="Кроки налаштування"></nav><main id="mn"></main><aside id="ds" aria-label="Термінал САК фрези"></aside></div></div>

<script>
/* ===== Модель (без змін відносно попередньої версії: ті самі варіанти, бали й коди протоколів) ===== */
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),f1=x=>Math.round(x*10)/10,n=x=>{const v=parseFloat(String(x).replace(',','.'));return isNaN(v)?null:v};

const AGG=[{t:'МТЗ-82.1 (Беларус)',D:40,o:12,dm:40},{t:'ЛТЗ-60АВ',D:40,o:10,dm:38},{t:'John Deere 5075GV',D:45,o:12,dm:42},{t:'New Holland T4.80F',D:50,o:12,dm:45},{t:'Fendt 209 V Vario',D:45,o:15,dm:45},{t:'Antonio Carraro TTR 4800',D:30,o:10,dm:35}];
const ORCH=[{c:'яблуня',st:[300,450]},{c:'груша',st:[350,500]},{c:'слива',st:[300,450]},{c:'черешня',st:[400,550]},{c:'персик',st:[400,500]}];
const kmh=v=>v*100/3.6;
function mkV(r_){const R=rng(hash([r_.group,r_.name,r_.num].join('|').toLowerCase().replace(/\s+/g,' '))),pk=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>Math.round(a+R()*(b-a)),rf=(a,b)=>a+R()*(b-a);
const a=pk(AGG),orch=pk(ORCH),young=R()<.45,st=Math.round(ri(orch.st[0],orch.st[1])/10)*10,nT=30;
const V={a,orch,young,r:young?ri(2,4):ri(8,14),st,nT,L:nT*st,sy:f1(rf(1,4)),grass:R()<.4?'висока':'низька',posts:R()<.35,Qh:ri(26,36),pn:f1(rf(16,18)),
fl:{press:R()<.25?1:0,temp:R()<.2?1:0,valve:R()<.25?1:0,sens:R()<.25?1:0},vp:4,v1:3.5,id:'С-'+(hash(r_.group+r_.name+r_.num)%900+100),
S:ri(30,90),N:pk([600,800,1000]),C:ri(12,18)*100,Cs:ri(8,12)*10000,B:0.8,tau:f1(rf(.72,.8)*100)/100,tz:8,p1:f1(rf(1.2,2.2)),odd:r_.num%2==1};
V.rd={p:V.fl.press?f1(V.pn-rf(3.5,5)):V.pn,t:V.fl.temp?ri(82,92):ri(48,62),c:V.fl.valve?f1(rf(.4,.6)):f1(rf(1.05,1.35)),s:V.fl.sens?f1(rf(9,14)):f1(rf(.8,2.4))};
V.ideal=idealQ(V);let g=2;for(;g<12;g++){const s=sim6(V,{...V.ideal,g,Dset:Math.min(a.dm,V.a.o+V.r*1.15+2*V.sy+g)});if(s.dmg==0&&s.scr==0)break}V.gopt=g;const s0=sim6(V,V.ideal);V.wkI=s0.wk;return V}
function idealQ(V){const gr=V.grass=='висока',tp=gr?'Лідар':V.young?'Ультразвук':'Щуп',Ts={Щуп:.03,Ультразвук:.06,Лідар:.12}[tp],o=V.a.o,umax=3.2*V.Qh,uo=75,g=3,D=Math.min(V.a.dm,o+V.r*1.15+2*V.sy+g),Tv=Ts+.02+.08+(o+V.r+g)/(umax*uo/100),d=Math.max(45,Math.round(kmh(V.vp)*Tv)+15),Tp=(d+V.a.D+g)/kmh(V.vp)+.03;
return{type:tp,d,p2:tp=='Щуп'?2.2:tp=='Ультразвук'?95:85,hm:28,uo,ui:70,Tp,g,Dset:D,v:V.vp,fl:{press:0,temp:0,valve:0,sens:0},seed:11}}
function det6(V,Q){const gr=V.grass=='висока'?1.5:.2,f=Q.fl;let Ts,pd,rf_;if(Q.type=='Щуп'){Ts=.03;pd=.99;rf_=gr*Math.max(0,1.5-Q.p2)/1.5+(f.sens?.5:0)}
else if(Q.type=='Ультразвук'){Ts=.06;const s=Q.p2;pd=cl(.55+.5*s/100-(V.r<5?.3*(1-s/100):0)+((Q.hm>=18&&Q.hm<=35)?0:-.15)-(f.sens?.1:0),0,1);rf_=gr*(Q.hm<25?1.4:.5)*(.3+1.4*s/100)+(f.sens?.8:0)}
else{Ts=.12;pd=.99-(f.sens?.05:0);rf_=gr*.02*(1-Q.p2/100)+.01+(f.sens?.3:0)}return{Ts,pd,rf:rf_,F:Q.type=='Щуп'?Q.p2+.05*Q.v*Q.v:0,Fmax:V.young?1.2:3.5}}

function event(V,Q,r,yo,det_,rg,noise){const a=V.a,h=hyd(V,Q),sp=det6(V,Q),gs=()=>noise?(rg()+rg()+rg()-1.5)*1.15:0,v=kmh(Q.v)*(1+.05*gs()),uo=h.umax*Q.uo/100,ui=h.umax*Q.ui/100,sd={Щуп:1,Ультразвук:3,Лідар:1}[Q.type],d=Q.d+gs()*sd,

{const Xs=X+T.d,xs=sx(Xs),us=9,yh=sy(us);if(xs<W+30){s+=`<line x1="${xs}" x2="${xs}" y1="24" y2="${yh}" stroke="var(--am)" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="${xs}" x2="${xs}" y1="${yh+8}" y2="${H-7}" stroke="${STEEL}" stroke-width="2.2"/><rect x="${r1(xs-5)}" y="${yh}" width="10" height="9" rx="2" fill="var(--am)" stroke="#5c3b00" stroke-width="1"/>`;

const INF=[
`<p><b>Ідея.</b> Садова фреза обробляє пристовбурну смугу збоку агрегату. Штамби — перешкоди <i>в самому ряду</i>, тому фреза має відійти від кожного дерева й повернутися після його проходу. Контур: <i>сенсор → блок керування → електромагніт і золотник → гідроциліндр → фреза → положення фрези → сенсор бачить наступне дерево</i>.</p>
<p><b>Головна задача — «перегони з часом».</b> Сенсор виявляє штамб за d до ротора. Фреза встигає відвестися, якщо <b>τ = d / v ≥ T_відв = T_зат + Δ / u_відв</b>. Повернутися вона може лише після того, як ротор минув дерево: <b>T_п ≥ (d + D + g) / v</b>. Збільшення d дає запас часу, але подовжує необроблену ділянку <b>ℓ_п ≈ d + D + 2r + g + v · T_пов</b>.</p>
<p><b>Як працювати.</b> П’ять кроків. Кожен вносить свою можливу похибку, і всі вони проявляться на пробному проході.</p>`,
`<p><b>Принцип.</b> Швидкість і надійність відводу залежать від гідравліки: тиск і потік задають найбільшу швидкість циліндра u_max, а золотник і електромагніти — запізнення T_г.</p>
<p><b>Що буде, якщо помилитися.</b> Низький тиск уповільнює відвід. Перегріта олива змінює в’язкість і збільшує запізнення. Слабкий струм електромагніта — «ліниве» перемикання золотника. Шумний сенсор дає хибні спрацювання. Несправність, яку ви не розпізнали, залишиться й проявиться на пробному проході.</p>
<p><b>Що робимо.</b> Порівняйте показання з нормою, вкажіть висновок і виконайте тестовий цикл: з нього беремо T_г та u_max для кроку 4. Перевірте примусовий відвід з кабіни (норма — не довше 0,5 с).</p>`,
`<p><b>Принцип.</b> Три способи виявлення. <b>Щуп</b> торкається штамба, тому для молодих дерев небезпечний (сила = натяг пружини + швидкісна складова), а за слабкого натягу реагує на траву. <b>Ультразвук</b> безконтактний, але чутливий до висоти монтажу й трави: за низької чутливості пропускає тонкі штамби. <b>Лідар / 3D</b> точніший і фільтрує траву, але має більшу затримку.</p>
<p><b>Що буде, якщо помилитися.</b> Пропуск штамба — зіткнення; хибні спрацювання — зайві відводи й необроблені ділянки. Виніс d задає запас часу τ = d / v (крок 4).</p>
<p><b>Що робимо.</b> Підберіть тип і параметри так, щоб виявлення було не менш як 95 %, а хибних спрацювань — не більш як 1 на 10 м.</p>`,
`<p><b>Принцип.</b> Потрібний відвід Δ = o + r + g: ротор перекриває вісь ряду на o, штамб має радіус r, і ще потрібен зазор g. У найгіршому випадку (товстіший штамб, зміщення ряду) потрібно більше: Δ ≈ o + 1,1 r + 2σ + g.</p>
<p><b>Що буде, якщо помилитися.</b> Замалий хід Δ_set — торкання. Надмірний хід — довше повернення (більша необроблена ділянка). Обмежувачі ходу виставляють за Δ_set.</p>
<p><b>Що робимо.</b> Оберіть g (кілька сантиметрів) і Δ_set із запасом на нерівність ряду.</p>`,
`<p><b>Принцип.</b> Фреза встигає, якщо запас часу <b>Δt = τ − T_відв ≥ 0</b>, де T_відв = T_s + T_к + T_г + Δ / u_відв (T_к = 0,02 с — час контролера). Звідси <b>v_max = d / T_відв</b>. Повернення має початися пізніше, ніж ротор минув дерево: <b>T_п ≥ (d + D + g) / v</b>, а час повернення T_пов = Δ_set / u_пов визначає довжину необробленої ділянки.</p>
<p><b>Що буде, якщо помилитися.</b> Швидкість відводу понад 85 % від u_max — відскік штока й удари. Повільне повернення — довгі необроблені ділянки. Замала T_п — ротор ще біля дерева, а фреза вже повертається в смугу.</p>
<p><b>Що робимо.</b> Розрахуйте бюджет на папері, перевірте себе за позначками, підберіть швидкості й T_п за часовою шкалою та анімацією обходу одного дерева.</p>`,
`<p><b>Принцип.</b> Агрегат проходить ряд із десятків дерев, і кожне має власні випадкові відхилення (радіус, зміщення, швидкість, затримка). Зазор на дереві c — найменша відстань від краю ротора до штамба у «вікні небезпеки», коли ротор поряд із деревом. Торкання: c ≤ 0; ризик: 0 < c < 1 см.</p>
<p><b>Порядок.</b> 1) Запустіть прохід і подивіться анімацію: які дерева стали червоними. 2) Розгляньте найгірше дерево на графіку: чи опускається лінія відводу нижче межі торкання у вікні небезпеки? 3) Виміряйте зазори на 12–15 деревах і обчисліть показники. 4) Змінюйте один параметр за раз.</p>
<p><b>Чому результат трохи змінюється.</b> Кожна нова спроба — новий ряд випадкових відхилень. Навіть найкращий сенсор зрідка пропускає штамб (близько 1 % дерев): це властивість сенсора, а не ваша помилка — повторіть прохід і запишіть обидва результати.</p>`,
`<p><b>Як читати протокол.</b> <i>Зазори по деревах</i> показують, де були торкання. <i>Крива «швидкість — торкання — оброблено ряду»</i> — наскільки далеко ви від межі бюджету часу. <i>Блок-схема</i> — яка частина контуру налаштована гірше. <i>Діагностика</i> — зіставлення з таблицею несправностей у методичці.</p>`,
`<p><b>Навіщо.</b> Тут можна безпечно «зламати» налаштування й побачити наслідок. Досліди не впливають на протокол і бали: гідравліка вважається справною, а ви змінюєте один параметр за раз.</p>
<p><b>Як працювати.</b> 1) Оберіть дослід — симулятор підкаже, що змінювати і що записати. 2) Натисніть «Закріпити для порівняння» на вихідному стані. 3) Рухайте повзунок: прохід і числа перераховуються одразу, сіра лінія на графіку — закріплений стан. 4) «Записати в журнал» додає рядок у таблицю, яку переносите в зошит.</p>`,
`<p><b>Навіщо.</b> Це калькулятор до Завдання 2: він рахує за тими самими формулами, що й методичка, і показує обхід одного дерева в масштабі. Спершу порахуйте сценарій на папері, потім звірте числа.</p>
<p><b>Формули.</b> Δ = o + r + g; T_відв = T_зат + Δ / u_відв; τ = d / v; Δt = τ − T_відв; v_max = d / T_відв; d_min = v · T_відв; T_п ≥ (d + D + g) / v; T_пов = Δ / u_пов; ℓ_п ≈ d + D + 2r + g + v · T_пов. Швидкість у формули підставляйте в см/с: 1 км/год = 27,78 см/с.</p>`];

tradeChart($('lb_tr'),LR.tr,L.v,L.pin?L.pin.tr:null,LR.vmax);$('lb_t').innerHTML=labTiles(LR);$('lb_c').innerHTML=labConcl(LR);$('lb_p').textContent=labPar();const tp=$('lv_Tp');if(tp)tp.textContent=F(LR.q.Tp,2);save()}

function labLog(){const L=S.lab,s=LR.r;L.log.push({par:labPar(),dmg:s.dmg,cmin:LR.cmin,dt:r2(LR.dt),vmax:f1(LR.vmax),Tv:r2(LR.Tv),miss:s.miss,nf:s.nf,bark:s.bark,unw:Math.round(s.unwTree),wk:wkS(s.wk)});if(L.log.length>24)L.log.shift();save();$('lb_l').innerHTML=labLogHTML()}
function labLogHTML(){const g=S.lab.log;return g.length?`<div class="tw"><table class="t2 c"><tr><th>№</th><th style="text-align:left">Що задано</th><th>Δt, с</th><th>T_відв, с</th><th>v_max, км/год</th><th>торкань, %</th><th>мін. зазор, см</th><th>пропущено</th><th>хибних</th><th>кора</th><th>необроблено на дерево, см</th><th>оброблено, %</th></tr>${g.map((q,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${q.par}</td><td>${F(q.dt,2)}</td><td>${F(q.Tv,2)}</td><td>${F(q.vmax,1)}</td><td>${F(q.dmg,1)}</td><td>${F(q.cmin,1)}</td><td>${q.miss}</td><td>${q.nf}</td><td>${q.bark?'пошкоджено':'—'}</td><td>${q.unw}</td><td>${F(q.wk,1)}</td></tr>`).join('')}</table></div><button class="g sm np" onclick="S.lab.log=[];save();$('lb_l').innerHTML=labLogHTML()">Очистити журнал</button>`:'<p class="note">Журнал порожній. Кнопка «Записати в журнал» додає сюди рядок із поточними числами — перенесіть таблицю в зошит.</p>'}
function labReset(){const e=S.lab.exp,lg=S.lab.log;S.lab=labDef();S.lab.exp=e;S.lab.log=lg;R()}
function s7(){labInit();const L=S.lab,sl=(k,nm,mn,mx,st,u)=>`<div><label>${nm}: <b id="lv_${k}">${F(L[k])}</b>${u||''}</label><input type="range" min="${mn}" max="${mx}" step="${st}" value="${L[k]}" oninput="labSet('${k}',+this.value)"></div>`,
ck=(k,nm,obj)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:5px 0"><input type="checkbox" ${(obj?L.f[k]:L[k])?'checked':''} onchange="S.lab${obj?'.f':''}.${k}=this.checked;labUpd()">${nm}</label>`;
return`<h2>Досліди «що буде, якщо…»</h2><p class="hint">Агрегат і сад — вашого варіанта ${V.id}; дерева в ряду мають такі самі випадкові відхилення, як у пробному проході. Досліди не змінюють протокол і бали.</p>${info(LAB)}
<div class="pc np">${EXP.map((e,i)=>`<button class="g sm ${L.exp==i?'on':''}" onclick="S.lab.exp=${i};save();R()">${e[0].split('.')[0]}</button>`).join('')}</div>
<div class="concl"><b>${EXP[L.exp][0]}.</b> ${EXP[L.exp][1]}</div>
<div class="lab-g">${sl('v','Швидкість',2,8,.5,' км/год')}${sl('d','Виніс сенсора d',30,200,1,' см')}${sl('g','Зазор g',1,10,.5,' см')}${sl('Ds','Хід відводу Δ_set',8,V.a.dm,.5,' см')}${sl('uo','Швидкість відводу u_відв',10,100,5,' % від u_max')}${sl('ui','Швидкість повернення u_пов',10,100,5,' % від u_max')}
<div><label>Затримка повернення T_п: <b id="lv_Tp">${F(L.Tp,2)}</b> с</label>${L.auto?'<p class="note" style="margin:2px 0">підлаштовується: (d + D + g) / v + 0,03 с</p>':`<input type="range" min="0.1" max="3" step="0.05" value="${L.Tp}" oninput="labSet('Tp',+this.value)">`}<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:5px 0"><input type="checkbox" ${L.auto?'checked':''} onchange="S.lab.auto=this.checked?1:0;if(!this.checked&&LR)S.lab.Tp=LR.q.Tp;save();R()">T_п автоматично</label></div>
<div><label>Сенсор</label><div class="pc" style="margin:2px 0">${['Щуп','Ультразвук','Лідар'].map(m=>`<button class="g sm ${L.type==m?'on':''}" onclick="S.lab.type='${m}';S.lab.p2=${m=='Щуп'?2.2:m=='Ультразвук'?95:85};save();R()">${m}</button>`).join('')}</div></div>
${L.type=='Щуп'?sl('p2','Натяг пружини щупа',.5,4,.1,' кгс'):sl('p2',L.type=='Ультразвук'?'Чутливість':'Фільтр трави',0,100,1,' %')}${L.type=='Ультразвук'?sl('hm','Висота монтажу сенсора',10,60,1,' см'):''}</div>
<div class="lab-g" style="margin-top:6px"><div>${ck('press','низький тиск у гідросистемі',1)}${ck('temp','перегріта олива',1)}${ck('valve','слабкий струм електромагніта',1)}${ck('sens','шумний сенсор',1)}</div><div>${ck('gh','висока трава')}${ck('yg','молоді дерева (тонкі штамби, ніжна кора)')}</div></div>
<div class="pc np"><button class="p sm" onclick="labPin()">Закріпити для порівняння</button><button class="g sm" onclick="labLog()">Записати в журнал</button><button class="g sm" onclick="labReset()">Скинути до рекомендованих</button><span class="note" id="lb_pn">${L.pin?'Закріплено: '+L.pin.par:''}</span></div>
<p class="note">Зараз задано: <span id="lb_p"></span></p><div id="lb_t"></div><div id="lb_c"></div>${pvHTML({zoom:1})}<p id="ob" class="note"></p><h3>Як змінюється результат зі швидкістю</h3><div class="ch" id="lb_tr"></div>
<h3>Журнал дослідів</h3><div id="lb_l">${labLogHTML()}</div><div class="nb np"><button class="g" onclick="go(5)">До кроку 5</button><button class="g" onclick="go(6)">До протоколу</button></div>`}

/* ===== Калькулятор бюджету часу (Завдання 2) ===== */
const calcDef=i=>Object.assign({sc:i,auto:1,Tp:1},SC[i]);
function calcMine(){const rf=ref();return{sc:2,auto:0,v:vpl(),d:S.d,r:V.r,o:V.a.o,g:n(S.g)??3,Tz:r2(rf.Tz),u:Math.round(rf.u),D:V.a.D,ui:Math.round(rf.h.umax*S.ui/100),Tp:n(S.Tp)??1}}
function calcTbl(p,b){const row=(a,f,v,cls)=>`<tr><th>${a}</th><td>${f}</td><td style="width:108px"><b class="${cls||''}">${v}</b></td></tr>`;
return`<div class="tw"><table class="t2">${row('Потрібний відвід Δ','o + r + g = '+F(p.o)+' + '+F(p.r)+' + '+F(p.g),F(r2(b.De))+' см')}${row('Час відводу T_відв','T_зат + Δ / u_відв = '+F(p.Tz,2)+' + '+F(r2(b.De))+' / '+F(p.u),F(b.Tv,3)+' с')}${row('Запас τ','d / v = '+F(p.d)+' / '+F(b.vv,1)+' (v = '+F(p.v)+' км/год = '+F(b.vv,1)+' см/с)',F(b.tau,3)+' с')}${row('Запас часу Δt','τ − T_відв',(b.dt>=0?'+':'')+F(b.dt,3)+' с',b.dt>=0?'ok':'no')}${row('Гранична швидкість v_max','d / T_відв = '+F(p.d)+' / '+F(b.Tv,3)+' = '+F(p.d/b.Tv,1)+' см/с',F(b.vmax,2)+' км/год')}${row('Мінімальний виніс d_min','v · T_відв = '+F(b.vv,1)+' · '+F(b.Tv,3),F(b.dmin,1)+' см')}${row('Найменша затримка T_п','(d + D + g) / v = ('+F(p.d)+' + '+F(p.D)+' + '+F(p.g)+') / '+F(b.vv,1),F(b.Tpm,2)+' с')}${row('Час повернення T_пов','Δ / u_пов = '+F(r2(b.De))+' / '+F(p.ui),F(b.Tpov,2)+' с')}${row('Необроблена ділянка ℓ_п','d + D + 2r + g + v · T_пов',F(b.lp,0)+' см')}</table></div>`}
function calcConcl(p,b,bp){const a=[];
if(b.dt<0)a.push(`<span class="no">Не встигає.</span> Ротор доходить до штамба через τ = ${F(b.tau,2)} с, а фрезі на відвід потрібно T_відв = ${F(b.Tv,2)} с. Щоб устигнути, треба або винести сенсор щонайменше на d_min = ${F(b.dmin,0)} см, або їхати не швидше за v_max = ${F(b.vmax,1)} км/год, або прискорити відвід.`);
else a.push(`<span class="ok">Встигає</span> із запасом ${F(b.dt,2)} с${b.dt<.06?' — цього замало: у ряду швидкість і положення дерев трохи змінюються, тому потрібен резерв близько 0,1 с':''}. Найбільша швидкість за такого виносу — ${F(b.vmax,1)} км/год.`);
if(b.Tp<b.Tpm-.005)a.push(`<span class="no">T_п = ${F(b.Tp,2)} с замала</span>: фреза починає повертатися, поки ротор ще біля дерева (найменша допустима ${F(b.Tpm,2)} с).`);
a.push(`На анімації найменший зазор до штамба ${F(bp.cmin,1)} см${bp.cmin<=0?' — це торкання':''}; фреза відведена на ділянці ≈ ${bp.unw} см (за формулою ℓ_п ≈ ${F(b.lp,0)} см).`);
return`<div class="concl"><b>Висновок.</b><ul>${a.map(q=>`<li>${q}</li>`).join('')}</ul></div>`}
function calcUpd(full){const p=S.calc,b=bud(p),bp=budPath(p),kind=bp.cmin<=0?2:bp.cmin<1?1:0,x=p.d+p.r+70,E={x,r:p.r,yo:0,tree:1,kind,c:bp.cmin,path:bp.path};
$('cl_t').innerHTML=calcTbl(p,b);$('cl_c').innerHTML=calcConcl(p,b,bp);$('cl_tl').innerHTML=tlSVG({tau:b.tau,Tv:b.Tv,dt:b.dt,parts:[['T_зат',p.Tz,TLC[2],'T_зат — запізнення'],['рух',b.De/p.u,TLC[3],'рух Δ / u_відв =']]});const tp=$('cv_Tp');if(tp)tp.textContent=F(b.Tp,2);
const end=bp.path[bp.path.length-1][0],T=mkTrack({a:{D:p.D,o:p.o,dm:60},d:p.d,type:'Щуп',L:x+end,ev:[E],fa:[],grass:'низька',seed:'calc',v:b.vv,Ds:b.De,lead:120,tail:60}),keep=PV.T&&$('tv')&&!full?PV.Xa+PV.p*(PV.Xb-PV.Xa):null;
pvBind(T,{one:1,ev:[E],Xa:-30,Xb:x-p.r+end+20,cmin:bp.cmin,unw:bp.unw,start:keep!=null?keep:T.obs[0].xm});save()}
function calcSet(k,v){S.calc[k]=v;S.calc.sc=-1;const e=$('cv_'+k);if(e)e.textContent=F(v);for(let i=0;i<3;i++){const b=$('cs'+i);if(b)b.classList.remove('on')}calcUpd()}
function s8(){if(!S.calc)S.calc=calcDef(0);const p=S.calc,b=bud(p),sl=(k,nm,mn,mx,st,u)=>`<div><label>${nm}: <b id="cv_${k}">${F(p[k])}</b>${u}</label><input type="range" min="${mn}" max="${mx}" step="${st}" value="${p[k]}" oninput="calcSet('${k}',+this.value)"></div>`,mine=V&&S.type!='—'&&[S.bd.D,S.bd.Tv,S.bd.tau,S.bd.dt,S.bd.vmax].every(x=>x!==''&&x!=null);
return`<h2>Калькулятор бюджету часу (до Завдання 2)</h2><p class="hint">Перевірте свій розрахунок сценаріїв із методички й подивіться, як фреза обходить одне дерево. Рухайте повзунки: числа, часова шкала й анімація перераховуються одразу.</p>${info(CALC)}
<div class="pc np">${SC.map((q,i)=>`<button class="g sm ${p.sc==i?'on':''}" id="cs${i}" onclick="S.calc=calcDef(${i});save();R()">${q.nm}</button>`).join('')}${mine?`<button class="g sm ${p.sc==2?'on':''}" id="cs2" onclick="S.calc=calcMine();save();R()">Мій варіант (за кроками 1–4)</button>`:''}</div>
${V&&!mine?'<p class="note">Кнопка «Мій варіант» з’явиться, коли ви самі порахуєте й введете п’ять величин бюджету на кроці 4.</p>':''}
<div class="lab-g">${sl('v','Швидкість руху v',2,8,.1,' км/год')}${sl('d','Виніс сенсора d',20,200,1,' см')}${sl('r','Радіус штамба r',1,20,.5,' см')}${sl('o','Перекриття осі ряду o',5,20,1,' см')}${sl('g','Зазор g',1,10,.5,' см')}${sl('Tz','Запізнення T_зат',.05,.5,.01,' с')}${sl('u','Швидкість відводу u_відв',10,120,1,' см/с')}${sl('D','Діаметр ротора D',30,60,5,' см')}${sl('ui','Швидкість повернення u_пов',10,120,1,' см/с')}
<div><label>Затримка повернення T_п: <b id="cv_Tp">${F(b.Tp,2)}</b> с</label>${p.auto?'<p class="note" style="margin:2px 0">найменша допустима: (d + D + g) / v</p>':`<input type="range" min="0.1" max="3" step="0.05" value="${p.Tp}" oninput="calcSet('Tp',+this.value)">`}<label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin:5px 0"><input type="checkbox" ${p.auto?'checked':''} onchange="S.calc.auto=this.checked?1:0;if(!this.checked)S.calc.Tp=Math.round(bud(Object.assign({},S.calc,{auto:1})).Tpm*20)/20;save();R()">T_п найменша допустима</label></div></div>
<div id="cl_t"></div><div class="fig"><div id="cl_tl"></div></div><div id="cl_c"></div><h3>Обхід одного дерева в масштабі</h3>${pvHTML({one:1,zoom:1})}
<div class="nb np"><button class="g" onclick="go(0)">На початок</button>${V?'<button class="g" onclick="go(4)">До кроку 4</button>':''}</div>`}

/* ===== Каркас: меню, термінал, тема, перемальовування ===== */
function u(k,v){S[k]=v;save();ds();navR()}
function go(i){S.step=i;save();R();scrollTo(0,0)}
function ds(){if(!V){$('ds').innerHTML='<div class="t">ТЕРМІНАЛ САК ФРЕЗИ</div><div class="d"><span>Очікування</span><span>—</span></div>';return}
const l=S.tr.last,rf=ref(),ok=S.type!='—',r=[['Варіант',V.id],['Сенсор',S.type],['Виніс d',ok?S.d+' см':'—'],['g / Δ_set',vs(S.g||'—')+' / '+vs(S.Dset||'—')],['u відв/пов',S.uo+' / '+S.ui+' %'],['T_п',S.Tp?vs(S.Tp)+' с':'—'],...(ok?[['T_відв',F(rf.Tv,2)+' с'],['τ = d/v',F(rf.tau,2)+' с'],['Δt',(rf.dt>=0?'+':'')+F(rf.dt,2)+' с'],['v_max',F(rf.vmax,1)+' км/год']]:[]),['v',S.tr.v?vs(S.tr.v)+' км/год':'—'],['Спроб',S.tr.n],...(l?[['Торкань',F(l.dmg,1)+' %'],['Оброблено',F(wkS(l.wk),1)+' %']]:[])];
$('ds').innerHTML='<div class="t">ТЕРМІНАЛ САК ФРЕЗИ — ЖИВІ ПОКАЗАННЯ</div>'+r.map(x=>`<div class="d"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}
function theme(set){let t=null;try{t=localStorage.getItem(TKEY)}catch(e){}if(set!==0){t=t=='light'?'dark':t=='dark'?null:'light';try{t?localStorage.setItem(TKEY,t):localStorage.removeItem(TKEY)}catch(e){}}
if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');$('thb').textContent='Тема: '+(t=='light'?'світла':t=='dark'?'темна':'авто')}
function navR(){$('nv').innerHTML=TT.map((t,i)=>{const d=i>=1&&i<=5?done(i):0;return`<button class="${i==S.step?'on':''}${i>=LAB?' lab':''}" ${!V&&i&&i!=CALC?'disabled':''} onclick="go(${i})" ${i==S.step?'aria-current="step"':''}>${i>=1&&i<=5?`<i class="${d==1?'ok':d?'pt':''}" title="${d==1?'заповнено':d?'заповнено частково':'не заповнено'}"></i>`:''}${t}</button>`}).join('')}
function R(){cancelAnimationFrame(PV.raf);PV.play=false;PV.T=null;if(!S)S=blank();if(!V&&S.step!=CALC)S.step=0;navR();
$('bn').innerHTML=S.demo&&V?`<div class="bn np"><span><b>Відкрито приклад із методички</b> (варіант ${V.id}). Усі кроки вже заповнено — розгляньте їх, а для звіту отримайте власний варіант.</span><button class="p sm" onclick="newReg()">Отримати свій варіант</button></div>`:'';
$('chip').textContent=V?(S.demo?'приклад · ':'')+'варіант '+V.id:'варіант не видано';
$('mn').innerHTML=[s0,s1,s2,s3,s4,s5,s6,s7,s8][S.step]();
const st=S.step;if(st==1)post1();if(st==2&&S.type!='—')senScene();if(st==4){chk4();one4()}if(st==5)post5();if(st==6)post6();if(st==LAB)labUpd(1);if(st==CALC)calcUpd(1);ds()}
/* ===== Запуск ===== */
theme(0);
if(!S){demoState();save()}            /* перше відкриття: приклад із методички */
let RW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-RW)>8){RW=innerWidth;clearTimeout(R.t);R.t=setTimeout(R,180)}});
R();
</script></body></html>
