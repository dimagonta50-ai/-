<header class="top"><h1>Симулятор тюкового прес-підбирача<small>Формування тюка, вологість, зважування, автозупинка й облік сухої речовини. Лабораторна робота №9</small></h1>

<script>
/* Симулятор до лабораторної роботи №9.
   Автоматичні системи керування машинами для заготівлі кормів:
   тюковий прес-підбирач — формування тюка, вологість, зважування, автозупинка, облік.
   Один файл, без зовнішніх бібліотек і шрифтів; працює без мережі. */
const KEY='lr9v1',TKEY='lr9theme';
/* ===== Модель тюкового прес-підбирача (ЛР №9) =====
   Основа — чотири співвідношення, які виводяться в методичці:
     V   = π·D²·W/4                 об’єм круглого тюка, м³
     m   = ρ·V,  ρ = ρ_СР/(1−w/100) маса тюка; суха речовина ущільнюється, воду возять «задарма»
     m_СР= m·(1−w/100)              маса сухої речовини тюка
     ΔL  = v/3,6·T_затр + v²/(2a)   шлях до зупинки після сигналу «тюк готовий»
   Решта (похибка на схилі, цикл, облік) побудована на них. */
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),f1=x=>Math.round(x*10)/10,f2=x=>Math.round(x*100)/100,
      f3=x=>Math.round(x*1000)/1000,
      /* Приймаємо і кому, і крапку, і типографський мінус «−», який сам-таки виводить симулятор */
      n=x=>{const v=parseFloat(String(x).replace(',','.').replace(/[\u2212\u2013\u2014]/g,'-').replace(/\s/g,''));
            return isNaN(v)?null:v};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gs=r=>(r()+r()+r()-1.5)*2;            /* наближено нормальний розподіл, одинична дисперсія */

/* --- Культури: густина сухої речовини, безпечна вологість, ціна --- */
/* rhoDM — скільки кілограмів сухої речовини вміщується в кубометр тюка за повного тиску;
   wSafe — верхня межа вологості, за якої корм зберігається без самонагрівання;
   wField — типова вологість матеріалу у валку на момент пресування. */
const CROP=[{c:'сіно (злакові трави)', rhoDM:[150,172],wSafe:17,wField:[12,22],Cdm:5.2,net:[2.2,2.8]},
            {c:'сіно (люцерна)',        rhoDM:[142,164],wSafe:16,wField:[12,22],Cdm:6.4,net:[2.4,3.0]},
            {c:'сінаж (прив’ялені трави)',rhoDM:[200,238],wSafe:55,wField:[38,52],Cdm:4.6,net:[2.6,3.2]},
            {c:'солома пшенична',       rhoDM:[ 96,118],wSafe:18,wField:[10,18],Cdm:1.9,net:[2.0,2.6]}];
/* --- Прес-підбирачі зі змінною камерою --- */
const BALER=[{p:'Fendt Rotana 160 V Xtra',W:1.20,Dmin:0.90,Dmax:1.60,Mm:3250,cells:3,price:2.85e6},
             {p:'Claas Variant 480 RC',   W:1.20,Dmin:0.90,Dmax:1.55,Mm:3100,cells:3,price:2.60e6},
             {p:'Krone Comprima V 150 XC',W:1.20,Dmin:1.00,Dmax:1.50,Mm:3380,cells:3,price:2.95e6},
             {p:'John Deere V461R',       W:1.21,Dmin:0.90,Dmax:1.60,Mm:3250,cells:3,price:2.80e6},
             {p:'New Holland Roll-Belt 150',W:1.22,Dmin:0.90,Dmax:1.50,Mm:3000,cells:3,price:2.45e6}];
const TRK=['Fendt 516 Vario','John Deere 6120M','New Holland T6.160','Case IH Maxxum 145','Deutz-Fahr 6135 C'];

/* --- Базові співвідношення --- */
const volOf=(D,W)=>Math.PI*D*D*W/4;                      /* об’єм тюка, м³ */
const rhoWet=(rhoDM,w)=>rhoDM/(1-w/100);                 /* густина за вологою масою, кг/м³ */
const dmOf=(m,w)=>m*(1-w/100);                           /* маса сухої речовини, кг */
/* густина сухої речовини залежно від тиску в камері, швидкості й культури */
function rhoDMof(V,Q){const p=cl(Q.press??80,30,100),v=Q.v??V.vp;
 /* тиск: від 30 % до 100 % уставки густина росте майже лінійно, але з насиченням */
 const kp=0.58+0.42*Math.pow((p-30)/70,0.78);
 /* зависока швидкість — нерівна подача, матеріал гірше вкладається */
 const kv=1-0.010*Math.max(0,v-V.vOpt);
 return V.rhoDM*kp*kv}
/* маса тюка за поточних налаштувань */
function baleMass(V,Q){const D=cl(Q.D??V.Dset,V.a.Dmin,V.a.Dmax),w=Q.w??V.wAvg,
 Vb=volOf(D,V.a.W),rdm=rhoDMof(V,Q),r=rhoWet(rdm,w);
 return{D,V:f3(Vb),rhoDM:f1(rdm),rho:f1(r),m:f1(r*Vb),mDM:f1(rdm*Vb)}}
/* погонна маса валка, кг/м: з урожайності вологої маси й ширини смуги, що згрібається у валок */
const lamOf=(U,b)=>U*b/10000;

/* --- Зважування --- */
/* Тензодатчики вимірюють складову ваги вздовж своєї осі. На схилі θ машина нахиляється
   разом із датчиками, тому показ зменшується у cos θ разів.
   Абсолютний метод: від показання на схилі віднімають масу порожньої машини, зважену на рівному,
   тому похибка стосується всієї маси. Різницевий: обидва показання зняті на тому самому місці,
   тому нахил скорочується з усього, крім маси самого тюка. */
const wAbs=(V,m,th)=>(V.a.Mm+m)*Math.cos(th*Math.PI/180)-V.a.Mm;   /* показ абсолютного методу, кг */
const wDif=(m,th)=>m*Math.cos(th*Math.PI/180);                      /* показ різницевого методу, кг */
/* Якщо підбирач не піднято, частина ваги машини спирається на ґрунт через копіювальні колеса
   і до тензодатчиків не доходить. В абсолютному методі це пряме заниження показання.
   У різницевому обидва зважування роблять на тому самому місці за кілька секунд, тому
   опора здебільшого скорочується — лишається тільки те, на скільки вона встигла змінитися. */
/* Саму опору знімає тарування: масу порожньої машини теж вимірювали з опущеним підбирачем.
   Лишається те, на скільки опора змінилася — через нерівності, вібрацію й інше місце тарування. */
const pickBias=(V,m)=>0.35*V.pickK*(V.a.Mm+m);         /* абсолютний: тарували в іншому місці */
const pickNoise=(V,m,seed)=>0.15*V.pickK*(V.a.Mm+m)*gs(rng(seed));  /* розкид від нерівностей */

/* --- Зупинка після сигналу «тюк готовий» --- */
const stopLen=(v,T,a)=>v/3.6*T+Math.pow(v/3.6,2)/(2*a);  /* шлях до повної зупинки, м */
const overMass=(lam,dL)=>lam*dL;                          /* матеріал, що встигає зайти в камеру, кг */

/* --- Цикл --- */
function cycle(V,Q,m){const lam=V.lam,v=Q.v??V.vp,
 Lb=m/lam,                                               /* метрів валка на один тюк */
 Tform=Lb/(v/3.6),                                       /* час формування, с */
 Twrap=V.Twrap0+V.TwrapN*(Q.turns??V.turns),             /* обв’язування сіткою */
 Tdoor=(Q.autoDoor??1)?V.Tdoor:V.Tdoor+V.TdoorMan,       /* відчинити–зачинити задні двері */
 Tstop=(Q.tim??0)?V.Tstop:V.Tstop+V.TstopMan,            /* зупинка й рушання */
 Tc=Tform+Twrap+Tdoor+Tstop;
return{Lb:f1(Lb),Tform:f1(Tform),Twrap:f1(Twrap),Tdoor:f1(Tdoor),Tstop:f1(Tstop),Tc:f1(Tc),
 bph:f1(3600/Tc),haph:f2(3600/Tc*m/V.U)}}

/* --- Карта вологості поля ---
   Уздовж поля вологість плавно гуляє (рельєф, нерівномірність підсихання), а поперек
   є смуга, що підсихає гірше: низина або затінок від лісосмуги вздовж краю. Саме вона
   дає вологі тюки, бо цілі валки в ній лишаються сирими. */
function wField(V,x,y){const{wa,wb,wc,wd,we,wy,wr,wamp}=V.wMap;
 return V.wAvg+wa*Math.sin(wb*x+wc)+wd*Math.cos(we*y)+wamp*Math.exp(-Math.pow((y-wy)/wr,2))}
/* Тюк набирається з Lb метрів валка, тому його вологість — середня по цій ділянці,
   а не в одній точці: довгий тюк «усереднює» дрібні вологі плями. */
function wBale(V,x,Lb,y){let s=0;const K=7;
 for(let i=0;i<K;i++)s+=wField(V,x+Lb*(i+0.5)/K,y);
 return s/K}

/* --- Генерація варіанта --- */
function mkV(r_){const R=rng(hash([r_.group,r_.name,r_.num].join('|').toLowerCase().replace(/\s+/g,' '))),
 pk=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>Math.round(a+R()*(b-a)),rf=(a,b)=>a+R()*(b-a);
const a=pk(BALER),cr=pk(CROP),trk=pk(TRK);
const V={a,trk,crop:cr.c,wSafe:cr.wSafe,Cdm:cr.Cdm,
 rhoDM:f1(rf(cr.rhoDM[0],cr.rhoDM[1])),               /* потенціал ущільнення за повного тиску */
 /* Пресувати починають, коли основна маса підсохла до безпечної межі. Тому середня
    вологість у валку лежить трохи нижче wSafe, а окремі низини ще не встигли підсохнути. */
 wAvg:f1(cl(cr.wSafe-rf(1.6,4.8),cr.wField[0],cr.wField[1])),
 turnsOpt:Math.round(rf(cr.net[0],cr.net[1])*10)/10,  /* потрібні витки сітки */
 S:ri(28,90),                                         /* площа поля, га */
 U:ri(26,62)*100,                                     /* урожайність вологої маси, кг/га */
 b:f1(rf(5.4,9.0)),                                   /* ширина смуги, згорнутої в один валок, м */
 vp:f1(rf(7,12)),                                     /* планова швидкість підбирання, км/год */
 vOpt:0,                                              /* швидкість рівної подачі — нижче */
 theta:f1(rf(3,11)),                                  /* нахил робочої ділянки, градуси */
 Tr:f2(rf(0.9,1.6)),                                  /* запізнення реакції оператора, с */
 TrTim:f2(rf(0.10,0.22)),                             /* запізнення автозупинки TIM, с */
 acc:f1(rf(1.2,2.0)),                                 /* уповільнення агрегату, м/с² */
 Twrap0:f1(rf(3.0,4.5)),TwrapN:f1(rf(1.6,2.4)),       /* обв’язування: стала й на один виток */
 Tdoor:f1(rf(4.5,6.5)),TdoorMan:f1(rf(5,9)),          /* двері: авто й вручну */
 Tstop:f1(rf(2.0,3.0)),TstopMan:f1(rf(3.5,6.5)),      /* зупинка–рушання: TIM і вручну */
 pickK:f2(rf(0.035,0.075)),                           /* частка ваги машини на непіднятому підбирачі */
 Csez:ri(9,26)*100,                                   /* обсяг заготівлі за сезон, т вологої маси */
 Chour:ri(1400,2600),                                 /* вартість машино-години агрегату, грн */
 Csys:ri(170,340)*1000,                               /* вартість комплекту автоматики, грн */
 id:'В-'+(hash(r_.group+r_.name+r_.num+'#id')%9000+1000)};
/* карта вологості */
V.wMap={wa:f2(rf(0.9,2.0)),wb:f3(rf(0.008,0.020)),wc:f2(rf(0,6.2)),
 wd:f2(rf(0.6,1.6)),we:f3(rf(0.010,0.026)),wy:0,wr:0,wamp:0};
/* Смуга має підняти вологість вище безпечної межі навіть у найсухішій фазі решти карти,
   інакше сигналізація нічого не покаже */
V.wMap.wamp=f1((cr.wSafe-V.wAvg)+V.wMap.wa+V.wMap.wd+rf(1.0,4.0));
/* геометрія поля: витягнутий прямокутник площею S */
V.FL=Math.round(Math.sqrt(V.S*1e4*2.2)/10)*10;          /* довжина гону, м */
V.FW=Math.round(V.S*1e4/V.FL/10)*10;                    /* ширина поля, м */
V.vOpt=f1(V.vp-rf(0,1.2));                              /* вище цієї швидкості подача гіршає */
/* Частка тюків, що за сезон потрапляють під пресування з вологістю понад безпечну:
   окремі загінки, вечірній покіс, низини. Це сезонна величина, а не результат одного проходу. */
V.pSez=f1(rf(3,8));
/* Еталонна маса для контрольного зважування: мішки чи вантаж із відомою масою */
V.ctrlM=ri(20,60)*10;
V.lam=f2(lamOf(V.U,V.b));                               /* погонна маса валка, кг/м */
/* Смуга, що гірше підсихає, лежить на краю поля — там, де йде пробний прохід.
   Її середина збігається з одним із валків, а ширина — менша за крок валків, тому
   сирими виходять тюки з одного-двох крайніх валків, а не з усієї загінки. */
V.wMap.wy=f1((ri(0,1)+0.5)*V.b);
V.wMap.wr=f1(rf(0.45,0.75)*V.b);
V.nPass=Math.max(2,Math.round(V.FW/V.b));               /* проходів (валків) по полю */
/* Цільова маса тюка. Зверху її обмежує не тільки діаметр камери, а й те, що тюк мають
   підняти навантажувачем і вивезти: важчий за mLim тюк господарству не потрібен. */
V.mLim=ri(62,92)*10;
{const mFull=rhoWet(V.rhoDM,V.wAvg)*volOf(V.a.Dmax,V.a.W),
   mMin=rhoWet(V.rhoDM*0.62,V.wAvg)*volOf(V.a.Dmin+0.15,V.a.W);
 V.mSet=Math.round(cl(Math.min(mFull*0.90,V.mLim),mMin,mFull)/10)*10}
V.turns=V.turnsOpt;
V.ideal=idealQ(V);
/* приховані несправності */
/* Приховані несправності. Вологомір завжди має зсув: його повіряють за лабораторною
   пробою на початку кожного сезону, і саме з цього починається робота. */
const fl={wCal:f1(rf(2.2,6.5))*(R()<.5?-1:1),            /* зсув вологоміра, % абс. */
          cellDrift:R()<.60?f1(rf(6,22))*(R()<.5?-1:1):0,/* дрейф нуля тензодатчиків, кг */
          pickDown:R()<.55?1:0,                          /* підбирач не піднімається при зважуванні */
          netLow:R()<.45?1:0};                           /* занижене число витків сітки */
if(!fl.cellDrift&&!fl.pickDown)fl[R()<.5?'cellDrift':'pickDown']=R()<.5?f1(rf(8,20)):1;
if(fl.cellDrift===1)fl.cellDrift=f1(rf(8,20));
V.fl=fl;
return V}

/* --- Еталонні (рекомендовані) налаштування варіанта --- */
function idealQ(V){
 /* діаметр підбираємо так, щоб маса тюка була якнайближчою до цільової */
 let best=null;
 for(let D=V.a.Dmin;D<=V.a.Dmax+1e-9;D+=0.05){
  for(const press of [70,75,80,85,90,95,100]){
   const b=baleMass(V,{D:f2(D),press,v:V.vOpt,w:V.wAvg}),
    e=Math.abs(b.m-V.mSet)/V.mSet+Math.abs(press-88)/700;
   if(!best||e<best.e)best={D:f2(D),press,e,m:b.m}}}
 return{D:best.D,press:best.press,v:V.vOpt,method:'різницевий',pick:1,tim:1,autoDoor:1,
  turns:V.turnsOpt,wThr:V.wSafe,m:best.m}}

/* --- Поточні налаштування з полів студента --- */
function Qs(S_,V,o){return Object.assign({
 D:n(S_.D)??V.ideal.D,press:n(S_.press)??V.ideal.press,v:n(S_.v)??V.vp,
 method:S_.method||'абсолютний',pick:S_.pick??0,tim:S_.tim??0,autoDoor:S_.autoDoor??0,
 turns:n(S_.turns)??V.turns,wThr:n(S_.wThr)??99,theta:n(S_.theta)??V.theta,
 preStop:n(S_.preStop)??0,calW:!!S_.calW,calCell:!!S_.calCell,w:V.wAvg},o||{})}

/* --- Показання вологоміра (з урахуванням зсуву, якщо не відкалібровано) --- */
const wShow=(V,Q,wTrue)=>f1(wTrue+((Q.calW)?0:V.fl.wCal));

/* --- Зважування одного тюка --- */
function weigh(V,Q,m,seed,th_){const th=th_??Q.theta??V.theta,sd=seed||1,
 dif=Q.method=='різницевий',
 drift=(Q.calCell?0:V.fl.cellDrift),
 pickErr=Q.pick?0:(pickNoise(V,m,sd*31)-(dif?0:pickBias(V,m))),
 base=dif?wDif(m,th):wAbs(V,m,th),
 noise=1.2*gs(rng(sd*7919));
return{show:f1(base+drift+pickErr+noise),true:f1(m),
 errSlope:f1(m-wDif(m,th)),errAbs:f1(m-wAbs(V,m,th)),drift,pickErr:f1(pickErr)}}

/* --- Пробний прохід полем ---
   Прохід роблять не по всьому полю, а по загінці: кілька валків підряд.
   Площу беруть не з паспорта поля, а з фактично пройденого шляху — так її рахує Task Doc за GNSS.
   Маса тюка в камері зі змінним об’ємом визначається не вагами, а діаметром: машина
   набирає заданий D, а маса виходить така, яку дасть густина за місцевої вологості. */
/* Загінка пробного проходу: щонайменше NW валків і NMIN тюків, але не більше NMAX.
   Менше валків — і вся вибірка потрапить в одну смугу вологості; менше тюків — і
   статистика маси нічого не покаже. */
const NW=4,NMIN=16,NMAX=40;
function pass(V,Q){
const seed=hash(V.id+'p'+Q.D+Q.press+Q.v+Q.method+(Q.tim?1:0)+Q.turns+Q.preStop+
  (Q.calW?1:0)+(Q.calCell?1:0)+(Q.pick?1:0)+Q.wThr),
 R=rng(seed),bales=[],lam=V.lam,v=Q.v,
 dL=stopLen(v,Q.tim?V.TrTim:V.Tr,V.acc),
 dm=overMass(lam,dL),
 Vb=volOf(cl(Q.D,V.a.Dmin,V.a.Dmax),V.a.W),
 rdm=rhoDMof(V,Q),
 mNom=rhoWet(rdm,V.wAvg)*Vb;                             /* маса за середньої вологості */
let x=0,y=V.b/2,np=0,Ldrive=0;
for(let i=0;i<NMAX;i++){
 if(i>=NMIN&&np>=NW)break;
 /* вологість у точці, де формувався тюк */
 const Lb0=rhoWet(rdm,V.wAvg)*Vb/lam,                     /* попередня довжина тюка, м */
  wTrue=f1(cl(wBale(V,x,Lb0,y)+0.5*gs(R),3,72)),
  kflow=1+0.022*gs(R),                                   /* нерівність подачі валка */
  mSet=rhoWet(rdm*kflow,wTrue)*Vb,                       /* маса за заданого діаметра */
  mAim=mSet-(Q.preStop||0),
  m=f1(cl(mAim+dm,40,mSet*1.4)),
  /* локальний схил: рівнина переважає, крутий бік трапляється рідше */
  th=f1(V.theta*Math.pow(R(),1.8)),
  wgt=weigh(V,Q,m,hash(V.id+'b'+i),th),
  wSh=wShow(V,Q,wTrue),
  Lb=m/lam;
 bales.push({i:i+1,x:f1(x+Lb/2),y:f1(y),pass:np+1,m,w:wTrue,wShow:wSh,theta:th,
  show:wgt.show,mDM:f1(dmOf(m,wTrue)),mDMshow:f1(wgt.show*(1-wSh/100)),
  flag:wSh>Q.wThr,wet:wTrue>V.wSafe,rho:f1(m/Vb)});
 x+=Lb;Ldrive+=Lb;
 if(x>V.FL-1){x=0;np++;y+=V.b;if(y>V.FW)y=V.b/2}}
const N=bales.length,
 mm=bales.map(b=>b.m),sh=bales.map(b=>b.show),
 mu=mm.reduce((a,b)=>a+b,0)/N,
 sd=Math.sqrt(mm.reduce((a,b)=>a+(b-mu)*(b-mu),0)/Math.max(1,N-1)),
 cv=f1(100*sd/mu),
 errM=f1(100*(sh.reduce((a,b)=>a+b,0)/N-mu)/mu),
 /* площа загінки — з пройденого шляху й ширини смуги */
 area=Ldrive*V.b/1e4,
 sumDM=bales.reduce((a,b)=>a+b.mDM,0),
 sumDMshow=bales.reduce((a,b)=>a+b.mDMshow,0),
 dmGa=f2(sumDM/1000/area),dmGaShow=f2(sumDMshow/1000/area),
 errDM=f1(100*(sumDMshow-sumDM)/sumDM),
 wet=bales.filter(b=>b.wet).length,
 flagged=bales.filter(b=>b.flag).length,
 caught=bales.filter(b=>b.wet&&b.flag).length,
 falseAl=bales.filter(b=>!b.wet&&b.flag).length,
 cyc=cycle(V,Q,mu),
 turnsOk=Q.turns>=V.turnsOpt-0.05,
 burst=turnsOk?0:f1(cl(14*(V.turnsOpt-Q.turns),0,60));
return{bales,N,mu:f1(mu),sd:f1(sd),cv,errM,dmGa,dmGaShow,errDM,
 sumDM:Math.round(sumDM),sumDMshow:Math.round(sumDMshow),area:f2(area),Ldrive:Math.round(Ldrive),
 wet,flagged,caught,falseAl,miss:wet-caught,burst,turnsOk,
 dL:f2(dL),dm:f1(dm),mNom:f1(mNom),over:f1(mu-mNom),mTarget:f1(mNom),...cyc}}

/* --- Економіка ---
   Два джерела, які можна порахувати чесно:
   1) збережений корм — вологі тюки, які система встигає позначити, не доходять до псування;
   2) виграний час — коротший цикл дає менше машино-годин на той самий обсяг.
   Точність обліку в гроші не переводимо (див. пояснення в методичці), а показуємо
   окремо — у відсотках похибки й у спірних тоннах сухої речовини за сезон. */
const KREC=0.55;    /* частка вартості, яку вдається повернути з вчасно позначеного тюка */
function econ(V,p1,p2){
 const Msez=V.Csez*1000,                                  /* сезонний обсяг, кг вологої маси */
  dmFrac=1-V.wAvg/100,
  /* частка вологих тюків, які система НЕ позначила: вимірюється самим студентом на проході */
  det=p=>p.wet>0?p.caught/p.wet:(p.flagged>0?1:0),
  /* що псується за сезон: невиявлені вологі тюки плюс ті, що втратили форму через сітку */
  sp=p=>V.pSez/100*(1-det(p))+0.35*p.burst/100,
  s1=sp(p1),s2=sp(p2),
  /* Позначений тюк не рятується сам собою: його відкладають окремо, згодовують першим
     або загортають у плівку. Повернути вдається не всю вартість, а приблизно KREC від неї. */
  Ekorm=Math.round(KREC*Math.max(0,s1-s2)*Msez*dmFrac*V.Cdm),
  /* машино-години на сезонний обсяг */
  hrs=p=>Msez/(p.mu*p.bph||1),
  h1=hrs(p1),h2=hrs(p2),
  Echas=Math.round(Math.max(0,h1-h2)*V.Chour),
  Cex=Math.round(.10*V.Csys),
  E=Ekorm+Echas,Enet=E-Cex,
  dErr=f1(Math.abs(p1.errDM)-Math.abs(p2.errDM)),
  tDisp=Math.round(Math.abs(dErr)/100*Msez*dmFrac/1000);   /* спірні тонни СР за сезон */
return{KREC,det1:f1(100*det(p1)),det2:f1(100*det(p2)),s1:f1(100*s1),s2:f1(100*s2),Ekorm,
 h1:f1(h1),h2:f1(h2),Echas,Cex,E,Enet,dErr,tDisp,
 T:Enet>0?f2(V.Csys/Enet):null}}

/* --- Бали: 16 + 20 + 20 + 22 + 22 = 100 --- */
const pen=(e,t,s)=>e<=t?0:Math.min(1,(e-t)/s);

/* 1. Датчики й калібрування — 16 */
{let s=0;const bd=S_.bd||{};

 s+=S_.calW?4:0;                              /* поправку внесено */
 s+=S_.calCell?3:0;                           /* нуль тензодатчиків виставлено */
 s+=S_.pick?3:0;                              /* підбирач піднімається при зважуванні */
 r[0]=s}
/* 2. Формування тюка — 20 */
{const bd=S_.bd||{},V0=volOf(Q.D,V.a.W);
 r[1]=(okn(bd.V,V0,Math.max(.01,V0*.02))?6:0)+(okn(bd.rho,b.rho,Math.max(2,b.rho*.03))?6:0)+
      (okn(bd.m,b.m,Math.max(5,b.m*.03))?5:0)+(Math.abs(b.m-V.mSet)/V.mSet<=.06?3:0)}
/* 3. Зважування на схилі — 20 */
{const bd=S_.bd||{},eA=(V.a.Mm+b.m)*(1-Math.cos(Q.theta*Math.PI/180)),
  eD=b.m*(1-Math.cos(Q.theta*Math.PI/180));
 r[2]=(okn(bd.errAbs,eA,Math.max(1,eA*.05))?7:0)+(okn(bd.errDif,eD,Math.max(.4,eD*.05))?7:0)+
      (Q.method=='різницевий'?4:0)+(S_.why?2:0)}
/* 4. Зупинка, перед-зупинка, сітка — 22 */
{const bd=S_.bd||{},dL=stopLen(Q.v,Q.tim?V.TrTim:V.Tr,V.acc),dm=overMass(V.lam,dL);

      (okn(S_.preStop,dm,Math.max(2,dm*.15))?5:0)+(Q.tim?3:0)+(Q.turns>=V.turnsOpt-0.05?2:0)}
/* 5. Прохід і економіка — 22 */
{if(p){const e=ecRef(S_,V),bd=S_.bd||{};

   +(okn(bd.dmGa,p.dmGa,Math.max(.05,p.dmGa*.03))?5:0)
   +(e?((okn((S_.ec||{}).E,e.E,Math.max(500,e.E*.03))?3:0)+(e.T!=null&&okn((S_.ec||{}).T,e.T,Math.max(.05,e.T*.08))?3:0)):0)}}
return r.map(x=>Math.max(0,Math.round(x*10)/10))}

const PHASES=['form','signal','wrap','eject','weigh'];

const ANI={run:0,t:0,ip:0,last:0,Q:null,cap:''};
function chamBox(Q,cap){ANI.Q=Q;ANI.cap=cap;
 return'<div id="ani">'+chamberSVG(V,Q,aniSt())+'</div>'+
 '<div class="pc"><button class="g sm" onclick="aniTog()" id="anib">'+(ANI.run?'⏸ Пауза':'▶ Пуск циклу')+'</button>'+
 '<button class="g sm" onclick="aniStep()">Наступна фаза</button>'+

s+='<div class="gg">'+
 gc(b.m,0,V.mLim*1.3,'маса тюка','кг',[[V.mSet*.95,V.mSet*1.05,C('ac')],[V.mLim,V.mLim*1.3,C('wn')]])+
 gc(b.mDM,0,V.mLim,'суха речовина','кг',[])+
 gc(100*eD/b.m,0,10,'похибка різницевого','%',[[0,2,C('ac')],[2,5,C('am')],[5,10,C('wn')]])+
 gc(dm,0,Math.max(10,dm*1.6),'зайва маса Δm','кг',[[0,Math.max(2,dm*0.3),C('ac')]])+'</div>';
s+=gsc([['об’єм тюка',F(b.V,3)+' м³'],['густина',F(b.rho,1)+' кг/м³'],
 ['похибка абсолютного',F(r1(eA),1)+' кг',eA/b.m>0.05?C('wn'):C('ac')],
 ['шлях зупинки',F(dL,2)+' м'],['цикл',F(cyc.Tc,1)+' с'],['тюків за годину',F(cyc.bph,1)]]);

 trc('маса тюка, кг',P.m,b.m)+trc('суха речовина, кг',P.mDM,b.mDM)+trc('густина, кг/м³',P.rho,b.rho)+
 trc('похибка зважування, кг',P.err,L.method=='різницевий'?eD:eA)+trc('цикл, с',P.Tc,cyc.Tc)+
 '<tr><th style="text-align:left">налаштування</th><td colspan="3" style="text-align:left">'+
 esc(labDesc(P.set))+' → '+esc(labDesc(labSt()))+'</td></tr></table></div>';
s+=chamBox({...Q,D:L.D,turns:L.turns},'Камера за поточних налаштувань досліду.');
{const pts=[],pts2=[];
 for(let w=Math.max(4,V.wAvg-12);w<=V.wAvg+16;w+=0.5){const x=baleMass(V,{...Q,w:r1(w)});
  pts.push([r1(w),x.m]);pts2.push([r1(w),x.mDM])}
 s+='<h3>Вологість → маса тюка</h3>';
 s+=chart('l1',[{name:'маса тюка, кг',color:C('bale'),pts},{name:'суха речовина, кг',color:C('ac'),pts:pts2}],
  {h:200,y0:0,xl:'вологість матеріалу, %',lgb:1,vl:[[V.wSafe,C('wet'),'межа зберігання'],[L.w,C('ink'),'зараз']]})}
{const a=[],d=[];
 for(let th=0;th<=15.05;th+=0.25){const k=1-Math.cos(th*Math.PI/180);
  a.push([r2(th),f1((V.a.Mm+b.m)*k)]);d.push([r2(th),f1(b.m*k)])}
 s+='<h3>Нахил → похибка зважування</h3>';
 s+=chart('l2',[{name:'абсолютний метод, кг',color:C('wn'),pts:a},{name:'різницевий метод, кг',color:C('ac'),pts:d}],
  {h:200,x0:0,x1:15,y0:0,xl:'нахил ділянки, градуси',yl:'похибка, кг',lgb:1,vl:[[L.theta,C('ink'),'зараз']]})}
s+='<div class="concl">'+labConcl(b,eA,eD,dm,cyc,L)+'</div>';
if(L.log.length){s+='<h3>Журнал дослідів</h3><div class="tw"><table class="t2 c"><tr><th>№</th><th>D</th><th>тиск</th>'+
 '<th>v</th><th>w</th><th>θ</th><th>метод</th><th>маса</th><th>СР</th><th>похибка</th><th>цикл</th></tr>';
 L.log.forEach((r,i)=>{s+='<tr><td>'+(i+1)+'</td><td>'+F(r.set.D,2)+'</td><td>'+F(r.set.press)+'</td>'+
  '<td>'+F(r.set.v,1)+'</td><td>'+F(r.set.w,1)+'</td><td>'+F(r.set.theta,1)+'</td><td>'+esc(r.set.method)+'</td>'+
  '<td>'+F(r.m,1)+'</td><td>'+F(r.mDM,1)+'</td><td>'+F(r.err,1)+'</td><td>'+F(r.Tc,1)+'</td></tr>'});
 s+='</table></div><button class="g sm" onclick="labClr()">Очистити журнал</button>'}
s+=nb([6,'Протокол'],[8,'Калькулятор']);

const sld=(k,lab,u,a,b,st,v,nt)=>'<div><label>'+esc(lab)+': <b>'+F(v,st<1?(st<.1?2:1):0)+'</b> '+esc(u)+'</label>'+
 '<input type="range" min="'+a+'" max="'+b+'" step="'+st+'" value="'+v+'" oninput="setN(\''+k+'\',+this.value)">'+
 (nt?'<p class="hint" style="margin:0 0 6px">'+esc(nt)+'</p>':'')+'</div>';
const trc=(nm,a,b)=>{const d=b-a;return'<tr><th>'+esc(nm)+'</th><td>'+F(a,1)+'</td><td>'+F(b,1)+'</td><td>'+
 (d>0?'+':'')+F(r1(d),1)+'</td></tr>'};
function labSt(){const L=S.lab;return{D:L.D,press:L.press,v:L.v,w:L.w,theta:L.theta,method:L.method,
 pick:L.pick,tim:L.tim,turns:L.turns}}
function labMt(){const L=S.lab,Q=Qs({D:String(L.D),press:String(L.press),v:String(L.v),theta:String(L.theta),
  method:L.method,pick:L.pick,tim:L.tim,turns:String(L.turns),calW:1,calCell:1},V),
 b=baleMass(V,{...Q,w:L.w}),k=1-Math.cos(L.theta*Math.PI/180),
 err=L.method=='різницевий'?b.m*k:(V.a.Mm+b.m)*k,c=cycle(V,{...Q,turns:L.turns},b.m);
 return{m:b.m,mDM:b.mDM,rho:b.rho,V:b.V,err:f1(err),Tc:c.Tc,bph:c.bph,set:labSt()}}
function labPin(){S.lab.pin=labMt();save();R()}
function labUnpin(){S.lab.pin=null;save();R()}
function labLog(){S.lab.log.push(labMt());if(S.lab.log.length>14)S.lab.log.shift();save();R()}
function labClr(){S.lab.log=[];save();R()}
function labRst(){const I=V.ideal;S.lab={...S.lab,D:I.D,press:I.press,v:I.v,theta:V.theta,w:V.wAvg,
 method:'різницевий',pick:1,tim:1,turns:V.turnsOpt};save();R()}
const labDesc=s=>'D '+F(s.D,2)+' м, тиск '+F(s.press)+' %, '+F(s.v,1)+' км/год, w '+F(s.w,1)+
 ' %, θ '+F(s.theta,1)+'°, '+s.method;
function labConcl(b,eA,eD,dm,cyc,L){const u=[];
 u.push(b.m>V.mLim?'тюк '+F(b.m,1)+' кг важчий за межу навантажувача '+TH(V.mLim)+' кг — зменшіть діаметр'
  :Math.abs(b.m-V.mSet)/V.mSet<=.06?'маса '+F(b.m,1)+' кг відповідає цільовій'
  :'маса '+F(b.m,1)+' кг відхиляється від цільової на '+F(r1(100*(b.m-V.mSet)/V.mSet),1)+' %');
 u.push(L.w>V.wSafe?'вологість '+F(L.w,1)+' % вища за безпечну '+F(V.wSafe)+
  ' %: тюк самонагріється у сховищі, хоча важить більше — це вода, а не корм'
  :'вологість '+F(L.w,1)+' % у межах безпечної; сухої речовини в тюку '+F(b.mDM,1)+' кг');
 u.push(L.method=='різницевий'?'різницевий метод на '+F(L.theta,1)+'° дає похибку '+F(r1(eD),1)+
  ' кг замість '+F(r1(eA),1)+' кг в абсолютного'
  :'абсолютний метод на '+F(L.theta,1)+'° помиляється на '+F(r1(eA),1)+' кг — це '+
   F(r1(100*eA/b.m),1)+' % маси тюка');
 u.push(L.tim?'з автозупинкою зайва маса '+F(dm,1)+' кг':'без автозупинки зайва маса '+F(dm,1)+
  ' кг на кожному тюку');
 if(!L.pick)u.push('підбирач не піднято — показання ваг «гуляють» від нерівностей');
 if(L.turns<V.turnsOpt-0.05)u.push('витків сітки замало: тюки втрачатимуть форму');
 u.push('цикл '+F(cyc.Tc,1)+' с → '+F(cyc.bph,1)+' тюка за годину, '+F(cyc.haph,2)+' га/год');
 return'<b>Що показує цей набір налаштувань:</b><ul><li>'+u.join('</li><li>')+'</li></ul>'}

/* ---------- 8. Калькулятор ---------- */
function scr8(){const c=S.calc,g=k=>n(c[k]);
let s=H('Калькулятор','Незалежний від варіанта. Сюди підставляють числа з умов методички й перевіряють свої розрахунки.');
s+='<h3>Тюк: об’єм, густина, суха речовина</h3>';
s+='<div class="r3"><div>'+inp('calc.D','D — діаметр тюка, м','1,25')+'</div>'+
 '<div>'+inp('calc.W','W — ширина тюка, м','1,20')+'</div>'+
 '<div>'+inp('calc.m','m — маса тюка, кг','280')+'</div></div>';
s+='<div class="r3"><div>'+inp('calc.w','w — вологість, %','16')+'</div><div></div><div></div></div>';
if(g('D')&&g('W')){const Vb=Math.PI*g('D')*g('D')*g('W')/4;
 s+='<div class="tw"><table class="t2">'+
  tr('Об’єм тюка','V = π·D²·W/4 = 3,1416 · '+F(g('D'),2)+'² · '+F(g('W'),2)+' / 4 = <b>'+F(r3(Vb),3)+' м³</b>')+
  (g('m')?tr('Густина','ρ = m/V = '+F(g('m'),1)+' / '+F(r3(Vb),3)+' = <b>'+F(r1(g('m')/Vb),1)+' кг/м³</b>'):'')+
  (g('m')&&g('w')!=null?tr('Суха речовина','m_СР = m·(1 − w/100) = '+F(g('m'),1)+'·(1 − '+F(g('w'),1)+
    '/100) = <b>'+F(r1(g('m')*(1-g('w')/100)),1)+' кг</b>'):'')+
  (g('m')&&g('w')!=null?tr('Густина сухої речовини','ρ_СР = m_СР/V = <b>'+
    F(r1(g('m')*(1-g('w')/100)/Vb),1)+' кг/м³</b>'):'')+
  '</table></div>'}
s+='<h3>Валок і вихід з гектара</h3>';
s+='<div class="r3"><div>'+inp('calc.U','U — урожайність вологої маси, кг/га','3800')+'</div>'+
 '<div>'+inp('calc.b','b — ширина смуги у валок, м','7,0')+'</div>'+
 '<div>'+inp('calc.lam','λ — погонна маса валка, кг/м','')+'</div></div>';
if(g('U')&&g('b')){const lam=g('U')*g('b')/10000;
 s+='<div class="tw"><table class="t2">'+
  tr('Погонна маса валка','λ = U·b/10000 = '+TH(g('U'))+' · '+F(g('b'),1)+' / 10000 = <b>'+F(r2(lam),2)+' кг/м</b>')+
  (g('m')?tr('Довжина валка на тюк','L = m/λ = '+F(g('m'),1)+' / '+F(r2(lam),2)+' = <b>'+
    F(r1(g('m')/lam),1)+' м</b>'):'')+
  (g('w')!=null?tr('Вихід сухої речовини','DM = U·(1 − w/100) = '+TH(g('U'))+'·(1 − '+F(g('w'),1)+
    '/100) = <b>'+F(r2(g('U')*(1-g('w')/100)/1000),2)+' т/га</b>'):'')+
  '</table></div>'}
s+='<h3>Зважування на схилі</h3>';
s+='<div class="r3"><div>'+inp('calc.Mm','M_маш — маса машини, кг','3250')+'</div>'+
 '<div>'+inp('calc.th','θ — нахил, градуси','10')+'</div><div></div></div>';
if(g('Mm')&&g('th')!=null&&g('m')){const k=1-Math.cos(g('th')*Math.PI/180);
 s+='<div class="tw"><table class="t2">'+
  tr('1 − cos θ','1 − cos '+F(g('th'),1)+'° = <b>'+F(r3(k),3)+'</b>')+
  tr('Абсолютний метод','(M_маш + m)·(1 − cos θ) = ('+TH(g('Mm'))+' + '+F(g('m'),1)+')·'+F(r3(k),3)+
    ' = <b>'+F(r1((g('Mm')+g('m'))*k),1)+' кг</b> (' +F(r1(100*(g('Mm')+g('m'))*k/g('m')),1)+' % маси тюка)')+
  tr('Різницевий метод','m·(1 − cos θ) = '+F(g('m'),1)+'·'+F(r3(k),3)+' = <b>'+F(r1(g('m')*k),1)+
    ' кг</b> ('+F(r1(100*k),1)+' % маси тюка)')+

 '<div>'+inp('calc.Tr','T_затр — запізнення, с','1,2')+'</div>'+

if(g('v')&&g('Tr')!=null&&g('a')){const u=g('v')/3.6,L1=u*g('Tr'),L2=u*u/(2*g('a')),dL=L1+L2,

  tr('Шлях гальмування','(v/3,6)²/(2a) = '+F(r2(u),2)+'²/(2·'+F(g('a'),1)+') = <b>'+F(r2(L2),2)+' м</b>')+

  (lam?tr('Зайвий матеріал','Δm = λ·ΔL = '+F(r2(lam),2)+' · '+F(r2(dL),2)+' = <b>'+F(r1(lam*dL),1)+

function go(i){S.step=i;save();scrollTo(0,0);R()}
function nav(){let s='';
for(let i=0;i<=NST;i++){const d=done(i),on=S.step==i?' on':'';
 s+='<button class="'+on.trim()+'" onclick="go('+i+')"'+(i>0&&!S.reg?' disabled':'')+'>'+
  '<i class="'+(d==1?'ok':d?'pt':'')+'"></i>'+esc(TT[i])+'</button>'}
s+='<button class="lab'+(S.step==LAB?' on':'')+'" onclick="go('+LAB+')"'+(!S.reg?' disabled':'')+
 '><i></i>'+esc(TT[LAB])+'</button>';
s+='<button class="lab'+(S.step==CALC?' on':'')+'" onclick="go('+CALC+')"><i></i>'+esc(TT[CALC])+'</button>';
return s}
function dashP(){if(!V)return'<div class="t">ТЕРМІНАЛ ПРЕС-ПІДБИРАЧА</div><div class="d"><span>варіант не отримано</span></div>';
const b=baleMass(V,QS({})),l=S.tr.last,rr=ref(),
 d=(a,x,al)=>'<div class="d'+(al?' al':'')+'"><span>'+a+'</span><span>'+x+'</span></div>';
let s='<div class="t">ТЕРМІНАЛ · '+esc(V.id)+'</div>';
s+=d('матеріал',esc(V.crop.split(' ')[0]));
s+=d('D_set, м',F(Dnow(),2),DnowRaw()<V.a.Dmin-1e-9||DnowRaw()>V.a.Dmax+1e-9);
s+=d('тиск, %',F(pressNow()));
s+=d('маса тюка, кг',F(b.m,1),Math.abs(b.m-V.mSet)/V.mSet>.06||b.m>V.mLim);
s+=d('суха речовина, кг',F(b.mDM,1));
s+=d('вологість, %',F(V.wAvg+(S.calW?0:V.fl.wCal),1),!S.calW);
s+=d('швидкість, км/год',F(vNow(),1),vNow()>V.vOpt+1.5);
s+=d('метод зважування',S.method=='різницевий'?'різниц.':'абсол.',S.method!='різницевий');
s+=d('схил, °',F(thNow(),1));
s+=d('ΔL, м',F(rr.dL,2),!S.tim);
s+=d('перед-зупинка, кг',F(n(S.preStop)??0,1),Math.abs((n(S.preStop)??0)-rr.dm)>Math.max(2,rr.dm*.15));
s+=d('витків сітки',F(turnsNow(),1),turnsNow()<V.turnsOpt-0.05);
if(l){s+='<div class="t" style="margin-top:8px">ПРОХІД №'+S.tr.n+'</div>';
 s+=d('тюків',String(l.N));
 s+=d('середня маса, кг',F(l.mu,1));
 s+=d('CV, %',F(l.cv,1),l.cv>7);
 s+=d('похибка СР, %',F(l.errDM,1),Math.abs(l.errDM)>2);
 s+=d('вологих / пропущено',l.wet+' / '+l.miss,l.miss>0);
 s+=d('DM, т/га',F(l.dmGa,2))}
return s}
function bann(){if(!S.demo)return'';
return'<div class="bn"><span><b>Відкрито приклад із методички.</b> Усі поля заповнені правильними значеннями — '+
 'на ньому видно, як має виглядати виконана робота. Для свого звіту отримайте власний варіант.</span>'+
 '<button class="p" style="margin:0" onclick="go(0)">Отримати свій варіант</button></div>'}
function R(){const m=document.getElementById('mn');
 document.getElementById('nv').innerHTML=nav();
 document.getElementById('bn').innerHTML=bann();
 document.getElementById('ds').innerHTML=dashP();
 document.getElementById('chip').textContent=V?('варіант '+V.id+' · '+F(r1(tot()),1)+' / 100'):'варіант не отримано';
 if(!S.reg||!V)S.step=0;
 m.innerHTML=[scr0,scr1,scr2,scr3,scr4,scr5,scr6,scr7,scr8][S.step]();
 for(const id of ['cdm','csl','cst','l1','l2'])chBind(id,chTip(id));
 aniPaint();
 if(ANI.run){ANI.last=performance.now();requestAnimationFrame(aniTick)}}
function chTip(id){const L=S.lab,Q=QS({});
 if(id=='cdm')return x=>{const b=baleMass(V,{...Q,D:r2(x)});
  return'D = '+F(r2(x),2)+' м<br>V = '+F(b.V,3)+' м³<br>маса '+F(b.m,1)+' кг<br>суха речовина '+F(b.mDM,1)+' кг'};
 if(id=='csl'){const b=baleMass(V,Q);return x=>{const k=1-Math.cos(x*Math.PI/180);
  return'θ = '+F(r2(x),2)+'°<br>абсолютний '+F(r1(100*(V.a.Mm+b.m)*k/b.m),1)+' %<br>різницевий '+F(r1(100*k),1)+' %'}}
 if(id=='cst')return x=>'v = '+F(r2(x),1)+' км/год<br>без TIM '+F(r1(V.lam*stopLen(x,V.Tr,V.acc)),1)+
  ' кг<br>із TIM '+F(r1(V.lam*stopLen(x,V.TrTim,V.acc)),1)+' кг';
 if(id=='l1')return x=>{const b=baleMass(V,{...Qs({D:String(L.D),press:String(L.press),v:String(L.v)},V),w:r1(x)});
  return'вологість '+F(r1(x),1)+' %<br>маса '+F(b.m,1)+' кг<br>суха речовина '+F(b.mDM,1)+' кг'};
 if(id=='l2'){const b=baleMass(V,{...Qs({D:String(L.D),press:String(L.press)},V),w:L.w});
  return x=>{const k=1-Math.cos(x*Math.PI/180);
   return'θ = '+F(r2(x),2)+'°<br>абсолютний '+F(r1((V.a.Mm+b.m)*k),1)+' кг<br>різницевий '+F(r1(b.m*k),1)+' кг'}}
 return()=>null}
/* ===== Запуск ===== */
theme(0);
if(!S){demoState();save()}            /* перше відкриття: приклад із методички */
let RW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-RW)>8){RW=innerWidth;clearTimeout(R.t);R.t=setTimeout(R,180)}});
R();
