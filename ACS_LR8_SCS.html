<header class="top"><h1>Симулятор системи керування обприскувачем<small>Пульт керування, дозування, секційні клапани, штанга і знесення. Лабораторна робота №8</small></h1>
<div class="tools"><span class="chip" id="chip"></span><button class="g sm" id="thb" onclick="theme()" title="Перемкнути тему">Тема: авто</button></div></header>
<div id="bn"></div>
<div class="lay"><nav id="nv" aria-label="Кроки роботи"></nav><main id="mn"></main><aside id="ds" aria-label="Термінал обприскувача в кабіні"></aside></div></div>

<script>
/* Симулятор до лабораторної роботи №8.
   Автоматичні системи керування машинами для захисту рослин:
   пульт керування штангового обприскувача, дозування, секції, штанга й знесення.
   Один файл, без зовнішніх бібліотек і шрифтів; працює без мережі. */
const KEY='lr8v1',TKEY='lr8theme';
/* ===== Модель системи керування обприскувачем (ЛР №8) =====
   Основа — два співвідношення, які виводяться в методичці:
     q(p) = q_ном · √(p / 3)             витрата розпилювача, л/хв (p у барах)
     Q    = 600 · q / (v · a)            норма внесення, л/га
   Решта (знесення, поперечний розподіл, компенсація тиску) побудована на них. */
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),f1=x=>Math.round(x*10)/10,f2=x=>Math.round(x*100)/100,
      n=x=>{const v=parseFloat(String(x).replace(',','.'));return isNaN(v)?null:v};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gs=r=>(r()+r()+r()-1.5)*2;            /* нормальний розподіл, одинична дисперсія */

/* --- Розпилювачі за ISO 10625: код типорозміру, колір, номінальна витрата при 3 бар --- */
const TIP=[{c:'01',col:'помаранчевий',q:0.40,hex:'#E8762C'},
           {c:'015',col:'зелений',    q:0.60,hex:'#3C9A48'},
           {c:'02', col:'жовтий',     q:0.80,hex:'#E3B617'},
           {c:'025',col:'бузковий',   q:1.00,hex:'#9B6FBF'},
           {c:'03', col:'синій',      q:1.20,hex:'#2B6CB0'},
           {c:'04', col:'червоний',   q:1.60,hex:'#C0392B'},
           {c:'05', col:'коричневий', q:2.00,hex:'#8A5A2B'},
           {c:'06', col:'сірий',      q:2.40,hex:'#7F8C8D'}];
/* --- Типи розпилювачів: kd — у скільки разів крупніша крапля за щілинний стандартний --- */
const NOZ=[{t:'Щілинний стандартний',  ab:'ST', kd:1.00,pmin:1.5,pmax:5.0},
           {t:'Щілинний антизносний',  ab:'AD', kd:1.28,pmin:1.5,pmax:5.0},
           {t:'Інжекторний компактний',ab:'IDK',kd:1.72,pmin:2.0,pmax:8.0},
           {t:'Інжекторний подовжений',ab:'ID', kd:2.05,pmin:2.0,pmax:8.0}];
/* --- Категорії крапель за ASABE S572.1 (межі за медіанним діаметром, мкм) --- */
const DCAT=[[0,145,'дуже дрібна','VF','#C0392B'],[145,225,'дрібна','F','#E8762C'],
            [225,325,'середня','M','#E3B617'],[325,400,'груба','C','#2B6CB0'],
            [400,500,'дуже груба','VC','#3C9A48'],[500,650,'надгруба','XC','#7F8C8D'],
            [650,1e4,'ультрагруба','UC','#2C3E50']];
const dcat=d=>DCAT.find(x=>d>=x[0]&&d<x[1])||DCAT[DCAT.length-1];

/* --- Обприскувачі --- */
/* Кількість секцій підібрано так, щоб на кожну припадала ціла кількість
   розпилювачів: B / a має ділитися на N без остачі. */
const SPR=[{p:'Amazone UX 4200 Super',B:24,N:6,tank:4200,pump:260,ang:110},
           {p:'Hardi Navigator 4000',  B:24,N:4,tank:4000,pump:180,ang:110},
           {p:'John Deere R4040i',     B:30,N:5,tank:4000,pump:380,ang:110},
           {p:'Horsch Leeb 5 LT',      B:30,N:6,tank:5000,pump:400,ang:110},
           {p:'Berthoud Tenor 4500',   B:28,N:7,tank:4500,pump:260,ang:110},
           {p:'Lemken Albatros 9/4500',B:27,N:6,tank:4500,pump:300,ang:80}];
const TRK=['John Deere 6155M','Fendt 724 Vario','New Holland T7.215','Case IH Puma 185','Deutz-Fahr 6185'];
/* --- Види обробки: норма внесення і потрібний діапазон медіанного діаметра краплі --- */
const OPS=[{o:'Ґрунтове внесення до сходів',       Q:[200,300],d:[325,550],why:'покриття не критичне, знесення критичне'},
           {o:'Післясходове внесення системного препарату',Q:[100,200],d:[250,450],why:'препарат переміщується в рослині'},
           {o:'Обробка по вегетації контактним препаратом',Q:[200,300],d:[180,300],why:'потрібне щільне покриття листка'},
           {o:'Обробка по вегетації проти шкідників',Q:[100,200],d:[200,350],why:'покриття по всій висоті рослини'}];
const CROP=['пшениця озима','кукурудза','соняшник','ріпак озимий','соя'];

/* --- Основні співвідношення --- */
const PNOM=3,                                        /* номінальний тиск ISO, бар */
      DBAND=0.20;                                    /* смуга компенсації пропорційного клапана */
const qOf=(qn,p)=>qn*Math.sqrt(p/PNOM);              /* витрата розпилювача, л/хв */
const pOf=(qn,q)=>PNOM*Math.pow(q/qn,2);             /* обернено: потрібний тиск, бар */
const rate=(q,v,a)=>600*q/(v*a);                     /* норма внесення, л/га */
const qNeed=(Q,v,a)=>Q*v*a/600;                      /* потрібна витрата розпилювача, л/хв */
/* медіанний діаметр краплі: зростає з типорозміром, спадає з тиском */
const vmd=(nz,qn,p)=>Math.round(215*nz.kd*Math.pow(PNOM/p,1/3)*Math.pow(qn/0.8,0.22));
/* оптимальна висота штанги над обробленою поверхнею, м */
const hOpt=ang=>ang>=110?0.50:0.75;

function mkV(r_){const R=rng(hash([r_.group,r_.name,r_.num].join('|').toLowerCase().replace(/\s+/g,' '))),
 pk=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>Math.round(a+R()*(b-a)),rf=(a,b)=>a+R()*(b-a);
const sp=pk(SPR),op=pk(OPS),trk=pk(TRK),crop=pk(CROP),
 a=0.5,                                              /* крок розпилювачів на штанзі, м */
 nNoz=Math.round(sp.B/a),
 Qp=ri(op.Q[0]/10,op.Q[1]/10)*10,                    /* планова норма внесення, л/га */
 vp=f1(rf(7,12));                                    /* планова швидкість, км/год */
const V={a:sp,trk,crop,op:op.o,opWhy:op.why,dmin:op.d[0],dmax:op.d[1],
 aNoz:a,nNoz,B:sp.B,Nsec:sp.N,tank:sp.tank,pump:sp.pump,ang:sp.ang,
 hOpt:hOpt(sp.ang),Qp,vp,
 wind:f1(rf(1.5,4.8)),                               /* швидкість вітру, м/с */
 Tg:f2(rf(.18,.32)),                                 /* запізнення приймача GNSS, с */
 Tv:f2(rf(.12,.28)),                                 /* спрацювання секційного клапана, с */
 S:ri(180,460),                                      /* площа поля для проходу, га */
 sigV:f1(rf(9,16)),                                  /* типове коливання робочої швидкості в загінці, % */
 wedge:f1(rf(4,11)),                                 /* перекриття без секційного вимикання, % */
 pres:f1(rf(.8,2.0)),                                /* залишкове перекриття із системою, % */
 Cprep:ri(600,1800),                                 /* вартість препарату, грн/га */
 id:'В-'+(hash(r_.group+r_.name+r_.num+'#id')%9000+1000)};
/* час проходження рідини магістраллю від клапана до розпилювача */
V.L=Math.round(Math.sqrt(V.S*1e4)*rf(.7,1.4)/50)*50;   /* довжина гону, м */
/* річний обсяг обробок: площа господарства, помножена на кількість обробок за сезон.
   Прив’язаний до ширини захвату — ширшу машину беруть під більший обсяг. */
V.Sy=Math.round(sp.B*rf(60,140)/50)*50;
/* вартість системи автоматики зростає з кількістю секцій і шириною штанги */
V.Csys=Math.round((120+sp.N*22+sp.B*2.5)*rf(.88,1.14))*1000;
V.Tl=f2(0.10+V.B/300);
V.Tz=f2(V.Tg+V.Tv+V.Tl);
V.nSec=V.nNoz/V.Nsec;                                /* ціле за побудовою таблиці SPR */
V.ncr=Math.round(2*V.S*1e4/(V.B*V.L)*(1+V.wedge/20));   /* перетинів межі за поле */                    /* розпилювачів у секції */
/* приховані несправності */
const fl={wear:R()<.60?ri(1,V.Nsec):0,              /* зношені розпилювачі секції */
          block:R()<.50?ri(1,V.Nsec):0,             /* частково забитий розпилювач */
          cal:R()<.65?f1(rf(4,9))*(R()<.5?-1:1):0,  /* похибка витратоміра, % */
          comp:R()<.45?ri(1,V.Nsec):0};             /* нерегульований компенсаційний клапан */
if(fl.block==fl.wear&&fl.wear)fl.block=fl.block%V.Nsec+1;
if(fl.comp==fl.wear||fl.comp==fl.block)fl.comp=0;
V.fl=fl;
V.wearK=f2(rf(1.12,1.22));                           /* у скільки разів більше дає зношений */
V.blockK=f2(rf(.76,.86));                            /* і менше — частково забитий */
V.ideal=idealQ(V);
return V}

/* --- Рекомендовані (еталонні) налаштування варіанта --- */
function idealQ(V){
 /* розпилювач: найменший типорозмір, що дає потрібний тиск у робочому діапазоні
    і медіанний діаметр краплі в потрібних межах */
 let best=null;
 for(const nz of NOZ)for(const t of TIP){
  const q=qNeed(V.Qp,V.vp,V.aNoz),p=pOf(t.q,q);
  if(p<nz.pmin||p>nz.pmax)continue;
  const d=vmd(nz,t.q,p);
  if(d<V.dmin||d>V.dmax)continue;
  /* з допустимих обираємо найгрубшу краплю: вона менше зноситься вітром */
  const aim=V.dmin+0.78*(V.dmax-V.dmin),score=Math.abs(d-aim)/aim+Math.abs(p-3)/8;
  if(!best||score<best.score)best={nz,t,p:f1(p),d,score}}
 if(!best){const t=TIP[2],nz=NOZ[1],q=qNeed(V.Qp,V.vp,V.aNoz);
  best={nz,t,p:f1(cl(pOf(t.q,q),1.5,5)),d:vmd(nz,t.q,3),score:9}}
 return{tip:best.t.c,noz:best.nz.ab,p:best.p,h:V.hOpt,dose:'швидкість',sec:1,comp:1,d:best.d}}

/* --- Поточні налаштування --- */
const tipOf=c=>TIP.find(x=>x.c==c)||TIP[2];
const nozOf=ab=>NOZ.find(x=>x.ab==ab)||NOZ[0];

/* --- Гідравліка пульта керування ---
   Qs — набір: tip, noz, p (задана уставка тиску), v, dose, open[] (відкриті секції),
   comp (компенсаційні клапани працюють), h (висота штанги) */
function hyd(V,Q){const t=tipOf(Q.tip),nz=nozOf(Q.noz),
 nOpen=Q.open?Q.open.filter(Boolean).length:V.Nsec,
 nAll=V.Nsec;
let p;
if(Q.dose=='швидкість'){                             /* DPA: комп’ютер тримає норму */
 const q=qNeed(V.Qp,Q.v,V.aNoz);p=pOf(t.q,q)}
else if(Q.dose=='оберти'){
 /* пропорційний клапан стежить за подачею насоса, а та — за обертами вала.
    Поки швидкість змінюється в межах ±20 % від планової, компенсація повна;
    за цими межами клапан виходить на упор і далі норма «пливе», як при постійному тиску. */
 const q=qNeed(V.Qp,V.vp,V.aNoz),k=cl(Q.v/V.vp,1-DBAND,1+DBAND);
 p=pOf(t.q,q)*k*k}
else p=Q.p;                                          /* постійний тиск: що виставили, те й є */
/* вимикання секцій без компенсації: той самий потік насоса на меншу кількість розпилювачів */
const kComp=(Q.comp&&!Q.badComp)?1:Math.pow(nAll/Math.max(1,nOpen),2);
p=p*kComp;
p=cl(p,0.3,12);
const q=qOf(t.q,p),                                  /* витрата справного розпилювача, л/хв */
 Qtot=f1(q*V.nSec*nOpen),                            /* витрата штанги, л/хв */
 Qact=f1(rate(q,Q.v,V.aNoz)),                        /* фактична норма внесення, л/га */
 d=vmd(nz,t.q,p);
return{p:f2(p),q:f2(q),Qtot,Qact,d,cat:dcat(d),nOpen,
 over:nz.pmax&&p>nz.pmax,under:p<nz.pmin,
 pumpOver:Qtot>V.pump,t,nz}}

/* --- Пролив: фактична витрата кожної секції з урахуванням несправностей --- */
function secFlow(V,Q,h){const out=[];
 for(let s=1;s<=V.Nsec;s++){
  const open=!Q.open||Q.open[s-1],
   wear=(V.fl.wear==s&&!Q.fixWear)?V.wearK:1,
   blk =(V.fl.block==s&&!Q.fixBlock)?V.blockK:1;
  /* розпилювачі секції зношуються разом (їх і міняють секцією), тому зношення
     зміщує всю секцію; забивається ж один розпилювач, і в середньому по секції
     це майже непомітно — знайти його можна лише проливом кожного розпилювача */
  const k=wear*(1+(blk-1)/V.nSec);
  out.push({s,open,k:f2(k),q:f2(h.q*wear),Qs:f1(h.q*k*V.nSec),
   wear:wear!=1?1:0,block:blk!=1?1:0,blkQ:blk!=1?f2(h.q*wear*blk):0})}
return out}

/* --- Пролив окремих розпилювачів обраної секції, л/хв --- */
function nozFlow(V,Q,h,sec){const r=rng(hash(V.id+'n'+sec)),out=[],
 wear=(V.fl.wear==sec&&!Q.fixWear)?V.wearK:1,
 blkPos=V.fl.block==sec&&!Q.fixBlock?1+Math.floor(r()*V.nSec):0;
for(let i=1;i<=V.nSec;i++){
 const k=wear*(i==blkPos?V.blockK:1)*(1+0.012*gs(r));   /* ±1,2 % природний розкид */
 out.push({i,q:f2(h.q*k),blk:i==blkPos})}
return out}

/* --- Поперечний розподіл під штангою: CV, % --- */
function boomCV(V,Q,rows){const h=Q.h??V.hOpt,ho=V.hOpt,
 low=Math.max(0,(ho-h)/ho),high=Math.max(0,(h-ho)/ho);
let cv=4+70*Math.pow(low,1.7)+18*Math.pow(high,1.6);
for(const r of rows||[]){if(r.wear)cv+=2.6;if(r.block)cv+=6.2}
 /* висока швидкість розгойдує штангу */
 cv+=Math.max(0,(Q.v-12))*0.8;
return f1(cl(cv,3,60))}

/* --- Знесення, % від норми внесення --- */
function drift(V,Q,d){const h=Q.h??V.hOpt,w=Q.wind??V.wind;
 return f1(cl(2.4*Math.pow(Math.max(.3,w)/3,1.6)*Math.pow(250/Math.max(60,d),2.1)*Math.pow(h/V.hOpt,0.8),0,60))}
/* ширина буферної зони, м */
const buffer=dr=>Math.round(cl(3*dr,0,60));

/* --- Пробний прохід --- */
function pass(V,Q){const h=hyd(V,Q),rows=secFlow(V,Q,h),
 cv=boomCV(V,Q,rows),dr=drift(V,Q,h.d),
 /* фактична норма з урахуванням несправностей секцій */
 kAvg=rows.filter(r=>r.open).reduce((a,b)=>a+b.k,0)/Math.max(1,h.nOpen),
 /* похибка витратоміра переходить у норму лише в режимі «пропорційно швидкості» */
 kCal=(Q.dose=='швидкість'&&!Q.calFixed)?(1+V.fl.cal/100):1,
 Qact=f1(h.Qact*kAvg*kCal),
 dev=f1(100*(Qact-V.Qp)/V.Qp),
 /* секційне вимикання за GNSS */
 dL=f2(Q.v/3.6*(V.Tz-(Q.Tlead??0))),
 ncr=V.ncr,
 over=f2(100*(Math.max(0,dL)*V.B*ncr/2e4)/V.S),
 under=f2(100*(Math.max(0,-dL)*V.B*ncr/2e4)/V.S),
 /* витрата робочого розчину на поле й заправки */
 need=Math.round(Qact*V.S),fills=Math.ceil(need/V.tank),
 segArea=f1(V.tank/Math.max(1,Qact)),                 /* га з однієї заправки */
 bad=rows.filter(r=>r.wear||r.block).map(r=>r.s);
return{...h,rows,cv,drift:dr,buffer:buffer(dr),Qact,dev,dL,ncr,over,under,
 need,fills,segArea,bad,kAvg:f2(kAvg),kCal:f2(kCal)}}

/* --- Діапазон робочих швидкостей для обраного розпилювача (режим DPA) --- */
function vRange(V,Q){const t=tipOf(Q.tip),nz=nozOf(Q.noz),
 vmin=600*qOf(t.q,nz.pmin)/(V.Qp*V.aNoz),
 vmax=600*qOf(t.q,nz.pmax)/(V.Qp*V.aNoz);
return{vmin:f1(vmin),vmax:f1(vmax),pmin:nz.pmin,pmax:nz.pmax}}

/* --- Економіка --- */
/* Середня за сезон похибка норми внесення для кожної системи дозування.
   За постійного тиску норма змінюється обернено до швидкості, тому похибка дорівнює
   коливанню швидкості; пропорційний клапан гасить його приблизно втричі;
   дозування за швидкістю лишає тільки похибку витратоміра. */
function devMode(V,dose,calFixed){
 let e=dose=='тиск'?V.sigV:dose=='оберти'?V.sigV*0.30:1.5;
 if(dose=='швидкість'&&!calFixed)e+=Math.abs(V.fl.cal);
 return f1(e)}

function econ(V,r1_,r2_){
 /* Три джерела вигоди. Похибка дозування діє на кожному гектарі щороку —
    коефіцієнта «частки виявлення» тут немає, бо це систематична похибка, а не
    несправність, яку колись помічають. */
 const Lp1=devMode(V,r1_.dose,r1_.calFixed)/100,Lp2=devMode(V,r2_.dose,r2_.calFixed)/100,
  Ep=Math.round(Math.max(0,Lp1-Lp2)*V.Cprep*V.Sy),    /* точність дозування */
  dA=f1(V.Sy*(V.wedge-V.pres)/100),                   /* площа перекриття за сезон */
  Es=Math.round(dA*V.Cprep),                          /* секційне вимикання */
  Ld=Math.max(0,(r1_.drift-r2_.drift))/100,
  Ed=Math.round(Ld*V.Cprep*V.Sy),                     /* зменшення знесення */
  Cex=Math.round(.10*V.Csys),
  E=Ep+Es+Ed,Enet=E-Cex;
return{Lp1:f1(100*Lp1),Lp2:f1(100*Lp2),Ep,dA,Es,Ed,dr1:r1_.drift,dr2:r2_.drift,Cex,E,Enet,
 T:Enet>0?f2(V.Csys/Enet):null}}

/* --- Бали: 16 + 20 + 20 + 22 + 22 = 100 --- */
const pen=(e,t,s)=>e<=t?0:Math.min(1,(e-t)/s);
const okn=(x,y,t)=>x!==''&&x!=null&&n(x)!=null&&Math.abs(n(x)-y)<=t;
function score(S_,V){const r=[0,0,0,0,0],Q=Qs(S_,V),h=hyd(V,Q),p=pass(V,Q);
/* 1. Налаштування: розрахунок витрати й тиску, вибір розпилювача — 16 */
{const b=S_.bd||{},q0=qNeed(V.Qp,n(S_.v)||V.vp,V.aNoz),t=tipOf(S_.tip),p0=pOf(t.q,q0);
 r[0]=(okn(b.q,q0,Math.max(.02,q0*.02))?6:0)+(okn(b.p,p0,Math.max(.1,p0*.03))?6:0)+
      (S_.tip&&S_.noz?4:0)}
/* 2. Пролив і діагностика — 20 */
{const ck=S_.ck||{};let k=0;
 const said=(v)=>Object.keys(ck).some(x=>ck[x]==v);
 k+=(V.fl.wear?ck['s'+V.fl.wear]=='Зношені розпилювачі':!said('Зношені розпилювачі'))?5:0;
 k+=(V.fl.block?ck['s'+V.fl.block]=='Частково забитий розпилювач':!said('Частково забитий розпилювач'))?5:0;
 k+=(V.fl.comp?ck['s'+V.fl.comp]=='Нерегульований компенсаційний клапан':!said('Нерегульований компенсаційний клапан'))?4:0;
 k+=S_.calDone?(S_.calFixed?4:2):0;
 k+=S_.pourDone?2:0;
 r[1]=k}
/* 3. Дозування і діапазон швидкостей — 20 */
{const b=S_.bd||{},vr=vRange(V,Q);
 r[2]=(okn(b.vmin,vr.vmin,Math.max(.2,vr.vmin*.04))?6:0)+(okn(b.vmax,vr.vmax,Math.max(.2,vr.vmax*.04))?6:0)+
      (S_.dose=='швидкість'?5:S_.dose=='оберти'?3:0)+(S_.doseWhy?3:0)}
/* 4. Секції, штанга й знесення — 22 */
{const b=S_.bd||{},dL=Math.abs((n(S_.v)||V.vp)/3.6*(V.Tz-(n(S_.Tlead)??0)));
 /* знесення оцінюємо не за абсолютним числом: вітер і потрібна крапля задані варіантом,
    і за сильного вітру низького знесення не досягти жодними налаштуваннями.
    Порівнюємо з тим, що дають еталонні налаштування в тих самих умовах. */
 const dr0=drift(V,{h:V.hOpt,wind:V.wind},V.ideal.d);
 r[3]=(okn(b.Tz,V.Tz,.03)?5:0)+5*(1-pen(dL,.2,.8))
      +6*(1-pen(p.cv,7,10))+6*(1-pen(p.drift,dr0+0.3,6))}
/* 5. Прохід і економіка — 22 */
{const l=S_.tr&&S_.tr.last;
 if(l){const e=ecRef(S_,V),b=S_.ec||{};
  r[4]=8*(1-pen(Math.abs(l.dev),3,10))+(okn((S_.bd||{}).need,l.need,Math.max(50,l.need*.02))?4:0)
   +(okn((S_.bd||{}).fills,l.fills,0)?3:0)
   +(e?((okn(b.E,e.E,Math.max(500,e.E*.03))?4:0)+(e.T!=null&&okn(b.T,e.T,Math.max(.05,e.T*.08))?3:0)):0)}}
return r.map(x=>Math.max(0,Math.round(x*10)/10))}

/* Еталонна економіка: перший прохід проти останнього */
function ecRef(S_,V){const h=S_.hist||[];if(h.length<1)return null;
 return econ(V,h[0],h[h.length-1])}

/* --- Поточні параметри з полів студента --- */
function Qs(S_,V,o){return Object.assign({
 tip:S_.tip||V.ideal.tip,noz:S_.noz||V.ideal.noz,
 p:n(S_.p)||V.ideal.p,v:n(S_.v)||V.vp,
 dose:S_.dose||'тиск',h:n(S_.h)??V.hOpt,wind:n(S_.wind)??V.wind,
 open:S_.open||new Array(V.Nsec).fill(1),
 comp:S_.comp??1,badComp:!!(V.fl.comp&&!S_.fixComp&&S_.open&&!S_.open[V.fl.comp-1]),
 Tlead:n(S_.Tlead)??0,calFixed:!!S_.calFixed,
 fixWear:!!S_.fixWear,fixBlock:!!S_.fixBlock,fixComp:!!S_.fixComp},o||{})}
/* ===== Стан, збереження, прохід, протокол ===== */
const DEMO={group:'Приклад',name:'Демонстраційний приклад',num:35};
const F=(x,d)=>{if(x===''||x==null||(typeof x=='number'&&isNaN(x)))return'—';const s=d==null?String(x):Number(x).toFixed(d);return s.replace('.',',').replace('-','−')};
const r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100,r3=x=>Math.round(x*1000)/1000;
const TH=x=>(x<0?'−':'')+String(Math.round(Math.abs(x))).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vs=x=>esc(String(x??'').replace('.',','));
const NAR=()=>innerWidth<620;
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.tr)S=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let V=S&&S.reg?mkV(S.reg):null,AN=0;

 t.last={...p,v:Q.v,tip:Q.tip,noz:Q.noz,dose:Q.dose,h:Q.h,wind:Q.wind,Tlead:Q.Tlead,
  calFixed:Q.calFixed?1:0,comp:Q.comp?1:0};

  drift:p.drift,dL:p.dL,buffer:p.buffer,d:p.d,calFixed:Q.calFixed?1:0,h:Q.h});
 if(S.hist.length>12)S.hist.shift()}

 for(let s=1;s<=V.Nsec;s++)S.ck['s'+s]=trueDiag(s);

 /* другий — після налагодження */
 S.dose='швидкість';S.v=String(V.vp);S.h=String(V.hOpt);S.Tlead=F(V.Tz,2);

 runCore();
 const rf=ref(),l=S.tr.last;
 S.bd={q:F(r2(rf.q),2),p:F(r1(rf.p),1),vmin:F(rf.vmin,1),vmax:F(rf.vmax,1),Tz:F(V.Tz,2),

 S.doseWhy='норма внесення не залежить від швидкості руху';
 const e=ecRef(S,V);S.ec={E:String(e.E),T:F(e.T,2)};
 S.lab={tip:I.tip,noz:I.noz,p:I.p,v:V.vp,h:V.hOpt,wind:V.wind,dose:'швидкість',

/* ---------- Позначки виконання ---------- */
function done(i){const t=S.tr;
 if(i==0)return S.reg?1:0;
 if(i==1){const f=[S.tip&&S.noz,n(S.bd.q),n(S.bd.p),n(S.v)].filter(Boolean).length;return f>=4?1:f?.5:0}
 if(i==2){const k=Object.keys(S.ck).filter(x=>S.ck[x]&&S.ck[x]!='—').length;
  return k>=V.Nsec&&S.pourDone&&S.calDone?1:(k||S.pourDone||S.calDone?.5:0)}
 if(i==3){const f=[n(S.bd.vmin),n(S.bd.vmax),S.dose&&S.doseWhy].filter(Boolean).length;return f>=3?1:f?.5:0}
 if(i==4){const f=[n(S.bd.Tz),n(S.Tlead)!=null,n(S.h)!=null].filter(Boolean).length;return f>=3?1:f?.5:0}
 if(i==5){if(!t.last)return 0;const f=[n(S.bd.need),n(S.bd.fills),S.ec.E,S.ec.T].filter(x=>x!==''&&x!=null).length;return f>=4?1:.5}
 if(i==6)return [1,2,3,4,5].every(k=>done(k)==1)?1:0;
 return 0}
const tot=()=>score(S,V).reduce((a,b)=>a+b,0);

 return V.id+'-'+Math.round(tot())+'-'+h.slice(0,4)}
/* ===== Рисунки: усе малюється кодом, у масштабі, без зовнішніх бібліотек ===== */
const C=k=>'var(--'+k+')';
const A=o=>Object.keys(o).map(k=>k.replace(/_/g,'-')+'="'+o[k]+'"').join(' ');
const sv=(w,h,b)=>['<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img">'+(b||''),'</svg>'];
const ln=(x1,y1,x2,y2,c,w,o)=>'<line '+A({x1:r2(x1),y1:r2(y1),x2:r2(x2),y2:r2(y2),stroke:c||C('ln'),stroke_width:w||1,...(o||{})})+'/>';
const rc=(x,y,w,h,f,o)=>'<rect '+A({x:r2(x),y:r2(y),width:r2(Math.max(0,w)),height:r2(Math.max(0,h)),fill:f||'none',...(o||{})})+'/>';
const ci=(x,y,r,f,o)=>'<circle '+A({cx:r2(x),cy:r2(y),r:r2(Math.max(0,r)),fill:f||'none',...(o||{})})+'/>';
const el=(x,y,rx,ry,f,o)=>'<ellipse '+A({cx:r2(x),cy:r2(y),rx:r2(rx),ry:r2(ry),fill:f||'none',...(o||{})})+'/>';
const pa=(d,f,o)=>'<path '+A({d,fill:f||'none',...(o||{})})+'/>';
const pg=(p,f,o)=>'<polygon '+A({points:p.map(q=>r2(q[0])+','+r2(q[1])).join(' '),fill:f||'none',...(o||{})})+'/>';
const pl=(p,c,w,o)=>'<polyline '+A({points:p.map(q=>r2(q[0])+','+r2(q[1])).join(' '),fill:'none',stroke:c,stroke_width:w||1,...(o||{})})+'/>';
function T(x,y,s,o){o=o||{};return'<text '+A({x:r2(x),y:r2(y),fill:o.c||C('ink'),font_size:o.s||11,
 text_anchor:o.a||'start',font_weight:o.b?700:400,...(o.rot?{transform:'rotate('+o.rot+' '+r2(x)+' '+r2(y)+')'}:{}),
 ...(o.o?{opacity:o.o}:{})})+'>'+esc(s)+'</text>'}
/* рамка з підписом */
function blk(x,y,w,h,t,o){o=o||{};return rc(x,y,w,h,o.f||C('pn2'),{stroke:o.c||C('ln'),stroke_width:o.sw||1.2,rx:o.rx??5})+
 (t?T(x+w/2,y+h/2+(o.ts||4),t,{a:'middle',s:o.s||11,b:o.b,c:o.tc}):'')}
/* розмірна лінія */
function dimH(x1,x2,y,t,c){c=c||C('sub');const d=x2>x1?1:-1;
 return ln(x1,y,x2,y,c,1)+ln(x1,y-4,x1,y+4,c,1)+ln(x2,y-4,x2,y+4,c,1)+
 pg([[x1,y],[x1+6*d,y-2.6],[x1+6*d,y+2.6]],c)+pg([[x2,y],[x2-6*d,y-2.6],[x2-6*d,y+2.6]],c)+
 (t?T((x1+x2)/2,y-6,t,{a:'middle',s:10,c}):'')}
function dimV(y1,y2,x,t,c){c=c||C('sub');
 return ln(x,y1,x,y2,c,1)+ln(x-4,y1,x+4,y1,c,1)+ln(x-4,y2,x+4,y2,c,1)+
 (t?T(x+4,(y1+y2)/2+3,t,{s:10,c}):'')}
/* легенда */
function lg(items,x,y,s){return items.map((it,i)=>rc(x,y+i*(s||15)-7,9,9,it[1],{rx:2})+T(x+13,y+i*(s||15),it[0],{s:10,c:C('sub')})).join('')}
const dash=(a,b)=>({stroke_dasharray:a+' '+(b||a)});
/* колір за якістю */
/* кольори за якістю: CV поперечного розподілу, знесення, відхилення норми */
const cvc=v=>v<=7?C('ac'):v<=10?C('am'):C('wn');
const drc=v=>v<=3?C('ac'):v<=6?C('am'):C('wn');
const devc=v=>Math.abs(v)<=3?C('ac'):Math.abs(v)<=10?C('am'):C('wn');
/* стрілка потоку вздовж відрізка */
function arrow(x1,y1,x2,y2,c,w){const a=Math.atan2(y2-y1,x2-x1),L=8;
 return pg([[x2,y2],[x2-L*Math.cos(a-.4),y2-L*Math.sin(a-.4)],[x2-L*Math.cos(a+.4),y2-L*Math.sin(a+.4)]],c||C('liq'))}
/* труба з рухомими мітками потоку */
function pipe(pts,c,w,ph,on){let s=pl(pts,c||C('liq'),w||5,{stroke_linejoin:'round',stroke_linecap:'round'});
 if(!on)return s;
 let len=0;const seg=[];
 for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(d);len+=d}
 const step=26;
 for(let t=((ph||0)%1)*step;t<len;t+=step){let d=t,k=0;
  while(k<seg.length&&d>seg[k]){d-=seg[k];k++}
  if(k>=seg.length)break;
  const u=d/seg[k],x=pts[k][0]+(pts[k+1][0]-pts[k][0])*u,y=pts[k][1]+(pts[k+1][1]-pts[k][1])*u;
  s+=ci(x,y,(w||5)/2-1.1,'#fff',{opacity:.72})}
 return s}

/* ---------- Кругова шкала ---------- */
function gauge(val,lo,hi,lab,unit,bands,fx){const w=112,h=84,cx=56,cy=62,R=42,
 a0=-175,a1=-5,f=cl((val-lo)/(hi-lo),0,1),ar=d=>(d*Math.PI)/180,
 P=(d,r)=>[cx+r*Math.cos(ar(d)),cy+r*Math.sin(ar(d))],
 arc=(d1,d2,r,c,w_)=>{const p1=P(d1,r),p2=P(d2,r);return pa('M'+r2(p1[0])+' '+r2(p1[1])+'A'+r+' '+r+' 0 0 1 '+r2(p2[0])+' '+r2(p2[1]),'none',{stroke:c,stroke_width:w_,stroke_linecap:'round'})};
let s=arc(a0,a1,R,C('ln'),8);
for(const b of bands||[]){const d1=a0+(a1-a0)*cl((b[0]-lo)/(hi-lo),0,1),d2=a0+(a1-a0)*cl((b[1]-lo)/(hi-lo),0,1);if(d2>d1+.4)s+=arc(d1,d2,R,b[2],8)}
const d=a0+(a1-a0)*f,p=P(d,R-13),o=P(d,8);
s+=ln(o[0],o[1],p[0],p[1],C('ink'),2.4,{stroke_linecap:'round'})+ci(cx,cy,3.4,C('ink'));
s+=T(cx,cy-16,F(r1(val),null)+(unit?' '+unit:''),{a:'middle',s:15,b:1});
s+=T(cx,cy+17,lab,{a:'middle',s:9.5,c:C('sub')});
return sv(w,h)[0]+s+sv(w,h)[1]}

/* ---------- Графік із наведенням ---------- */
/* ser: [{name,color,pts:[[x,y],…],dash}] */
function chart(id,ser,o){o=o||{};const w=o.w||640,h=o.h||200,L=o.L||46,Rr=14,Tp=o.T||14,B=30,
 xs=[].concat(...ser.map(s=>s.pts.map(p=>p[0]))),ys=[].concat(...ser.map(s=>s.pts.map(p=>p[1])));
 if(!xs.length)return'';
 const x0=o.x0??Math.min(...xs),x1=o.x1??Math.max(...xs),
 y0=o.y0??0,y1=o.y1??Math.max(1,Math.max(...ys)*1.12),
 X=v=>L+(w-L-Rr)*(v-x0)/((x1-x0)||1),Y=v=>Tp+(h-Tp-B)*(1-(v-y0)/((y1-y0)||1));
let s=rc(L,Tp,w-L-Rr,h-Tp-B,C('pn'),{stroke:C('ln')});
const nyt=o.ny||4;for(let i=0;i<=nyt;i++){const v=y0+(y1-y0)*i/nyt,y=Y(v);
 s+=ln(L,y,w-Rr,y,C('ln'),i?.6:1,i?dash(3,4):{})+T(L-5,y+3.5,o.yf?o.yf(v):F(r1(v)),{a:'end',s:9.5,c:C('sub')})}
const nxt=o.nx||5;for(let i=0;i<=nxt;i++){const v=x0+(x1-x0)*i/nxt,x=X(v);
 s+=ln(x,Tp,x,h-B,C('ln'),.6,dash(3,4))+T(x,h-B+13,o.xf?o.xf(v):F(r1(v)),{a:'middle',s:9.5,c:C('sub')})}
for(const b of o.bands||[])s+=rc(L,Y(b[1]),w-L-Rr,Y(b[0])-Y(b[1]),b[2],{opacity:.16});
(o.vl||[]).forEach((g,i)=>{s+=ln(X(g[0]),Tp,X(g[0]),h-B,g[1]||C('am'),1.4,dash(5,4))+T(X(g[0])+3,Tp+11+i*13,g[2]||'',{s:9.5,c:g[1]||C('am')})});
for(const se of ser){if(se.pts.length<2)continue;
 s+=pl(se.pts.map(p=>[X(p[0]),Y(p[1])]),se.color,se.w||2,se.dash?dash(5,4):{})}
for(const se of ser)if(se.dots)for(const p of se.pts)s+=ci(X(p[0]),Y(p[1]),2.6,se.color);
if(o.xl)s+=T(w-Rr,h-4,o.xl,{a:'end',s:10,c:C('sub')});
if(o.yl)s+=T(4,Tp-4,o.yl,{s:10,c:C('sub')});
if(ser.length>1&&!o.nolg){const ls=ser.filter(x=>x.name),
 y0l=o.lgb?h-B-8-(ls.length-1)*13:Tp+12+(o.vl||[]).length*13;
 s+=ls.map((se,i)=>{const x=L+8,y=y0l+i*13;return ln(x,y-3.5,x+16,y-3.5,se.color,2.4,se.dash?dash(5,4):{})+T(x+21,y,se.name,{s:10,c:C('sub')})}).join('')}
const inner=s,hit={L,Rr,Tp,B,w,h,x0,x1,y0,y1};
return'<div class="ch" id="'+id+'" data-g="'+esc(JSON.stringify(hit))+'">'+sv(w,h)[0]+inner+
 '<g id="'+id+'_c" style="display:none"><line y1="'+Tp+'" y2="'+(h-B)+'" stroke="'+C('ink')+'" stroke-width="1"/></g>'+
 sv(w,h)[1]+'<div class="tip" id="'+id+'_t"></div></div>'}
/* наведення на графік */
function chBind(id,fn){const d=document.getElementById(id);if(!d)return;const g=JSON.parse(d.dataset.g),
 tip=document.getElementById(id+'_t'),cur=document.getElementById(id+'_c'),svg=d.querySelector('svg');
 const mv=e=>{const b=svg.getBoundingClientRect(),px=(e.touches?e.touches[0].clientX:e.clientX)-b.left,
  ux=px/b.width*g.w;if(ux<g.L-2||ux>g.w-g.Rr+2){out();return}
  const v=g.x0+(g.x1-g.x0)*(ux-g.L)/(g.w-g.L-g.Rr),t=fn(v);if(!t){out();return}
  cur.style.display='';cur.firstChild.setAttribute('x1',r2(ux));cur.firstChild.setAttribute('x2',r2(ux));
  tip.style.display='block';tip.innerHTML=t;
  const tw=tip.offsetWidth||120;tip.style.left=Math.max(2,Math.min(b.width-tw-2,px-tw/2))+'px'};
 const out=()=>{cur.style.display='none';tip.style.display='none'};
 d.onmousemove=mv;d.onmouseleave=out;d.ontouchstart=mv;d.ontouchmove=e=>{mv(e);e.preventDefault()};d.ontouchend=out}

/* ================= Гідравлічна схема пульта керування =================
   Бак → насос → клапан максимального тиску → пропорційний клапан → фільтр →
   блок секційних клапанів → штанга. Злив надлишку повертається в бак.
   ph — фаза анімації потоку. */
function hydSVG(V,Q,h,st){st=st||{};const w=900,hh=430,ph=st.ph||0,on=st.on!==0,
 L=C('liq'),LD=C('sub'),BG=C('pn2');
let s='';
/* --- бак --- */
const tx=24,ty=250,tw=132,th=120;
s+=rc(tx,ty,tw,th,C('tank'),{stroke:C('boom'),stroke_width:1.6,rx:8,opacity:.55});
{const lv=cl(st.level??.62,.08,.95);
 s+=rc(tx+3,ty+th-3-(th-6)*lv,tw-6,(th-6)*lv,L,{opacity:.45,rx:5});
 s+=T(tx+tw/2,ty+th/2+4,F(Math.round(V.tank*lv))+' л',{a:'middle',s:13,b:1})}
s+=T(tx+tw/2,ty+th+16,'Бак  '+TH(V.tank)+' л',{a:'middle',s:11,b:1,c:C('sub')});
/* --- насос --- */
const px=206,py=300;
s+=ci(px,py,28,BG,{stroke:C('boom'),stroke_width:1.8});
for(let i=0;i<6;i++){const a=i*60+ph*220;
 s+=ln(px,py,px+22*Math.cos(a*Math.PI/180),py+22*Math.sin(a*Math.PI/180),C('boom'),2.2)}
s+=ci(px,py,5,C('boom'));
s+=T(px,py+44,'Насос',{a:'middle',s:11,b:1,c:C('sub')})+T(px,py+56,TH(V.pump)+' л/хв',{a:'middle',s:9.5,c:C('sub')});
s+=pipe([[tx+tw,py],[px-28,py]],L,7,ph,on);
/* --- клапан максимального тиску --- */
const mx=306,my=176;
s+=pipe([[px,py-28],[px,my+26]],L,7,ph,on);
s+=valve(px-26,my-26,52,52,'КМТ',st.relief,C('hot'));
s+=T(px,my-50,'Клапан максимального',{a:'middle',s:10,c:C('sub')})+T(px,my-39,'тиску',{a:'middle',s:10,c:C('sub')});
/* злив від КМТ у бак */
s+=pipe([[px-26,my],[px-62,my],[px-62,ty-16],[tx+tw-26,ty-16],[tx+tw-26,ty]],LD,4.5,ph*.7,on&&st.relief,1);
s+=T(px-66,my+14,'злив у бак',{a:'end',s:9.5,c:LD});
/* --- пропорційний клапан --- */
s+=pipe([[px+26,my],[mx+12,my]],L,7,ph,on);
const prx=mx+48;
s+=valve(prx-24,my-26,52,52,'ПК',st.prop,C('ac'));
s+=T(prx+2,my-50,'Пропорційний',{a:'middle',s:10,c:C('sub')})+T(prx+2,my-39,'клапан',{a:'middle',s:10,c:C('sub')});
s+=pipe([[prx-24,my+26],[prx-24,ty-30],[tx+tw-62,ty-30],[tx+tw-62,ty]],LD,4.5,ph*.7,on&&st.prop,1);
/* --- фільтр --- */
const fx=prx+86;
s+=pipe([[prx+28,my],[fx-18,my]],L,7,ph,on);
s+=rc(fx-18,my-24,36,48,BG,{stroke:C('boom'),stroke_width:1.5,rx:4});
for(let i=0;i<5;i++)s+=ln(fx-13,my-18+i*10,fx+13,my-14+i*10,C('boom'),1.1);
s+=T(fx,my-39,'Фільтр',{a:'middle',s:10,c:C('sub')});
/* --- манометр --- */
const gx=fx+74;
s+=pipe([[fx+18,my],[gx+120,my]],L,7,ph,on);
s+=ln(gx,my,gx,my-40,L,4);
{const pm=cl((h.p||0)/10,0,1),a0=-210,a1=30,a=a0+(a1-a0)*pm;
 s+=ci(gx,my-62,26,'#fff',{stroke:C('boom'),stroke_width:1.8});
 for(let i=0;i<=10;i+=2){const t_=a0+(a1-a0)*i/10;
  s+=ln(gx+20*Math.cos(t_*Math.PI/180),my-62+20*Math.sin(t_*Math.PI/180),
        gx+24*Math.cos(t_*Math.PI/180),my-62+24*Math.sin(t_*Math.PI/180),'#555',1)}
 s+=ln(gx,my-62,gx+19*Math.cos(a*Math.PI/180),my-62+19*Math.sin(a*Math.PI/180),C('hot'),2.2,{stroke_linecap:'round'});
 s+=ci(gx,my-62,3,'#333');
 s+=T(gx,my-96,F(h.p,1)+' бар',{a:'middle',s:12,b:1,c:C('ink')});
 s+=T(gx,my-28,'манометр',{a:'middle',s:9.5,c:C('sub')})}
/* --- блок секційних клапанів і штанга --- */
const N=V.Nsec,bx0=gx+150,bw=Math.min(96,(w-bx0-24)/N),by=my;
s+=T(bx0+N*bw/2,my-96,'Блок секційних клапанів і штанга',{a:'middle',s:11,b:1,c:C('sub')});
const openArr=Q.open||new Array(N).fill(1);
for(let i=0;i<N;i++){const x=bx0+i*bw+bw/2,op=openArr[i];
 s+=pipe([[Math.max(bx0-24,gx+120),by],[x,by]],L,5,ph,on);
 s+=valve(x-17,by-17,34,34,String(i+1),op,op?C('ac'):C('sub'),9.5);
 /* компенсаційний злив у бак */
 if(!op&&Q.comp)s+=pipe([[x,by+17],[x,by+34],[bx0-40,by+34],[bx0-40,ty-46],[tx+tw-98,ty-46],[tx+tw-98,ty]],LD,3.5,ph*.6,on,1);
 /* до штанги */
 if(op){s+=pipe([[x,by+17],[x,by+66]],L,4,ph,on);
  /* секція штанги з розпилювачами */
  const ny=by+70,nn=Math.min(5,V.nSec);
  s+=ln(x-bw/2+6,ny,x+bw/2-6,ny,C('boom'),4,{stroke_linecap:'round'});
  for(let k=0;k<nn;k++){const nx=x-bw/2+10+(bw-20)*(k+.5)/nn;
   s+=ci(nx,ny+4,2.6,st.tipHex||C('drop'));
   if(on)s+=pg([[nx,ny+6],[nx-7,ny+40],[nx+7,ny+40]],C('spray'),{opacity:.42})}}
 else s+=T(x,by+56,'закрита',{a:'middle',s:9,c:C('sub')})}
if(Q.comp&&openArr.some(x=>!x))s+=T(bx0-46,by+48,'злив через компенсаційні клапани',{a:'end',s:9.5,c:LD});
/* --- стрілки напрямку потоку: білим поверх труби --- */
const AW='#fff';
s+=arrow(tx+tw+28,py,tx+tw+46,py,AW);
s+=arrow(px,my+74,px,my+56,AW);
s+=arrow(px+42,my,px+60,my,AW);
s+=arrow(prx+42,my,prx+60,my,AW);
s+=arrow(gx+42,my,gx+60,my,AW);
/* --- підписи стану --- */
s+=T(24,24,'Витрата штанги '+F(h.Qtot,1)+' л/хв з '+TH(V.pump)+' л/хв подачі насоса',{s:11,b:1,c:h.pumpOver?C('wn'):C('sub')});
s+=T(24,42,'Норма внесення '+F(h.Qact,1)+' л/га',{s:11,c:C('sub')});
s+=T(w-24,24,'Відкрито секцій: '+h.nOpen+' з '+N,{a:'end',s:11,c:C('sub')});
return'<div class="fig"><div class="sx">'+sv(w,hh)[0]+s+sv(w,hh)[1]+'</div>'+
 '<div class="tlg"><i style="background:'+L+'"></i>нагнітальна магістраль (під тиском)'+
 '<i style="background:'+LD+'"></i>злив надлишку в бак'+
 '<i style="background:'+C('spray')+'"></i>факел розпилу</div>'+
 (st.cap?'<div class="cap">'+st.cap+'</div>':'')+'</div>'}
/* клапан: квадрат зі стрілкою, зелений відкритий / сірий закритий */
function valve(x,y,w,h,t,open,c,fs){
 return rc(x,y,w,h,open?'color-mix(in srgb,'+(c||C('ac'))+' 22%, '+C('pn2')+')':C('pn2'),
   {stroke:open?(c||C('ac')):C('ln'),stroke_width:1.8,rx:5})+
  (open?ln(x+6,y+h/2,x+w-6,y+h/2,c||C('ac'),2):ln(x+7,y+7,x+w-7,y+h-7,C('sub'),2)+ln(x+w-7,y+7,x+7,y+h-7,C('sub'),2))+
  T(x+w/2,y+h-5,t,{a:'middle',s:fs||10.5,b:1,c:open?(c||C('ac')):C('sub')})}

/* ================= Штанга в поперечному розрізі ================= */
function boomSVG(V,Q,cv,o){o=o||{};const w=760,
 a=V.aNoz,hb=Q.h??V.hOpt,ang=V.ang,nN=6,x0=104,
 /* масштаб однаковий по висоті й поперек; підбираємо так, щоб фігура лишалась компактною */
 PX=cl(Math.min((w-x0-66)/(a*(nN+0.4)),150/Math.max(.45,hb)),60,210),
 y0=48,gy=y0+hb*PX,cy0=gy+18,chh=58,hh=cy0+chh+26;
let s=rc(0,0,w,hh,C('pn2'));
/* ґрунт */
s+=rc(0,gy,w,cy0-gy,C('soil'),{opacity:.5})+ln(0,gy,w,gy,C('soil2'),1.6);
/* штанга */
s+=rc(x0-26,y0-9,nN*a*PX+16,14,C('boom'),{rx:4});
/* розпилювачі й факели */
const half=Math.tan(ang/2*Math.PI/180),spread=hb*half*PX;
/* віртуальні розпилювачі за межами видимої ділянки, щоб крива показувала
   усталену картину, а не край штанги */
const cov=[];
for(let i=-4;i<nN+4;i++){const nx=x0+i*a*PX;
 cov.push([nx-spread,nx+spread]);
 if(i<0||i>=nN)continue;
 s+=pg([[nx-4,y0+5],[nx+4,y0+5],[nx+2,y0+12],[nx-2,y0+12]],C('boom'));
 s+=pg([[nx,y0+12],[nx-spread,gy],[nx+spread,gy]],C('spray'),{opacity:.28,stroke:C('spray'),stroke_width:.8})}
/* висота */
s+=dimV(y0+12,gy,x0-62,'')+T(x0-56,(y0+gy)/2-4,'h = '+F(hb,2)+' м',{s:11,b:1});
s+=dimH(x0,x0+a*PX,y0-22,'a = '+F(a,1)+' м',C('ink'));
/* крива поперечного розподілу: сума трикутних профілів */
/* профіль одного факела — трикутний, спадає до нуля на краю смуги */
const prof=[];for(let x=0;x<w;x+=2){let v=0;
 for(const c of cov){const m=(c[0]+c[1])/2,r=(c[1]-c[0])/2;
  v+=Math.max(0,1-Math.abs(x-m)/r)}
 prof.push([x,v])}
const mp=Math.max(...prof.map(p=>p[1]))||1;
s+=rc(0,cy0,w,chh,C('pn'),{opacity:.72});
s+=pl(prof.map(p=>[p[0],cy0+chh-chh*0.86*p[1]/mp]),cvc(cv),2.2);
/* середня лінія в робочій зоні */
{const inZ=prof.filter(p=>p[0]>=x0&&p[0]<=x0+(nN-1)*a*PX),av=inZ.reduce((s_,p)=>s_+p[1],0)/Math.max(1,inZ.length);
 s+=ln(x0,cy0+chh-chh*0.86*av/mp,x0+(nN-1)*a*PX,cy0+chh-chh*0.86*av/mp,C('sub'),1.2,dash(5,4))}
s+=T(6,cy0-6,'Поперечний розподіл під штангою',{s:10,c:C('sub')});
s+=T(w-8,cy0-6,'CV = '+F(cv,1)+' %  ·  '+(cv<=7?'у нормі, не більше 7 %':cv<=10?'на межі допуску':'поза допуском'),
 {a:'end',s:11,b:1,c:cvc(cv)});
s+=T(6,hh-8,'масштаб '+F(r1(PX))+' px на 1 м, однаковий по висоті й поперек; розпилювачі '+F(ang)+'°, крок '+F(a,1)+' м',{s:9.5,c:C('sub')});
return'<div class="fig"><div class="sx">'+sv(w,hh)[0]+s+sv(w,hh)[1]+'</div>'+
 (o.cap?'<div class="cap">'+o.cap+'</div>':'')+'</div>'}

/* ================= Крапля і знесення ================= */
function driftSVG(V,Q,d,dr,buf,o){o=o||{};const w=760,hh=300;
let s=rc(0,0,w,hh,C('pn2'));
/* шкала категорій крапель */
const sx=24,sw=w-48,sy=40,dmaxS=700;
s+=T(sx,24,'Категорія краплі за медіанним діаметром (ASABE S572.1)',{s:11,b:1,c:C('sub')});
for(const c of DCAT){const a=Math.min(c[0],dmaxS)/dmaxS*sw,b=Math.min(c[1],dmaxS)/dmaxS*sw;
 if(b<=a)continue;
 s+=rc(sx+a,sy,b-a,22,c[4],{opacity:.3,stroke:c[4],stroke_width:1})+
    T(sx+(a+b)/2,sy+15,c[3],{a:'middle',s:10,b:1,c:c[4]})}
/* потрібний діапазон */
{const a=V.dmin/dmaxS*sw,b=Math.min(V.dmax,dmaxS)/dmaxS*sw;
 s+=rc(sx+a,sy-7,b-a,36,'none',{stroke:C('ac'),stroke_width:2,rx:3,...dash(5,3)})+
    T(sx+(a+b)/2,sy+40,'потрібно для цієї обробки: '+F(V.dmin)+'…'+F(V.dmax)+' мкм',{a:'middle',s:10,c:C('ac')})}
/* поточна крапля */
{const x=sx+Math.min(d,dmaxS)/dmaxS*sw,ok=d>=V.dmin&&d<=V.dmax;
 s+=ln(x,sy-14,x,sy+26,ok?C('ink'):C('wn'),2)+
    T(x,sy-18,F(d)+' мкм',{a:'middle',s:11,b:1,c:ok?C('ink'):C('wn')})}
for(const g of [0,200,400,600])s+=T(sx+g/dmaxS*sw,sy+70,F(g),{a:'middle',s:9.5,c:C('sub')});
s+=T(sx+sw,sy+70,'мкм',{a:'end',s:9.5,c:C('sub')});
/* знесення: факел, вітер, буферна зона */
const gy=hh-54,bx=70;
s+=rc(0,gy,w,hh-gy,C('soil'),{opacity:.5})+ln(0,gy,w,gy,C('soil2'),1.4);
/* крайній розпилювач штанги */
s+=rc(bx-56,gy-74,66,9,C('boom'),{rx:3});
s+=pg([[bx-26,gy-65],[bx-18,gy-65],[bx-20,gy-56],[bx-24,gy-56]],C('boom'));
s+=pg([[bx-22,gy-56],[bx-44,gy],[bx,gy]],C('spray'),{opacity:.45,stroke:C('spray'),stroke_width:.8});
/* шлейф знесення — довжина пропорційна буферній зоні */
/* масштаб підбираємо так, щоб шлейф було видно навіть за малої буферної зони */
const PXm=cl((w-bx-170)/Math.max(2.5,buf),6,120),bl=buf*PXm;
for(let i=0;i<26;i++){const t=i/25,x=bx+bl*t*1.05,y=gy-10-34*Math.sin(Math.PI*t*.5)-4;
 s+=ci(x,y,cl(3.4-2.6*t,.7,3.4),C('drop'),{opacity:cl(.62-.5*t,.06,.62)})}
s+=rc(bx,gy,bl,hh-gy,C('wn'),{opacity:.16});
s+=dimH(bx,bx+bl,gy+26,'буферна зона '+F(buf)+' м',C('wn'));
/* вітер */
{const wy=gy-96;s+=T(bx-34,wy-6,'вітер '+F(Q.wind??V.wind,1)+' м/с',{s:11,b:1,c:C('sub')});
 for(let i=0;i<3;i++){const y=wy+10+i*12;s+=ln(bx-34,y,bx+54,y,C('sub'),1.2)+arrow(bx+40,y,bx+56,y,C('sub'))}}
s+=T(w-24,gy-58,'знесення '+F(dr,1)+' % норми',{a:'end',s:13,b:1,c:drc(dr)});
s+=T(w-24,gy-40,dr<=3?'прийнятно':dr<=6?'підвищене':'високе — обробку краще відкласти',{a:'end',s:10,c:drc(dr)});
s+=T(w-24,gy-22,'масштаб '+F(r1(PXm),1)+' px на 1 м',{a:'end',s:9,c:C('sub')});
return'<div class="fig"><div class="sx">'+sv(w,hh)[0]+s+sv(w,hh)[1]+'</div>'+
 (o.cap?'<div class="cap">'+o.cap+'</div>':'')+'</div>'}

/* ================= Пролив секцій (стовпчикова діаграма, як рис. 3.1 методички) ================= */
function secPourSVG(V,rows,qSecNom,curSec){const nS=rows.length,w=680,hh=210,bw=Math.min(68,(w-120)/nS),
 gap=(w-100-nS*bw)/Math.max(1,nS),base=156,top=34,mx=Math.max(qSecNom*1.32,Math.max(...rows.map(r=>r.Qs))*1.12),
 Y=v=>base-(base-top)*cl(v/mx,0,1);
let s=rc(0,0,w,hh,C('pn2'));
s+=ln(56,base,w-14,base,C('ln'),1.2);
for(let i=0;i<=4;i++){const v=mx*i/4;s+=ln(56,Y(v),w-14,Y(v),C('ln'),.6,dash(3,4))+T(52,Y(v)+3.5,F(r1(v),1),{a:'end',s:9,c:C('sub')})}
s+=rc(56,Y(qSecNom*1.1),w-70,Y(qSecNom*0.9)-Y(qSecNom*1.1),C('ac'),{opacity:.16});
s+=ln(56,Y(qSecNom),w-14,Y(qSecNom),C('ac'),1.6,dash(6,4))+T(58,top-12,'розрахункова витрата секції '+F(qSecNom,1)+' л/хв',{s:9.5,c:C('ac'),b:1});
rows.forEach((r,i)=>{const px=68+i*(bw+gap),dev=100*(r.Qs-qSecNom)/qSecNom,
 c=Math.abs(dev)<=10?C('ac'):C('wn'),sel=r.s==curSec;
 s+='<g style="cursor:pointer" onclick="setN(\'pourSec\','+r.s+')">'+
  rc(px,Y(r.Qs),bw,base-Y(r.Qs),c,{rx:3,stroke:sel?C('ink'):'none',stroke_width:sel?2:0})+
  T(px+bw/2,Y(r.Qs)-5,F(r.Qs,1),{a:'middle',s:9.5,b:sel?1:0,c:C('ink')})+
  T(px+bw/2,base+15,'секція '+r.s,{a:'middle',s:9.5,b:sel?1:0,c:C('sub')})+
  T(px+bw/2,base+29,(dev>0?'+':'')+F(dev,1)+' %',{a:'middle',s:9,b:Math.abs(dev)>10?1:0,c:Math.abs(dev)>10?C('wn'):C('sub')})+
  '</g>'});
s+=T(10,top-12,'витрата секції, л/хв',{s:9.5,c:C('sub')});
s+=T(w-14,hh-6,'зелена смуга — допуск ±10 % · натисніть на секцію для порозпилювачного проливу',{a:'end',s:9.5,c:C('sub')});
return'<div class="fig"><div class="sx">'+sv(w,hh)[0]+s+sv(w,hh)[1]+'</div></div>'}

/* ================= Пролив розпилювачів секції ================= */
function pourSVG(V,list,qn,o){o=o||{};const nN=list.length,
 w=Math.max(420,70+nN*Math.min(58,620/nN)),hh=230,bw=Math.min(44,(w-90)/nN),gap=(w-80-nN*bw)/Math.max(1,nN-1),
 base=168,top=36,mx=Math.max(qn*1.35,Math.max(...list.map(x=>x.q))*1.12);
let s=rc(0,0,w,hh,C('pn2'));
const Y=v=>base-(base-top)*cl(v/mx,0,1);
s+=ln(56,base,w-14,base,C('ln'),1.2);
for(let i=0;i<=4;i++){const v=mx*i/4;s+=ln(56,Y(v),w-14,Y(v),C('ln'),.6,dash(3,4))+T(52,Y(v)+3.5,F(r2(v),2),{a:'end',s:9,c:C('sub')})}
/* номінал і допуск ±10 % */

  tr('Термін окупності T',T!=null?'T = '+TH(g('Csys'))+' / '+TH(Enet)+' = <b>'+F(T,2)+' року</b>':'<b>не окупається (E_чист ≤ 0)</b>')+
  '</table></div>'}
s+='<p class="hint">Усі формули ті самі, що в методичці. Калькулятор нічого не підказує — він лише рахує за вашими числами.</p>';
s+=nb([7,'Досліди'],null);
return s}
function calcFillVar(){if(!V)return;const e=ecRef(S,V);
 S.calc={...S.calc,Q:String(V.Qp),v:F(V.vp,1),a:F(V.aNoz,1),B:String(V.B),
  Tg:F(V.Tg,2),Tv:F(V.Tv,2),Tl:F(V.Tl,2),Tlead:F(V.Tz,2),N:String(V.Nsec),n:String(V.Nsec-1),
  p:F(n(S.p)||V.ideal.p,1),qn:F(tipOf(tipNow()).q,2),
  S:String(V.S),tank:String(V.tank),Sy:String(V.Sy),Cprep:String(V.Cprep),Csys:String(V.Csys),
  p1:F(e?e.Lp1:V.sigV,1),p2:F(e?e.Lp2:1.5,1),w1:F(V.wedge,1),w2:F(V.pres,1),
  dr1:F(e?e.dr1:1.3,1),dr2:F(e?e.dr2:1.0,1)};save();R()}
function calcHalfSy(){if(!V)return;if(!n(S.calc.Sy))calcFillVar();
 S.calc.Sy=String(Math.round((n(S.calc.Sy)||V.Sy)/2));save();R()}

/* ===== Навігація, бічна панель, рендер ===== */
function go(i){S.step=i;save();scrollTo(0,0);R()}
function nav(){let s='';
for(let i=0;i<=NST;i++){const d=done(i),on=S.step==i?' on':'';
 s+='<button class="'+on.trim()+'" onclick="go('+i+')"'+(i>0&&!S.reg?' disabled':'')+'>'+
  '<i class="'+(d==1?'ok':d?'pt':'')+'"></i>'+esc(TT[i])+'</button>'}
s+='<button class="lab'+(S.step==LAB?' on':'')+'" onclick="go('+LAB+')"'+(!S.reg?' disabled':'')+'><i></i>'+esc(TT[LAB])+'</button>';
s+='<button class="lab'+(S.step==CALC?' on':'')+'" onclick="go('+CALC+')"><i></i>'+esc(TT[CALC])+'</button>';
return s}
function dashP(){if(!V)return'<div class="t">ТЕРМІНАЛ ОБПРИСКУВАЧА</div><div class="d"><span>варіант не отримано</span></div>';
const Q=QS({}),h=hyd(V,Q),l=S.tr.last,
 d=(a,b,al)=>'<div class="d'+(al?' al':'')+'"><span>'+a+'</span><span>'+b+'</span></div>';
let s='<div class="t">ТЕРМІНАЛ · '+esc(V.id)+'</div>';
s+=d('норма план, л/га',TH(V.Qp));
s+=d('норма факт, л/га',F(h.Qact,1),Math.abs(h.Qact-V.Qp)/V.Qp>.05);
s+=d('тиск, бар',F(h.p,2),h.over||h.under);
s+=d('розпилювач','ISO '+tipNow()+' '+nozNow());
s+=d('витрата, л/хв',F(h.q,2));
s+=d('штанга, л/хв',F(h.Qtot,1),h.pumpOver);
s+=d('швидкість, км/год',F(vNow(),1));
s+=d('дозування',esc(S.dose));
s+=d('секцій відкрито',h.nOpen+'/'+V.Nsec,h.nOpen<V.Nsec);
s+=d('висота штанги, м',F(hNow(),2),Math.abs(hNow()-V.hOpt)>.07);
s+=d('крапля, мкм',F(h.d),h.d<V.dmin||h.d>V.dmax);
if(l){s+='<div class="t" style="margin-top:8px">ПРОХІД №'+S.tr.n+'</div>';
 s+=d('відхилення норми, %',F(l.dev,1),Math.abs(l.dev)>3);
 s+=d('CV, %',F(l.cv,1),l.cv>7);
 s+=d('знесення, %',F(l.drift,1),l.drift>3);
 s+=d('ΔL, м',F(l.dL,2),Math.abs(l.dL)>.2);
 s+=d('заправок',String(l.fills))}
return s}
function bann(){if(!S.demo)return'';
return'<div class="bn"><span><b>Відкрито приклад із методички.</b> Усі поля заповнені правильними значеннями — на ньому видно, як має виглядати виконана робота. Для свого звіту отримайте власний варіант.</span>'+
 '<button class="p" style="margin:0" onclick="go(0)">Отримати свій варіант</button></div>'}
function R(){const m=document.getElementById('mn'),ae=document.activeElement,
 aid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
 document.getElementById('nv').innerHTML=nav();
 document.getElementById('bn').innerHTML=bann();
 document.getElementById('ds').innerHTML=dashP();
 document.getElementById('chip').textContent=V?('варіант '+V.id+' · '+F(r1(tot()),1)+' / 100'):'варіант не отримано';
 if(!S.reg||!V)S.step=0;
 m.innerHTML=[scr0,scr1,scr2,scr3,scr4,scr5,scr6,scr7,scr8][S.step]();
 for(const id of ['cqp','cqv','csec','l1','l2'])chBind(id,chTip(id));
 if(aid){const ne=document.getElementById(aid);if(ne&&(ne.tagName=='INPUT'||ne.tagName=='SELECT')){ne.focus({preventScroll:true});try{if(ss!=null)ne.setSelectionRange(ss,se)}catch(e){}}}
 if(ANI.run){ANI.last=performance.now();requestAnimationFrame(aniTick)}}
function chTip(id){const L=S.lab;
 if(id=='cqp')return x=>{const t=tipOf(tipNow());return'тиск '+F(r2(x),2)+' бар<br>витрата '+F(qOf(t.q,x),2)+' л/хв'};
 if(id=='cqv')return x=>{const o=DOSE.map(d=>esc(DOSEL[d].split(' (')[0])+': '+F(hyd(V,QS({v:r1(x),dose:d})).Qact,1)+' л/га');
  return F(r1(x),1)+' км/год<br>'+o.join('<br>')};
 if(id=='csec')return x=>{const k=cl(Math.round(x),1,V.Nsec),o=new Array(V.Nsec).fill(0).map((_,i)=>i<k?1:0),
   a=hyd(V,{...QS({}),open:o,comp:0,dose:'тиск',p:n(S.p)||V.ideal.p}),b=hyd(V,{...QS({}),open:o,comp:1,dose:'тиск',p:n(S.p)||V.ideal.p});
  return'відкрито '+k+' з '+V.Nsec+'<br>без компенсації '+F(a.p,2)+' бар<br>з компенсацією '+F(b.p,2)+' бар'};
 if(id=='l1')return x=>{const Q=Qs({tip:L.tip,noz:L.noz,p:String(x),v:String(L.v),dose:'тиск',h:String(L.h),wind:String(L.wind)},V),
   hh=hyd(V,Q);return'тиск '+F(r2(x),2)+' бар<br>крапля '+F(hh.d)+' мкм ('+hh.cat[2]+')<br>знесення '+F(drift(V,Q,hh.d),1)+' %'};
 if(id=='l2')return x=>{const Q=Qs({tip:L.tip,noz:L.noz,p:String(L.p),v:String(L.v),h:String(x),wind:String(L.wind)},V);
  return'висота '+F(r2(x),2)+' м<br>CV '+F(boomCV(V,{...Q,h:x},[]),1)+' %'};
 return()=>null}
/* ===== Запуск ===== */
theme(0);
if(!S){demoState();save()}            /* перше відкриття: приклад із методички */
let RW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-RW)>8){RW=innerWidth;clearTimeout(R.t);R.t=setTimeout(R,180)}});
R();
</script></body></html>
