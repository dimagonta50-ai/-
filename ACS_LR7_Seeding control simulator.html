</style></head><body><div class="w">
<header class="top"><h1>Симулятор системи контролю та керування висівом<small>Просапна сівалка точного висіву: монітор висіву, норма, секційне вимикання. Лабораторна робота №7</small></h1>
<div class="tools"><span class="chip" id="chip"></span><button class="g sm" id="thb" onclick="theme()" title="Перемкнути тему">Тема: авто</button></div></header>
<div id="bn"></div>
<div class="lay"><nav id="nv" aria-label="Кроки роботи"></nav><main id="mn"></main><aside id="ds" aria-label="Монітор висіву в кабіні"></aside></div></div>

<script>
/* Симулятор до лабораторної роботи №7.
   Системи автоматичного контролю та керування висівом просапної сівалки точного висіву.
   Один файл, без зовнішніх бібліотек і шрифтів; працює без мережі. */
const KEY='lr7v1',TKEY='lr7theme';
/* ===== Модель системи контролю та керування висівом (ЛР №7) ===== */
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),f1=x=>Math.round(x*10)/10,f2=x=>Math.round(x*100)/100,
      n=x=>{const v=parseFloat(String(x).replace(',','.'));return isNaN(v)?null:v};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* нормальний розподіл (сума трьох рівномірних, одинична дисперсія) */
const gs=r=>(r()+r()+r()-1.5)*2;

/* Сівалки: rows — рядків; drive — тип привода; vk — межа швидкості за паспортом; del — подача насіння */
const PL=[
 {p:'Monosem ValoTerra Ultimate',rows:8,drive:'електропривід',vk:16,del:'стрічка',h:48,Tk:0.30,price:150},
 {p:'Väderstad Tempo V 8',rows:8,drive:'електропривід',vk:18,del:'надув',h:45,Tk:0.25,price:155},
 {p:'Horsch Maestro 8 SX',rows:8,drive:'класичний',vk:10,del:'трубка',h:52,Tk:0.35,price:120},
 {p:'Kuhn Maxima 3 TS 8',rows:8,drive:'класичний',vk:9,del:'трубка',h:55,Tk:0.40,price:110},
 {p:'Väderstad Tempo L 12',rows:12,drive:'електропривід',vk:18,del:'надув',h:45,Tk:0.25,price:190},
 {p:'Monosem NG Plus 4, 12 р.',rows:12,drive:'класичний',vk:9,del:'трубка',h:55,Tk:0.40,price:140}];
const TRK=['John Deere 6155M','Fendt 724 Vario','New Holland T7.215','Case IH Puma 185','Deutz-Fahr 6185'];
/* Культури: m — маса 1000 нас., г; ds — розмір насінини, мм; N — межі норми, тис/га; Y — урожайність, т/га */
const CROP=[{c:'кукурудза',m:[290,370],ds:[4.6,5.4],N:[65,90],a:[70,75],Y:[8.5,11.5],C:[6800,8600],Cs:[3800,5200]},
            {c:'соняшник',m:[55,80],ds:[3.4,4.4],N:[55,75],a:[70,70],Y:[2.6,3.6],C:[17000,23000],Cs:[2600,3600]}];
/* Диски: hole — діаметр комірки, мм. Комірка МЕНША за насінину: насінина сідає на отвір,
   а не провалюється в нього. Робоче співвідношення d_к/d_нас ≈ 0,46…0,62 */
const DISC=[{z:24,hole:1.8},{z:26,hole:2.0},{z:26,hole:2.3},{z:30,hole:2.6},{z:30,hole:2.9},{z:30,hole:3.2}];

/* Потрібний вакуум, мбар: сила утримання ∝ маса насінини / площа комірки.
   Калібровано на даних DLG: кукурудза m1000≈330 г, комірка 2,6 мм → ≈65 мбар */
const vacOpt=(m1000,hole)=>Math.round(cl(65*Math.pow(m1000/330,.45)*Math.pow(2.8/hole,.8),25,95));

function mkV(r_){const R=rng(hash([r_.group,r_.name,r_.num].join('|').toLowerCase().replace(/\s+/g,' '))),
 pk=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>Math.round(a+R()*(b-a)),rf=(a,b)=>a+R()*(b-a);
const pl=pk(PL),cr=pk(CROP),trk=pk(TRK),a=pk(cr.a),m1000=ri(cr.m[0],cr.m[1]),ds=f1(rf(cr.ds[0],cr.ds[1])),
 N=ri(cr.N[0],cr.N[1])*1000,
 /* планова швидкість агронома: для електроприводу вища, для класичного — як у технології */
 vp=f1(pl.drive=='електропривід'?rf(9,14):rf(7,10)),
 /* диск підбираємо під насінину: комірка 0,46…0,62 діаметра насінини */
 dsc=pk(DISC.filter(d=>d.hole/ds>=.46&&d.hole/ds<=.62)),hole=dsc.hole;
const V={a:pl,trk,crop:cr.c,m1000,ds,hole,zOpt:dsc.z,aMm:a,N,vp,rows:pl.rows,B:f1(pl.rows*a/100),
 Pneed:vacOpt(m1000,hole),                                 /* потрібний вакуум, мбар */
 Tg:f2(rf(.18,.32)),                                       /* запізнення GNSS-приймача, с */
 Tk:pl.Tk,                                                 /* спрацювання клапана/муфти, с */
 hTube:pl.h,                                               /* висота апарата над ґрунтом, см */
 S:ri(180,420),                                            /* площа поля, га */
 wedge:f1(rf(3.5,9)),                                      /* перекриття без секційного вимикання, % */
 pres:f1(rf(.8,1.8)),                                      /* залишкове перекриття з секційним вимиканням, % */
 Y:f1(rf(cr.Y[0],cr.Y[1])),Cp:ri(cr.C[0]/100,cr.C[1]/100)*100,Cn:ri(cr.Cs[0]/100,cr.Cs[1]/100)*100,
 Csys:pl.price*1000,
 id:'В-'+(hash(r_.group+r_.name+r_.num+'#id')%9000+1000),odd:r_.num%2==1};
/* приховані несправності */
const f={dirty:R()<.55?ri(1,V.rows):0,leak:R()<.5?ri(1,V.rows):0,cal:R()<.65?f1(rf(3,9))*(R()<.5?-1:1):0,tube:R()<.25?ri(1,V.rows):0};
if(f.leak==f.dirty&&f.leak)f.leak=f.leak%V.rows+1;
if(f.tube==f.dirty||f.tube==f.leak)f.tube=0;
V.fl=f;
/* час падіння насінини: трубка — вільне падіння, стрічка/надув — активна подача */
V.Tp=pl.del=='трубка'?f2(Math.sqrt(2*pl.h/100/9.81)):f2(pl.h/100/(pl.del=='стрічка'?2.2:3.0));
V.Tz=f2(V.Tg+V.Tk+V.Tp);
V.Sopt=f1(1e6/(V.N*V.aMm/100));                            /* потрібна відстань, см */
/* геометрія поля: довжина гону та кількість перетинів межі за поле */
V.L=Math.round(Math.sqrt(V.S*1e4)*rf(.7,1.4)/50)*50;       /* довжина гону, м */
V.ncr=Math.round(2*V.S*1e4/(V.B*V.L)*(1+V.wedge/20));      /* перетинів межі за поле */
V.vmax=V.a.vk;
V.ideal=idealQ(V);
return V}

/* Рекомендовані (еталонні) налаштування варіанта */
function idealQ(V){
 return{vac:V.Pneed,hole:V.hole,z:V.zOpt,v:f1(Math.min(V.vp,V.a.vk-2)),Tl:V.Tz,Tlon:V.Tz,sens:50}}

/* --- Висівний апарат: пропуски й двійники залежно від вакууму, комірки та швидкості --- */
/* паспортна межа обертів висівного диска, об/хв */
const nMax=V=>V.a.drive=='електропривід'?70:50;
/* оберти диска: n = 1667·v/(S·z) */
const discRPM=(v,S,z)=>1667*v/(S*z);

function meter(V,Q){const P=Q.vac,Pn=vacOpt(V.m1000,Q.hole),dv=(P-Pn)/Pn,
 /* замала комірка — насінина не утримується; завелика — провалюється або бере дві */
 hs=Q.hole/V.ds,                                           /* відносний розмір комірки */
 small=Math.max(0,.46-hs)/.46,big=Math.max(0,hs-.62)/.38,
 /* 1) межа подачі насіння: трубка проти стрічки/надуву — падає за 2 км/год до паспортної */
 ov=Math.max(0,Q.v-V.a.vk+2),
 /* 2) межа обертів диска: за 0,85 паспортної комірка не встигає набрати насінину */
 nd=discRPM(Q.v,Q.S||V.Sopt,Q.z||30),nm=nMax(V),
 ovk=Math.max(0,nd-.85*nm)/(.15*nm),
 lowv=Math.max(0,-dv),hiv=Math.max(0,dv);
let miss=.5+26*Math.pow(lowv,1.5)+60*small*small+1.5*Math.pow(ov,1.6)+8*Math.pow(ovk,1.8);
let dbl=.4+20*Math.pow(hiv,1.6)+45*big*big+.35*Math.pow(ov,1.2)+2*Math.pow(ovk,1.5);
if(Q.leak)miss+=Q.leak;                                     /* витік вакууму в ряді */
if(Q.block)miss+=Q.block;                                   /* часткове забивання насіннєпроводу */
miss=cl(miss,0,70);dbl=cl(dbl,0,45);
const sing=cl(100-miss-dbl,0,100);
/* нерівномірність: база + внесок помилок апарата, швидкості та обертів */
const cv=cl(11+1.15*(miss+dbl)+1.5*ov+7*ovk+(V.a.drive=='класичний'?2:0),8,95);
return{miss:f1(miss),dbl:f1(dbl),sing:f1(sing),cv:f1(cv),Pn:Pn,nd:f1(nd),nm:nm}}

/* --- Генерація інтервалів у рядку (для замірів і гістограми) --- */
function intervals(V,Q,row,seed,cnt){const r=rng(seed),mt=meter(V,{...Q,leak:Q.leaks&&Q.leaks[row]||0,block:Q.blocks&&Q.blocks[row]||0}),
 S=Q.S,out=[];let i=0;
while(out.length<cnt&&i<cnt*4){i++;const u=r()*100;
 if(u<mt.miss){                                           /* пропуск: інтервал близько 2S */
  out.push(f1(S*(2+.12*gs(r))))}
 else if(u<mt.miss+mt.dbl){                               /* двійник: дві насінини поряд */
  out.push(f1(S*(0.22+.12*r())));out.push(f1(S*(0.85+.06*gs(r))))}
 else out.push(f1(S*(1+mt.cv/100*gs(r))))}
return{iv:out.slice(0,cnt),mt}}

/* Показники за інтервалами (методика ISO 7256-1):
   пропуск — інтервал > 1,5S; двійник — інтервал ≤ 0,5S;
   cv — за всіма інтервалами, cvp — лише за одиничними (точність роботи апарата) */
function stats(iv,S){const nn=iv.length;if(!nn)return null;
 const miss=iv.filter(x=>x>1.5*S).length,dbl=iv.filter(x=>x<=.5*S).length,
 pr=iv.filter(x=>x>.5*S&&x<=1.5*S),
 mu=iv.reduce((a,b)=>a+b,0)/nn,
 sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mu)*(b-mu),0)/Math.max(1,nn-1)),
 mp=pr.length?pr.reduce((a,b)=>a+b,0)/pr.length:0,
 sp=pr.length>1?Math.sqrt(pr.reduce((a,b)=>a+(b-mp)*(b-mp),0)/(pr.length-1)):0;
return{n:nn,miss:f1(100*miss/nn),dbl:f1(100*dbl/nn),sing:f1(100*(nn-miss-dbl)/nn),
 mu:f1(mu),sd:f1(sd),cv:f1(100*sd/S),cvp:f1(100*sp/S)}}

/* --- Пробний прохід: усі ряди --- */
function pass(V,Q){const rows=[],seedBase=Q.seed;
for(let r=1;r<=V.rows;r++){
 const leak=(V.fl.leak==r&&!Q.fixLeak)?22:0,block=(V.fl.tube==r&&!Q.fixTube)?14:0,
 mt=meter(V,{...Q,leak,block}),
 dirty=(V.fl.dirty==r&&!Q.fixDirty);
 /* монітор бачить не те саме, що є насправді */
 const sensK=cl((Q.sens-50)/50,-1,1);                      /* чутливість датчика: −1 замала, +1 завелика */
 const mMiss=cl(mt.miss+(dirty?9:0)+Math.max(0,-sensK)*12,0,100),
       mDbl=cl(mt.dbl+Math.max(0,sensK)*9,0,100);
 rows.push({r,miss:mt.miss,dbl:mt.dbl,sing:mt.sing,cv:mt.cv,
  mMiss:f1(mMiss),mDbl:f1(mDbl),mSing:f1(cl(100-mMiss-mDbl,0,100)),dirty:dirty?1:0,leak:leak?1:0,block:block?1:0})}
const avg=k=>f1(rows.reduce((a,b)=>a+b[k],0)/rows.length);
/* похибка калібрування швидкості прямо переходить у норму висіву */
const calErr=Q.calFixed?0:V.fl.cal,Nfact=Math.round(V.N*(1+calErr/100)),
 Sfact=f1(1e6/(Nfact*V.aMm/100));
/* секційне вимикання */
/* ΔL>0 — секція вимикається запізно (пересів); ΔL<0 — завчасно (пропуск смуги) */
const dL=f2(Q.v/3.6*(V.Tz-Q.Tl)),dLon=f2(Q.v/3.6*(V.Tz-Q.Tlon)),
 ha=x=>x*V.B*V.ncr/2e4,                                    /* га: половина перетинів — вимикання, половина — включення */
 errA=f2(ha(Math.abs(dL))),                                /* га пересіву/пропуску на вимиканні */
 errAon=f2(ha(Math.abs(dLon))),                            /* те саме на включенні */
 over=f2(100*(ha(Math.max(0,dL))+ha(Math.max(0,-dLon)))/V.S),
 under=f2(100*(ha(Math.max(0,-dL))+ha(Math.max(0,dLon)))/V.S),
 seedLoss=Math.round((ha(Math.max(0,dL))+ha(Math.max(0,-dLon)))*V.Cn);
return{rows,miss:avg('miss'),dbl:avg('dbl'),sing:avg('sing'),cv:avg('cv'),
 mMiss:avg('mMiss'),mDbl:avg('mDbl'),mSing:avg('mSing'),
 Nfact,Sfact,calErr,dL,dLon,errA,errAon,over,under,seedLoss,
 bad:rows.filter(r=>r.miss>5||r.dbl>5).map(r=>r.r)}}

/* --- Калібрування датчика швидкості: контрольний пробіг --- */
const calRun=(V,L)=>f1(L*(1+V.fl.cal/100));

/* --- Економічна оцінка (завдання 4) ---
   kc — частка пропуску, що переходить у недобір урожаю (решту компенсують сусідні рослини);
   kd — те саме для двійників. Значення з довідкових даних, додаток А.
   p1 — показники ДО налагодження, p2 — ПІСЛЯ. */
const ECK={'кукурудза':[.70,.30],'соняшник':[.50,.25]};
/* Частка площі, яку встигають засіяти з несправністю до її виявлення:
   без системи контролю виявляють аж при огляді сходів, із системою — за хвилини. */
const KDET=[.35,.03],KD=f2(KDET[0]-KDET[1]);
function econ(V,p1,p2){const[kc,kd]=ECK[V.crop],
 L1=(p1.miss*kc+p1.dbl*kd)/100,L2=(p2.miss*kc+p2.dbl*kd)/100,
 dY=f2(V.Y*(L1-L2)*KD),                                    /* приріст урожайності, т/га */
 Ey=Math.round(dY*V.Cp*V.S),                               /* вигода від урожаю, грн/рік */
 dA=f1(V.S*(V.wedge-V.pres)/100),                          /* економія площі пересіву, га */
 Es=Math.round(dA*V.Cn),                                   /* вигода на насінні, грн/рік */
 Cex=Math.round(.10*V.Csys),                               /* обслуговування: 10 % вартості */
 E=Ey+Es,Enet=E-Cex;
return{kc,kd,kd1:KDET[0],kd2:KDET[1],KD,L1:f1(100*L1),L2:f1(100*L2),dY,Ey,dA,Es,Cex,E,Enet,
 T:Enet>0?f2(V.Csys/Enet):null}}

/* --- Бали: 15 + 18 + 22 + 15 + 20 + 10 = 100 --- */
const pen=(e,t,s)=>e<=t?0:Math.min(1,(e-t)/s);
const okn=(x,y,t)=>x!==''&&x!=null&&n(x)!=null&&Math.abs(n(x)-y)<=t;
function score(S_,V){const r=[0,0,0,0,0,0],q=Qs(S_,V);
/* 1. Датчики й калібрування — 15 */
{const f=V.fl,ck=S_.ck||{};let k=0;
 const said=(pre,val)=>Object.keys(ck).some(x=>x[0]==pre&&ck[x]==val);
 k+=(f.dirty?ck['s'+f.dirty]=='Забруднений датчик':!said('s','Забруднений датчик'))?4:0;
 k+=(f.leak?ck['s'+f.leak]=='Витік вакууму':!said('s','Витік вакууму'))?4:0;
 k+=(f.tube?ck['s'+f.tube]=='Забитий насіннєпровід':!said('s','Забитий насіннєпровід'))?2:0;
 k+=S_.calDone?(S_.calFixed?3:1):0;
 k+=S_.vacRead!=null?2:0;
 r[0]=k}
/* 2. Норма висіву й привід: збіг розрахунку S і n — 18 */
{const b=S_.bd||{},S0=1e6/(V.N*V.aMm/100),z=S_.z||30,n0=1667*(n(S_.tv)||V.vp)/(S0*z);
 r[1]=(okn(b.S,S0,Math.max(.3,S0*.02))?8:0)+(okn(b.n,n0,Math.max(.4,n0*.02))?7:0)+(S_.z?3:0)}
/* 3. Вакуум і диск — 22 */
{const mt=meter(V,q);
 r[2]=10*(1-pen(mt.miss,2,8))+7*(1-pen(mt.dbl,2,8))+5*(1-pen(mt.cv,25,20))}
/* 4. Секційне вимикання — 15 */
{const b=S_.bd||{},dL=Math.abs((n(S_.tv)||V.vp)/3.6*(V.Tz-(n(S_.Tl)??0)));
 r[3]=(okn(b.Tz,V.Tz,.03)?5:0)+6*(1-pen(dL,.2,.8))+(n(S_.Tlon)!=null?4:0)}
/* 5. Пробний прохід і заміри — 20 */
{const l=S_.tr&&S_.tr.last;if(l){const o=own(S_);
  const okm=o&&o.n>=30?[okn(S_.tr.oMiss,o.miss,3),okn(S_.tr.oDbl,o.dbl,3),okn(S_.tr.oCv,o.cvp,5)].filter(Boolean).length:0;
  r[4]=8*(1-pen(l.miss,3,10))+4*(1-pen(l.dbl,3,10))+2*(1-pen(Math.abs(l.dL),.2,.8))+6*okm/3}}
/* 6. Економічна оцінка — 10 */
{const e=ecRef(S_,V),b=S_.ec||{};
 if(e)r[5]=(okn(b.dY,e.dY,Math.max(.02,Math.abs(e.dY)*.05))?4:0)
          +(okn(b.E,e.E,Math.max(500,e.E*.03))?3:0)
          +(e.T!=null&&okn(b.T,e.T,Math.max(.05,e.T*.08))?3:0)}
return r.map(x=>Math.max(0,Math.round(x*10)/10))}

/* Еталонна економіка: «до» — перший прохід студента, «після» — останній */
function ecRef(S_,V){const h=S_.hist||[];if(h.length<1)return null;
 const a=h[0],b=h[h.length-1];
 return econ(V,{miss:a.miss,dbl:a.dbl},{miss:b.miss,dbl:b.dbl})}

/* Параметри поточного налаштування */
function Qs(S_,V,o){return Object.assign({vac:n(S_.vac)||V.Pneed,hole:n(S_.hole)||V.hole,z:S_.z||V.zOpt,
 v:n(S_.tv)||V.ideal.v,S:V.Sopt,sens:S_.sens??50,
 Tl:n(S_.Tl)??0,Tlon:n(S_.Tlon)??0,calFixed:!!S_.calFixed,
 fixDirty:!!S_.fixDirty,fixLeak:!!S_.fixLeak,fixTube:!!S_.fixTube,
 seed:hash(V.id)+(S_.tr?S_.tr.n:0)},o||{})}

/* Власні заміри студента */
function own(S_){const m=S_.tr&&S_.tr.m;if(!m||!m.length)return null;return stats(m,S_.tr.Sm)}
/* ===== Стан, збереження, прохід, протокол ===== */
/* Приклад із методички: цей «студент» дає демо-варіант, з яким симулятор відкривається вперше */
const DEMO={group:'Приклад',name:'Демонстраційний приклад',num:11};
/* Число для показу: десяткова кома, мінус як «−» */
const F=(x,d)=>{if(x===''||x==null||(typeof x=='number'&&isNaN(x)))return'—';const s=d==null?String(x):Number(x).toFixed(d);return s.replace('.',',').replace('-','−')};
const r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100,r3=x=>Math.round(x*1000)/1000;
const TH=x=>String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vs=x=>esc(String(x??'').replace('.',','));
const NAR=()=>innerWidth<620;
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.tr)S=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let V=S&&S.reg?mkV(S.reg):null,AN=0;
const TT=['Реєстрація й варіант','1. Монітор і діагностика рядів','2. Норма висіву й висівний апарат',
          '3. Секційне вимикання','4. Пробний прохід і заміри','5. Економічна оцінка',
          'Підсумковий протокол','Досліди «що буде, якщо…»','Калькулятор'];
const LAB=7,CALC=8,NST=6;
/* Можливі діагнози для ряду (завдання 1) */
const DIAG=['—','Норма','Забруднений датчик','Витік вакууму','Забитий насіннєпровід'];
/* Контрольна довжина пробігу для калібрування датчика швидкості, м */
const CALL=100;

/* ---------- Тема ---------- */
function theme(t){const o=['auto','light','dark'];let i=o.indexOf(localStorage.getItem(TKEY)||'auto');
 if(t!==0){i=(i+1)%3;try{localStorage.setItem(TKEY,o[i])}catch(e){}}
 const v=o[i];if(v=='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);
 const b=document.getElementById('thb');if(b)b.textContent='Тема: '+({auto:'авто',light:'світла',dark:'темна'})[v];
 if(t!==0&&typeof R=='function')R()}

/* ---------- Порожній стан ---------- */
function blank(){return{reg:null,step:0,ck:{},chk:{vac:0,dig:0,tube:0},
 calDone:0,calShown:null,calFixed:0,vacRead:null,
 z:0,hole:0,vac:'',sens:50,tv:'',bd:{S:'',n:'',Tz:''},Tl:'',Tlon:'',
 fixDirty:0,fixLeak:0,fixTube:0,
 tr:{n:0,last:null,m:[],Sm:0,sel:1,oMiss:'',oDbl:'',oCv:''},hist:[],ec:{dY:'',E:'',T:''},
 lab:{vac:0,hole:0,z:0,v:0,Tl:0,sens:50,fl:{dirty:0,leak:0,tube:0},pin:null,log:[]},
 calc:{N:'',a:'',v:'',z:'',B:'',Tg:'',Tk:'',Tp:'',Tl:'',S:'',Y:'',Cp:'',p1:'',p2:'',k:'',Csys:''}}}

/* ---------- Поточні налаштування апарата ---------- */
const QS=o=>Qs(S,V,o);
/* Вакуум, який реально стоїть у системі (якщо студент нічого не вводив — рекомендований) */
const vacNow=()=>n(S.vac)??V.Pneed;
const holeNow=()=>S.hole||V.hole;
const zNow=()=>S.z||V.zOpt;
const vNow=()=>n(S.tv)||V.ideal.v;
const Snow=()=>n(S.bd.S)||V.Sopt;

/* ---------- Прилади для діагностики (завдання 1) ---------- */
/* Вакуум у секції: у ряді з витоком падає до ~0,62 від заданого */
const vacRow=r=>Math.round(vacNow()*(V.fl.leak==r?.62:1)*(1+((hash(V.id+'v'+r)%7)-3)/200));
/* Контрольне підкопування 10 м: фактичні пропуски, %, без участі датчика */
function digRow(r){const q=QS({fixDirty:0,fixLeak:0,fixTube:0}),
 leak=V.fl.leak==r?22:0,block=V.fl.tube==r?14:0;
 return meter(V,{...q,leak,block}).miss}
/* Огляд насіннєпроводу */
const tubeRow=r=>V.fl.tube==r?'частково забитий':'вільний';
/* Що показує монітор у кабіні під час діагностичного проходу */
function monRow(r){const q=QS({fixDirty:0,fixLeak:0,fixTube:0,sens:50}),
 leak=V.fl.leak==r?22:0,block=V.fl.tube==r?14:0,mt=meter(V,{...q,leak,block}),
 dirty=V.fl.dirty==r;
 const mm=cl(mt.miss+(dirty?9:0),0,100),md=cl(mt.dbl,0,100);
 return{miss:r1(mm),dbl:r1(md),sing:r1(cl(100-mm-md,0,100)),alarm:mm>5||md>5}}
/* Правильний діагноз ряду */
const trueDiag=r=>V.fl.dirty==r?'Забруднений датчик':V.fl.leak==r?'Витік вакууму':V.fl.tube==r?'Забитий насіннєпровід':'Норма';

/* ---------- Калібрування датчика швидкості ---------- */
function calGo(){S.calDone=1;S.calShown=calRun(V,CALL);save();R()}
const calErrPct=()=>S.calShown==null?null:r1(100*(S.calShown-CALL)/CALL);

/* ---------- Пробний прохід ---------- */
function runCore(){const q=QS({}),p=pass(V,q),t=S.tr;
 t.last={...p,v:q.v,S:q.S,vac:q.vac,hole:q.hole,z:q.z,sens:q.sens,Tl:q.Tl,Tlon:q.Tlon,
  fx:{d:q.fixDirty?1:0,l:q.fixLeak?1:0,t:q.fixTube?1:0,c:q.calFixed?1:0},seed:q.seed};
 t.n++;t.m=[];t.Sm=q.S;t.sel=p.bad.length?p.bad[0]:1;
 (S.hist=S.hist||[]).push({n:t.n,v:q.v,vac:q.vac,hole:q.hole,z:q.z,Tl:q.Tl,sens:q.sens,
  miss:p.miss,dbl:p.dbl,sing:p.sing,cv:p.cv,dL:p.dL,over:p.over,Nfact:p.Nfact,bad:p.bad.length});

function run(){if(!n(S.vac))return alert('Задайте вакуум у системі (крок 2).');

 cr=Math.min(5,2*Math.PI*(R-13)/z/2-.9),rs=V.ds*SC/2,rh=hole*SC/2;
let s=ci(cx,cy,R,C('pn'),{stroke:C('stl'),stroke_width:2})+ci(cx,cy,R-26,C('pn2'),{stroke:C('ln'),stroke_width:1})+ci(cx,cy,8,C('stl'));
for(let i=0;i<z;i++){const a=2*Math.PI*i/z;s+=ci(cx+(R-13)*Math.cos(a),cy+(R-13)*Math.sin(a),cr,C('db'),{opacity:.65})}
s+=T(cx,cy+R+18,'висівний диск, z = '+z,{a:'middle',s:10,c:C('sub')});
/* 1) вигляд зверху: насінина і комірка поруч, у масштабі */
const bx=236,hx=bx+rs+34+rh;
s+=T(bx-rs,30,'У масштабі, вигляд зверху:',{s:10.5,b:1,c:C('sub')});
s+=ci(bx,cy,rs,C('seed'),{stroke:C('seed2'),stroke_width:1.4})+T(bx,cy-rs-8,'насінина',{a:'middle',s:9.5,c:C('seed2')});
s+=ci(hx,cy,rh,C('db'),{opacity:.8,stroke:C('ink'),stroke_width:1.2})+T(hx,cy-rs-8,'комірка',{a:'middle',s:9.5,c:C('sub')});
s+=dimH(bx-rs,bx+rs,cy+rs+22,'d_нас = '+F(V.ds,1)+' мм',C('seed2'));
s+=dimH(hx-rh,hx+rh,cy+rs+22,'d_к = '+F(hole,1)+' мм',C('ink'));
/* 2) розріз: насінина сидить на комірці, вакуум тримає її знизу */
const sx=470,sy=132;
s+=T(sx,30,'Розріз диска:',{a:'middle',s:10.5,b:1,c:C('sub')});
s+=rc(sx-74,sy,148,18,C('stl'),{opacity:.35});
s+=rc(sx-rh,sy-1,2*rh,20,C('pn2'),{stroke:C('ink'),stroke_width:1.1});
s+=ci(sx,sy-rs*.78,rs,C('seed'),{stroke:C('seed2'),stroke_width:1.4});
s+=T(sx,sy-rs*.78-rs-9,'насінина',{a:'middle',s:9.5,c:C('seed2')});
s+=T(sx-78,sy+13,'диск',{a:'end',s:9.5,c:C('sub')});
for(const dx of [-7,7])s+=ln(sx+dx,sy+46,sx+dx,sy+24,C('vac'),1.6)+pg([[sx+dx,sy+22],[sx+dx-3.4,sy+28],[sx+dx+3.4,sy+28]],C('vac'));
s+=T(sx,sy+60,'вакуум',{a:'middle',s:9.5,c:C('vac'),b:1});
/* висновок */
const rt=hole/V.ds,ok=rt>=.46&&rt<=.62;
s+=T(bx-rs,h-26,'d_к / d_нас = '+F(r2(rt),2),{s:11.5,b:1,c:ok?C('ac'):C('wn')});
s+=T(bx-rs,h-8,rt<.46?'замало: насінина не утримується на комірці':rt>.62?'забагато: насінина провалюється, беруться дві':'у робочому діапазоні 0,46…0,62',
 {s:10,c:ok?C('ac'):C('wn')});
return'<div class="fig"><div class="sx">'+sv(w,h)[0]+s+sv(w,h)[1]+'</div>'+
 (o.cap?'<div class="cap">'+o.cap+'</div>':'')+'</div>'}

/* Загальні дрібниці інтерфейсу */
const H=(t,k)=>'<h2>'+esc(t)+'</h2>'+(k?'<p class="hint">'+k+'</p>':'');
const inp=(k,lab,ph,o)=>{o=o||{};const id='i_'+k.replace(/\./g,'_');

function scr2(){const rf=ref(),Q=QS({}),mt=meter(V,Q);
let s=H('Крок 2. Норма висіву, диск і вакуум',

s+='<h3>2.1. Розрахунок</h3>';
s+='<div class="r2"><div>'+inp('bd.S','Крок висіву S, см — відстань між насінинами в рядку','наприклад, 20,4')+

s+='<details class="inf"><summary>Звідки беруться ці дві формули</summary>'+
 '<p>На одному гектарі 10<sup>6</sup> см². Один рядок із міжряддям <i>a</i> м обслуговує смугу шириною <i>a</i>·100 см, тому довжина рядків на гектарі — 10<sup>6</sup>/(a·100) см. Поділивши її на кількість насінин N, дістаємо крок висіву S = 10<sup>6</sup>/(N·a) см, де a — у метрах.</p>'+
 '<p>Диск має викинути одну насінину на кожні S см шляху. За хвилину сівалка проходить v·1000/60 м = v·100000/60 см. Поділивши на S, дістаємо насінин за хвилину, а поділивши ще на z комірок — оберти диска: n = 1667·v/(S·z).</p>'+

  else{ANI.fall.push({t:0,dbl:o.k=='dbl',k:ANI.pend?'miss':o.k,gap:ANI.pend?(ANI.pend+1)*Q.S:0});ANI.pend=0}}

 s+=chart('l2',[{name:'одиничність, %',color:C('ac'),pts:sv_},{name:'CV, %',color:C('am'),pts:cv_}],
  {h:190,y1:105,xl:'швидкість, км/год',vl:[[V.a.vk,C('wn'),'паспортна межа'],[L.v,C('ink'),'зараз']],bands:[[95,105,C('ac')]]})}
s+='<div class="concl">'+labConcl(mt,p,L)+'</div>';
if(L.log.length){s+='<h3>Журнал дослідів</h3><div class="tw"><table class="t2 c"><tr><th>№</th><th>вакуум</th><th>комірка</th><th>z</th><th>v</th><th>T_лід</th><th>несправності</th><th>пропуски</th><th>двійники</th><th>одиничність</th><th>CV</th></tr>';
 L.log.forEach((r,i)=>{s+='<tr><td>'+(i+1)+'</td><td>'+F(r.set.vac)+'</td><td>'+F(r.set.hole,1)+'</td><td>'+r.set.z+'</td><td>'+F(r.set.v,1)+'</td><td>'+F(r.set.Tl,2)+'</td><td>'+esc(flDesc(r.set.fl)||'—')+'</td><td>'+F(r.miss,1)+'</td><td>'+F(r.dbl,1)+'</td><td>'+F(r.sing,1)+'</td><td>'+F(r.cv,1)+'</td></tr>'});
 s+='</table></div><button class="g sm" onclick="labClr()">Очистити журнал</button>'}
s+=nb([6,'Протокол'],[8,'Калькулятор']);
return s}
const sld=(k,lab,u,a,b,st,v,nt)=>'<div><label>'+esc(lab)+': <b>'+F(v,st<1?2:(st<1?1:0))+'</b> '+esc(u)+'</label>'+
 '<input type="range" min="'+a+'" max="'+b+'" step="'+st+'" value="'+v+'" oninput="setN(\''+k+'\',+this.value)">'+
 (nt?'<p class="hint" style="margin:0 0 6px">'+esc(nt)+'</p>':'')+'</div>';
function labDisc(i){const d=DISC[i];S.lab.z=d.z;S.lab.hole=d.hole;save();R()}
function labFl(k){S.lab.fl[k]=S.lab.fl[k]?0:1;save();R()}
function labSt(){const L=S.lab;return{vac:L.vac,hole:L.hole,z:L.z,v:L.v,sens:L.sens,Tl:L.Tl,fl:{...L.fl}}}
function labMt(){const L=S.lab;return meter(V,{vac:L.vac,hole:L.hole,z:L.z,v:L.v,S:V.Sopt,sens:L.sens,
 leak:L.fl.leak?22:0,block:L.fl.tube?14:0})}
function labPin(){const m=labMt();S.lab.pin={...m,set:labSt()};save();R()}
function labUnpin(){S.lab.pin=null;save();R()}
function labLog(){const m=labMt();S.lab.log.push({...m,set:labSt()});if(S.lab.log.length>14)S.lab.log.shift();save();R()}
function labClr(){S.lab.log=[];save();R()}
function labRst(){const I=V.ideal;S.lab={...S.lab,vac:I.vac,hole:I.hole,z:I.z,v:I.v,Tl:V.Tz,sens:50,fl:{dirty:0,leak:0,tube:0}};save();R()}
const flDesc=f=>[f.dirty&&'брудна оптика',f.leak&&'витік',f.tube&&'забитий провід'].filter(Boolean).join(', ');
const labDesc=s=>F(s.vac)+' мбар, '+F(s.hole,1)+' мм, z='+s.z+', '+F(s.v,1)+' км/год, T_лід '+F(s.Tl,2)+' с'+(flDesc(s.fl)?', '+flDesc(s.fl):'');
function labConcl(mt,p,L){const u=[],rt=L.hole/V.ds,dl=L.v/3.6*(V.Tz-L.Tl);
 u.push(vacNear(L.vac,mt.Pn)?'вакуум '+F(L.vac)+' мбар відповідає насінню й комірці':
  L.vac<mt.Pn?'вакуум занизький на '+F(Math.round(100*(mt.Pn-L.vac)/mt.Pn))+' % — звідси пропуски '+F(mt.miss,1)+' %':
  'вакуум зависокий на '+F(Math.round(100*(L.vac-mt.Pn)/mt.Pn))+' % — звідси двійники '+F(mt.dbl,1)+' %');
 u.push(rt<.46?'комірка '+F(L.hole,1)+' мм замала для насінини '+F(V.ds,1)+' мм (d_к/d_нас = '+F(r2(rt),2)+'): насінина не утримується':
  rt>.62?'комірка завелика (d_к/d_нас = '+F(r2(rt),2)+'): насінина провалюється, беруться дві':
  'співвідношення комірки й насінини у робочому діапазоні');
 u.push(L.v>V.a.vk-2?'швидкість '+F(L.v,1)+' км/год за межею для приводу «'+esc(V.a.drive)+'» (паспортна '+F(V.a.vk)+' км/год): якість падає':
  mt.nd>.85*mt.nm?'оберти диска '+F(r1(mt.nd),1)+' об/хв близькі до межі '+F(mt.nm)+' — комірка не встигає набрати насінину':
  'швидкість і оберти диска у допустимих межах');
 u.push(Math.abs(dl)<=.2?'випередження T_лід узгоджене з запізненням: ΔL = '+F(r2(dl),2)+' м':
  'ΔL = '+F(r2(dl),2)+' м '+(dl>0?'пересіву':'пропуску')+' — T_лід відрізняється від T_заг на '+F(r2(Math.abs(V.Tz-L.Tl)),2)+' с');
 if(L.sens<40)u.push('занижена чутливість датчика ('+L.sens+' %) дає хибні тривоги навіть при справному апараті');
 if(L.sens>60)u.push('завищена чутливість ('+L.sens+' %) рахує одну насінину за дві — монітор занижує пропуски');
 if(flDesc(L.fl))u.push('внесені несправності: '+flDesc(L.fl));
 return'<b>Що показує цей набір налаштувань:</b><ul><li>'+u.join('</li><li>')+'</li></ul>'}
const vacNear=(a,b)=>Math.abs(a-b)/b<=.05;

/* ---------- 8. Калькулятор ---------- */
function scr8(){const c=S.calc,g=k=>n(c[k]);
let s=H('Калькулятор','Незалежний від варіанта. Сюди підставляють числа із ситуацій методички й перевіряють свої розрахунки.');
s+='<h3>Норма висіву й оберти диска</h3>';
s+='<div class="r3"><div>'+inp('calc.N','N — норма висіву, шт/га','70000')+'</div>'+
 '<div>'+inp('calc.a','a — міжряддя, см','70')+'</div>'+
 '<div>'+inp('calc.v','v — швидкість, км/год','9')+'</div></div>';
s+='<div class="r3"><div>'+inp('calc.z','z — комірок на диску','30')+'</div><div></div><div></div></div>';
if(g('N')&&g('a')){const S0=1e6/(g('N')*g('a')/100);
 s+='<div class="tw"><table class="t2">'+
  tr('Крок висіву','S = 10⁶ / (N · a) = 10⁶ / ('+TH(g('N'))+' · '+F(g('a')/100,2)+') = <b>'+F(r1(S0),1)+' см</b>')+
  (g('v')&&g('z')?tr('Оберти диска','n = 1667 · v / (S · z) = 1667 · '+F(g('v'),1)+' / ('+F(r1(S0),1)+' · '+F(g('z'))+') = <b>'+F(r1(discRPM(g('v'),S0,g('z'))),1)+' об/хв</b>'):'')+
  (g('v')?tr('Насінин за секунду','v/3,6 / (S/100) = <b>'+F(r1(g('v')/3.6/(S0/100)),1)+' шт/с</b> на один ряд'):'')+
  '</table></div>'}
s+='<h3>Часовий бюджет секційного вимикання</h3>';
s+='<div class="r3"><div>'+inp('calc.Tg','T_GNSS, с','0,25')+'</div><div>'+inp('calc.Tk','T_кл, с','0,35')+'</div><div>'+inp('calc.Tp','T_пад, с','0,25')+'</div></div>';
s+='<div class="r3"><div>'+inp('calc.Tl','T_лід, с','0,5')+'</div><div>'+inp('calc.B','B — ширина захвату, м','5,6')+'</div><div></div></div>';
if(g('Tg')!=null&&g('Tk')!=null&&g('Tp')!=null&&g('v')){const Tz=g('Tg')+g('Tk')+g('Tp'),Tl=g('Tl')??0,d=Tz-Tl,dl=g('v')/3.6*d;
 s+='<div class="tw"><table class="t2">'+
  tr('Сумарне запізнення','T_заг = '+F(g('Tg'),2)+' + '+F(g('Tk'),2)+' + '+F(g('Tp'),2)+' = <b>'+F(r2(Tz),2)+' с</b>')+
  tr('Неузгодженість','T_заг − T_лід = '+F(r2(d),2)+' с')+
  tr('Шлях помилки','ΔL = v/3,6 · (T_заг − T_лід) = '+F(g('v'),1)+'/3,6 · '+F(r2(d),2)+' = <b>'+F(r2(dl),2)+' м</b> '+(d>0?'пересіву':d<0?'пропуску':''))+
  (g('B')?tr('Площа на одному перетині','ΔL · B = '+F(r2(Math.abs(dl)),2)+' · '+F(g('B'),1)+' = <b>'+F(r1(Math.abs(dl)*g('B')),1)+' м²</b>'):'')+
  '</table></div>'}
s+='<h3>Економічна оцінка</h3>';
s+='<div class="r3"><div>'+inp('calc.S','S_пл — площа, га','300')+'</div><div>'+inp('calc.Y','Y — урожайність, т/га','9,0')+'</div><div>'+inp('calc.Cp','C_прод — ціна, грн/т','7500')+'</div></div>';
s+='<div class="r3"><div>'+inp('calc.p1','p₁ — втрати до, %','5')+'</div><div>'+inp('calc.p2','p₂ — втрати після, %','1')+'</div><div>'+inp('calc.k','k — виграна частка площі','0,32')+'</div></div>';
s+='<div class="r3"><div>'+inp('calc.Csys','C_сист — вартість системи, грн','150000')+'</div><div></div><div></div></div>';
if(g('S')&&g('Y')&&g('Cp')&&g('p1')!=null&&g('p2')!=null){const kk=g('k')??1,dY=g('Y')*(g('p1')-g('p2'))/100*kk,E=dY*g('Cp')*g('S'),
 Cs=g('Csys')||0,Cex=.1*Cs,En=E-Cex;
 s+='<div class="tw"><table class="t2">'+
  tr('Приріст урожайності','ΔY = Y · (p₁ − p₂)/100 · k = '+F(g('Y'),1)+' · '+F(r1(g('p1')-g('p2')),1)+'/100 · '+F(kk,2)+' = <b>'+F(r2(dY),2)+' т/га</b>')+
  tr('Вигода','E = ΔY · C_прод · S_пл = '+F(r2(dY),2)+' · '+TH(g('Cp'))+' · '+F(g('S'))+' = <b>'+TH(E)+' грн/рік</b>')+
  (Cs?tr('Обслуговування','C_екс = 0,10 · '+TH(Cs)+' = '+TH(Cex)+' грн/рік'):'')+
  (Cs?tr('Чиста вигода','E_чист = '+TH(E)+' − '+TH(Cex)+' = <b>'+TH(En)+' грн/рік</b>'):'')+
  (Cs&&En>0?tr('Термін окупності','T = C_сист / E_чист = '+TH(Cs)+' / '+TH(En)+' = <b>'+F(r2(Cs/En),2)+' року</b>'):'')+
  '</table></div>'}
s+='<p class="hint">Усі формули ті самі, що в методичці. Калькулятор нічого не підказує — він лише рахує за вашими числами.</p>';
s+=nb([7,'Досліди'],null);
return s}

/* ===== Навігація, бічна панель, рендер ===== */
function go(i){S.step=i;save();scrollTo(0,0);R()}
function nav(){let s='';
for(let i=0;i<=NST;i++){const d=done(i),cl_=S.step==i?' on':'';
 s+='<button class="'+cl_.trim()+'" onclick="go('+i+')"'+(i>0&&!S.reg?' disabled':'')+'>'+
  '<i class="'+(d==1?'ok':d?'pt':'')+'"></i>'+esc(TT[i])+'</button>'}
s+='<button class="lab'+(S.step==LAB?' on':'')+'" onclick="go('+LAB+')"'+(!S.reg?' disabled':'')+'><i></i>'+esc(TT[LAB])+'</button>';
s+='<button class="lab'+(S.step==CALC?' on':'')+'" onclick="go('+CALC+')"><i></i>'+esc(TT[CALC])+'</button>';
return s}
function dashP(){if(!V)return'<div class="t">МОНІТОР ВИСІВУ</div><div class="d"><span>варіант не отримано</span></div>';
const l=S.tr.last,mt=meter(V,QS({})),d=(a,b,al)=>'<div class="d'+(al?' al':'')+'"><span>'+a+'</span><span>'+b+'</span></div>';
let s='<div class="t">МОНІТОР ВИСІВУ · '+esc(V.id)+'</div>';
s+=d('культура',esc(V.crop));
s+=d('норма, шт/га',TH(V.N));
s+=d('крок S, см',F(r1(V.Sopt),1));
s+=d('вакуум, мбар',F(vacNow()),Math.abs(vacNow()-mt.Pn)/mt.Pn>.1);
s+=d('диск','z '+zNow()+' · '+F(holeNow(),1)+' мм');
s+=d('оберти, об/хв',F(r1(mt.nd),1),mt.nd>.85*mt.nm);
s+=d('швидкість, км/год',F(vNow(),1),vNow()>V.a.vk-2);
s+=d('T_заг, с',F(V.Tz,2));
s+=d('T_лід, с',F(n(S.Tl)??0,2),Math.abs((n(S.Tl)??0)-V.Tz)>.1);
if(l){s+='<div class="t" style="margin-top:8px">ПРОХІД №'+S.tr.n+'</div>';
 s+=d('пропуски, %',F(l.miss,1),l.miss>5);
 s+=d('двійники, %',F(l.dbl,1),l.dbl>5);
 s+=d('одиничність, %',F(l.sing,1),l.sing<95);
 s+=d('CV, %',F(l.cv,1),l.cv>30);
 s+=d('ΔL, м',F(l.dL,2),Math.abs(l.dL)>.2);
 s+=d('тривога по рядах',l.bad.length?l.bad.join(','):'немає',l.bad.length>0)}
return s}
function bann(){if(!S.demo)return'';
return'<div class="bn"><span><b>Відкрито приклад із методички.</b> Усі поля заповнені правильними значеннями — на ньому видно, як має виглядати виконана робота. Для свого звіту отримайте власний варіант.</span>'+
 '<button class="p" style="margin:0" onclick="go(0)">Отримати свій варіант</button></div>'}
function R(){const m=document.getElementById('mn');
 document.getElementById('nv').innerHTML=nav();
 document.getElementById('bn').innerHTML=bann();
 document.getElementById('ds').innerHTML=dashP();
 document.getElementById('chip').textContent=V?('варіант '+V.id+' · '+F(r1(tot()),1)+' / 100'):'варіант не отримано';
 if(!S.reg||!V){S.step=0}
 m.innerHTML=[scr0,scr1,scr2,scr3,scr4,scr5,scr6,scr7,scr8][S.step]();
 /* наведення на графіки */
 for(const id of ['c3','c5','ch','l1','l2'])chBind(id,chTip(id));
 if(ANI.run){ANI.last=performance.now();requestAnimationFrame(aniTick)}}
function chTip(id){const Q=V?QS({}):null,L=S.lab;
 if(id=='c3')return x=>x<0?null:'T_лід = '+F(r2(x),2)+' с<br>ΔL = '+F(r2(vNow()/3.6*(V.Tz-x)),2)+' м';
 if(id=='c5'){const e=ecRef(S,V);return e?x=>x<0?null:'рік '+F(r2(x),2)+'<br>накопичено '+TH(e.Enet*x)+' грн':()=>null}
 if(id=='ch')return x=>{const r=S.hist[Math.round(x)-1];return r?'прохід №'+r.n+'<br>одиничність '+F(r.sing,1)+' %<br>v = '+F(r.v,1)+' км/год, вакуум '+F(r.vac)+' мбар':null};
 if(id=='l1')return x=>{const m=meter(V,{vac:Math.round(x),hole:L.hole,z:L.z,v:L.v,S:V.Sopt});
  return'вакуум '+F(Math.round(x))+' мбар<br>пропуски '+F(m.miss,1)+' %<br>двійники '+F(m.dbl,1)+' %'};
 if(id=='l2')return x=>{const m=meter(V,{vac:L.vac,hole:L.hole,z:L.z,v:r1(x),S:V.Sopt});
  return F(r1(x),1)+' км/год<br>одиничність '+F(m.sing,1)+' %<br>CV '+F(m.cv,1)+' %<br>оберти '+F(r1(m.nd),1)+' об/хв'};
 return()=>null}
/* ===== Запуск ===== */
theme(0);
if(!S){demoState();save()}            /* перше відкриття: приклад із методички */
let RW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-RW)>8){RW=innerWidth;clearTimeout(R.t);R.t=setTimeout(R,180)}});
R();
</script></body></html>
